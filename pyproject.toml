[project]
name = "jarvis-rd-assistant"
version = "0.1.0"
description = "Self-hosted AI-powered research assistant"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing baseline lint noise not in scope for Round 9.
# Tests frequently need sys.modules injection before app imports (E402)
# and include long fixture strings / SQL (E501).
"services/paper_ingestion/tests/*" = ["E402", "E501"]
"services/learning_engine/tests/*" = ["E501"]
"libs/jarvis_common/tests/*" = ["E501"]
"scripts/*" = ["E402"]
# Long SQL / prompt template strings in app code.
"services/paper_ingestion/app/extraction.py" = ["E501"]
"services/paper_ingestion/app/routers/extractions.py" = ["E501"]
"services/paper_ingestion/app/routers/priority.py" = ["E501"]
"services/paper_ingestion/app/pdf_processor.py" = ["E501", "N806"]
"services/paper_ingestion/app/verification.py" = ["E501", "N806"]
"services/paper_ingestion/app/models.py" = ["UP042"]
"services/paper_ingestion/app/sources/registry.py" = ["UP047"]
"services/learning_engine/app/converters.py" = ["E501"]
"libs/jarvis_common/jarvis_common/error_handlers.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "services/paper_ingestion/tests",
    "services/learning_engine/tests",
    "services/telegram_bot/tests",
    "libs/jarvis_common/tests",
]
