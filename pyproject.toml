[project]
name = "jarvis-rd-assistant"
version = "1.2.5"
description = "Self-hosted research workspace for evidence-grounded literature discovery and synthesis"
readme = "README.md"
authors = [{ name = "Ferhat Fidan", email = "jarvis-rd@limitcycle.dev" }]
maintainers = [{ name = "Ferhat Fidan", email = "jarvis-rd@limitcycle.dev" }]
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["research-assistant", "scientific-literature", "rag", "self-hosted", "zotero"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Documentation = "https://limitcycle-oss.github.io/jarvis-rd-assistant/"
Repository = "https://github.com/limitcycle-oss/jarvis-rd-assistant"
Issues = "https://github.com/limitcycle-oss/jarvis-rd-assistant/issues"
Authors = "https://github.com/limitcycle-oss/jarvis-rd-assistant/blob/main/AUTHORS.md"

[dependency-groups]
jarvis-common = [
    "aiosmtplib>=3.0,<6.0",  # SMTP delivery for magic-link auth
    "asyncpg-listen>=0.0.9",
    "asyncpg>=0.30.0,<0.32.0",
    "cryptography>=50.0.0",  # >=50.0.0 clears GHSA-g6cj-pr64-35w5 and prior cryptography advisories
    "email-validator>=2.0",  # backs pydantic EmailStr
    "fastapi>=0.137.0,<0.141.0",
    "gitpython>=3.1.58",  # >=3.1.58 clears the current GitPython advisory set
    "httpx>=0.27.0",
    "httpcore>=1.0,<1.1",  # direct API used by pinned outbound transport
    "idna>=3.15",
    "instructor>=1.15.0",
    "langfuse>=2.50",
    "lxml>=6.1.0",  # SEC-3: cached_transport uses lxml for hardened XML parsing
    "openai>=2.0.0",
    "opentelemetry-sdk>=1.41.1",  # llm_client imports opentelemetry.sdk.trace at module scope
    "procrastinate[aiopg]>=0.49",
    "psycopg[binary]>=3.1",  # procrastinate 3.x imports psycopg unconditionally; bundled libpq
    "pydantic-settings>=2.0",
    "pydantic>=2.0,<3.0.0",
    "rapidfuzz>=3.0.0",  # libs/jarvis_common runtime dep (was previously absent from root group)
    "sentry-sdk>=2.29.0",  # sentry.py subclasses HttpTransport at class-definition time
    "slowapi>=0.1.9",
    "starlette>=1.3.1",
    "structlog>=24.0",
    "urllib3>=2.7.0",
    "uvicorn>=0.30.0",
]
# Shared dependency set for both paper-ingestion flavors. Kept in its own
# group because a group must not include-group its declared conflict partner
# (uv would emit a degenerate self-conflict set that breaks `uv export`).
paper-ingestion-base = [
    { include-group = "jarvis-common" },
    "apscheduler>=3.10.0",
    "asyncpg-listen>=0.0.9",
    "asyncpg>=0.30.0,<0.32.0",
    "fastapi>=0.137.0,<0.141.0",
    "httpx>=0.27.0",
    "lxml>=6.1.0",
    "docling[rapidocr]>=2.96.0,<2.121.0",
    "markdownify>=0.14.1",
    "pydantic>=2.0,<3.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=12.3.0",  # >=12.3.0 clears PYSEC-2026-2253..2257
    "python-multipart>=0.0.31",  # >=0.0.31 clears CVE-2026-53538/53539/53540
    "pyyaml>=6.0",
    # Keep the client within one minor of the persisted Qdrant 1.13.x runtime
    # (docker-compose.yml pins qdrant/qdrant:v1.13.2). The client enforces this
    # itself: past a one-minor gap it warns on every connection that the pairing
    # is unsupported. Widening this range without moving the server ships that
    # warning to every install, so the two move together in a change that can
    # exercise a running server.
    "qdrant-client>=1.14.3,<1.15.0",
    "rapidfuzz>=3.0.0",
    "rispy>=0.9,<1.0",  # RIS citation export
    "scikit-learn>=1.6.0",
    "sentry-sdk>=2.29.0",
    "slowapi>=0.1.9",
    "tiktoken>=0.7.0",
    "transformers>=5.4.0,<6.0.0",
    "uvicorn[standard]>=0.30.0",
    "webauthn>=3.0.0,<4.0.0",  # server-side passkey/WebAuthn ceremonies (torch-independent)
]
paper-ingestion = [
    { include-group = "paper-ingestion-base" },
]
# CPU flavor of paper-ingestion: identical dependency set, but torch and
# torchvision resolve from the PyTorch CPU index (no nvidia-*/triton). The
# direct pins are required so both group-scoped [tool.uv.sources] entries
# validate; ==2.13.0/==0.28.0 match the +cpu wheels. Exported to
# constraints-cpu.txt.
paper-ingestion-cpu = [
    { include-group = "paper-ingestion-base" },
    "torch==2.13.0",
    "torchvision==0.28.0",
]
# Shared optional (reranker) set for both flavors. Kept in its own group for the
# same reason as paper-ingestion-base: a group must not include-group its
# declared conflict partner.
paper-ingestion-optional-base = [
    "networkx>=3.2",
    "sentence-transformers>=3.2.0",
]
paper-ingestion-optional = [
    { include-group = "paper-ingestion-optional-base" },
]
# CPU flavor of the reranker extras: torch resolves from the PyTorch CPU index
# so the documented CPU + INSTALL_OPTIONAL build reuses the +cpu torch already
# in the cpu base image instead of dragging in the ~3.7 GB nvidia-*/triton set
# the cpu image exists to exclude. Exported to constraints-optional-cpu.txt.
paper-ingestion-optional-cpu = [
    { include-group = "paper-ingestion-optional-base" },
    "torch==2.13.0",
]
learning-engine = [
    { include-group = "jarvis-common" },
    "asyncpg-listen>=0.0.9",
    "asyncpg>=0.30.0,<0.32.0",
    "fastapi>=0.137.0,<0.141.0",
    "fsrs>=4.0.0,<6.0.0",
    "genanki>=0.13.0",
    "httpx>=0.27.0",
    "pydantic>=2.0,<3.0.0",
    "sentry-sdk>=2.29.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.30.0",
]
telegram-bot = [
    { include-group = "jarvis-common" },
    "apscheduler>=3.10.0",
    "asyncpg>=0.30.0,<0.32.0",
    "fastapi>=0.137.0,<0.141.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
    "uvicorn>=0.30.0",
]
dev = [
    { include-group = "paper-ingestion" },
    { include-group = "learning-engine" },
    { include-group = "telegram-bot" },
    "asyncpg-listen>=0.0.9",
    "bibtexparser>=2.0.0b9,<3.0",  # dev/test only: round-trip oracle for the hand-written BibTeX exporter (kept out of the runtime image)
    "hypothesis>=6.100.0",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-randomly>=3.15.0",  # randomises test order so cross-test state leakage fails loudly
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "tach>=0.29.0",
]

# The cuda flavor (default PyPI torch, bundled nvidia-* libs) and the cpu
# flavor cannot share one resolution of torch, so the groups are declared
# conflicting: uv forks the lockfile and each group exports its own variant.
[tool.uv]
# Transitive floor: h2 below 4.4.1 carries a request-smuggling advisory
# (duplicate Host header); no direct dependency declares h2, so the floor
# lives here.
constraint-dependencies = ["h2>=4.4.1"]
conflicts = [
    [
        { group = "paper-ingestion" },
        { group = "paper-ingestion-cpu" },
    ],
    [
        { group = "paper-ingestion-optional" },
        { group = "paper-ingestion-optional-cpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "paper-ingestion-cpu" },
    { index = "pytorch-cpu", group = "paper-ingestion-optional-cpu" },
]
# torchvision carries compiled kernels registered against a specific torch
# build, so it has to come from the same index as torch in the CPU flavor.
# Mixing indexes installs cleanly and then fails at `import torchvision`.
torchvision = [{ index = "pytorch-cpu", group = "paper-ingestion-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing baseline lint noise not in scope for Round 9.
# Tests frequently need sys.modules injection before app imports (E402)
# and include long fixture strings / SQL (E501). The shared
# `from tests.conftest import _make_pool_and_conn` is a first-party import
# ruff's isort splits into a section ruff-format then fights in a loop;
# I001 is suppressed test-only (production import-sorting still enforced).
# Both service test dirs share the `tests` namespace on sys.path, so `_make_pool_and_conn`/`FakeRecord` must remain identical in both conftest.py files.
"services/paper_ingestion/tests/*" = ["E402", "E501", "I001"]
"services/learning_engine/tests/*" = ["E501", "I001"]
"services/restore_uploader/tests/*" = ["E501", "I001"]
"libs/jarvis_common/tests/*" = ["E501"]
"scripts/*" = ["E402", "N999"]
# http.server dispatches on the handler method name (do_PUT); N802 flags it as
# non-lowercase and N815 as class-scope mixedCase — both are framework-mandated,
# not style bugs.
"services/restore_uploader/uploader.py" = ["N802", "N815"]
# Long SQL / prompt template strings in app code.
"libs/jarvis_common/jarvis_common/jobs.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/extraction.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/routers/extractions.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/routers/priority.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/pdf_processor.py" = ["E501", "N806"]
"services/paper_ingestion/paper_ingestion/verification.py" = ["E501", "N806"]
"services/paper_ingestion/paper_ingestion/models/papers.py" = ["UP042"]
# jarvis_common.paper_state aliases (as _xxx) trigger ruff isort split; suppress I001.
"services/paper_ingestion/paper_ingestion/routers/papers.py" = ["I001"]
# tests.conftest (relative test helper) is classified as a different section from
# paper_ingestion (src), causing a false-positive I001 split that ruff-format re-introduces.
"services/paper_ingestion/paper_ingestion/sources/registry.py" = ["UP047"]
"libs/jarvis_common/jarvis_common/llm_client.py" = ["UP047"]
"services/learning_engine/learning_engine/converters.py" = ["E501"]
"libs/jarvis_common/jarvis_common/error_handlers.py" = ["E501"]

[tool.complexity-budget]
# Frozen no-growth ratchet for cyclomatic/branch/argument/statement complexity.
# These ruff rules are deliberately NOT in [tool.ruff.lint] select (that would
# fail the main lint on the pre-existing violations and bury actionable
# findings). scripts/check-complexity-budget.py fails only when a count GROWS;
# lower a cap whenever a refactor reduces the real number. Tests are excluded
# from the scan (see _EXCLUDE there) so the budget tracks production only.
max = { C901 = 54, PLR0911 = 8, PLR0912 = 28, PLR0913 = 83, PLR0915 = 20 }

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_pg: requires Docker-backed PostgreSQL and JARVIS_RUN_LIVE_PG=1",
    "live_qdrant: requires an isolated Qdrant container and managed PostgreSQL",
    "integration: integration tests that may need explicit opt-in dependencies",
    "slow: slower tests excluded from ordinary host runs",
    "real_auth: opt out of the autouse user-id stub; exercise the real session resolver",
    "contract: DB-backed contract test (session container + per-test txn rollback); requires JARVIS_RUN_LIVE_PG=1",
    "nightly_smoke: smoke-level tripwires for pipeline degradation guards (schema-echo, all-empty)",
]
# Service + library roots on sys.path so each package resolves by its unique
# name (paper_ingestion, learning_engine, telegram_bot, jarvis_common).
# After the R12 rename, these no longer collide — each service's top-level
# package name matches its service directory.
pythonpath = [
    "services/paper_ingestion",
    "services/learning_engine",
    "services/telegram_bot",
    "services/restore_uploader",
    "libs/jarvis_common",
]
# importlib import mode gives each test module a unique synthetic name,
# which resolves test-file basename collisions across services
# (e.g. paper_ingestion/tests/test_health.py and
# learning_engine/tests/test_health.py). Safe to use here because after
# the R12 package rename no two services share a top-level package name.
# ``-p no:randomly`` keeps ordinary runs in a stable, reproducible order.
# pytest-randomly activates itself on import, and a randomised default would
# make every gate result depend on an unrecorded seed. Opt in per run with a
# trailing ``-p randomly`` (a later ``-p`` wins) to shake out cross-test state
# leakage; ``--randomly-seed=<n>`` then reproduces a specific failure.
addopts = "--import-mode=importlib -p no:randomly -m 'not live_pg and not live_qdrant and not integration and not slow' --ignore=tests/integration"
testpaths = [
    "services/paper_ingestion/tests",
    "services/learning_engine/tests",
    "services/telegram_bot/tests",
    "services/restore_uploader/tests",
    "libs/jarvis_common/tests",
    "scripts/tests",
    "tests",
]
