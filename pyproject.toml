[project]
name = "jarvis-rd-assistant"
version = "0.5.0"
description = "Self-hosted AI-powered research assistant"
authors = [{ name = "Ferhat Fidan", email = "ferhat.fidan@tuhh.de" }]
requires-python = ">=3.12"
license = "MIT"

[dependency-groups]
jarvis-common = [
    "aiosmtplib>=3.0,<4.0",  # WS-2A: SMTP delivery for magic-link auth
    "asyncpg-listen>=0.0.9",
    "asyncpg>=0.30.0,<0.32.0",
    "cryptography>=42",
    "email-validator>=2.0",  # WS-2A: backs pydantic EmailStr
    "fastapi>=0.125.0,<0.127.0",
    "httpx>=0.27.0",
    "instructor>=1.5",
    "langfuse>=2.50",
    "lxml>=5.0.0",  # SEC-3: cached_transport uses lxml for hardened XML parsing
    "openai>=1.50",
    "procrastinate[aiopg]>=0.49",
    "psycopg[binary]>=3.1",  # procrastinate 3.x imports psycopg unconditionally; bundled libpq
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0.0",  # libs/jarvis_common runtime dep (was previously absent from root group; W2-T3)
    "slowapi>=0.1.9",
    "structlog>=24.0",
]
paper-ingestion = [
    { include-group = "jarvis-common" },
    "apscheduler>=3.10.0",
    "asyncpg-listen>=0.0.9",
    "asyncpg>=0.30.0,<0.32.0",
    "fastapi>=0.125.0,<0.127.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",
    "marker-pdf>=1.0.0",
    "orjson>=3.10.0",
    "pydantic>=2.0,<3.0.0",
    "PyMuPDF>=1.24.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "qdrant-client>=1.12.0,<2.0.0",
    "rapidfuzz>=3.0.0",
    "sentry-sdk>=2.0.0",
    "slowapi>=0.1.9",
    "tiktoken>=0.7.0",
    "transformers>=4.53.0,<4.60.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.19,<1",
]
paper-ingestion-optional = [
    "networkx>=3.2",
    "onnxruntime>=1.19",
    "optimum[onnxruntime]>=1.21",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.2.0",
]
learning-engine = [
    { include-group = "jarvis-common" },
    "asyncpg-listen>=0.0.9",
    "asyncpg>=0.30.0,<0.32.0",
    "fastapi>=0.125.0,<0.127.0",
    "fsrs>=4.0.0,<6.0.0",
    "genanki>=0.13.0",
    "httpx>=0.27.0",
    "orjson>=3.10.0",
    "pydantic>=2.0,<3.0.0",
    "sentry-sdk>=2.0.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.19,<1",
]
telegram-bot = [
    { include-group = "jarvis-common" },
    "apscheduler>=3.10.0",
    "asyncpg>=0.30.0,<0.32.0",
    "fastapi>=0.125.0,<0.127.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0",
    "uvicorn>=0.30.0",
]
dev = [
    { include-group = "paper-ingestion" },
    { include-group = "learning-engine" },
    { include-group = "telegram-bot" },
    "asyncpg-listen>=0.0.9",
    "hypothesis>=6.100.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "tach>=0.29.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing baseline lint noise not in scope for Round 9.
# Tests frequently need sys.modules injection before app imports (E402)
# and include long fixture strings / SQL (E501). The shared
# `from tests.conftest import _make_pool_and_conn` is a first-party import
# ruff's isort splits into a section ruff-format then fights in a loop;
# I001 is suppressed test-only (production import-sorting still enforced).
# Both service test dirs share the `tests` namespace on sys.path, so `_make_pool_and_conn`/`FakeRecord` must remain identical in both conftest.py files.
"services/paper_ingestion/tests/*" = ["E402", "E501", "I001"]
"services/learning_engine/tests/*" = ["E501", "I001"]
"libs/jarvis_common/tests/*" = ["E501"]
"scripts/*" = ["E402", "N999"]
# Long SQL / prompt template strings in app code.
"libs/jarvis_common/jarvis_common/jobs.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/extraction.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/routers/extractions.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/routers/priority.py" = ["E501"]
"services/paper_ingestion/paper_ingestion/pdf_processor.py" = ["E501", "N806"]
"services/paper_ingestion/paper_ingestion/verification.py" = ["E501", "N806"]
"services/paper_ingestion/paper_ingestion/models/papers.py" = ["UP042"]
# W2-26: jarvis_common.paper_state aliases (as _xxx) trigger ruff isort split; suppress I001.
"services/paper_ingestion/paper_ingestion/routers/papers.py" = ["I001"]
# tests.conftest (relative test helper) is classified as a different section from
# paper_ingestion (src), causing a false-positive I001 split that ruff-format re-introduces.
"services/paper_ingestion/paper_ingestion/sources/registry.py" = ["UP047"]
"libs/jarvis_common/jarvis_common/llm_client.py" = ["UP047"]
"services/learning_engine/learning_engine/converters.py" = ["E501"]
"libs/jarvis_common/jarvis_common/error_handlers.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live_pg: requires Docker-backed PostgreSQL and JARVIS_RUN_LIVE_PG=1",
    "integration: integration tests that may need explicit opt-in dependencies",
    "slow: slower tests excluded from ordinary host runs",
    "real_auth: opt out of the autouse user-id stub; exercise the real session resolver",
    "contract: DB-backed contract test (session container + per-test txn rollback); requires JARVIS_RUN_LIVE_PG=1",
]
# Service + library roots on sys.path so each package resolves by its unique
# name (paper_ingestion, learning_engine, telegram_bot, jarvis_common).
# After the R12 rename, these no longer collide — each service's top-level
# package name matches its service directory.
pythonpath = [
    "services/paper_ingestion",
    "services/learning_engine",
    "services/telegram_bot",
    "libs/jarvis_common",
]
# importlib import mode gives each test module a unique synthetic name,
# which resolves test-file basename collisions across services
# (e.g. paper_ingestion/tests/test_health.py and
# learning_engine/tests/test_health.py). Safe to use here because after
# the R12 package rename no two services share a top-level package name.
addopts = "--import-mode=importlib -m 'not live_pg and not integration and not slow'"
testpaths = [
    "services/paper_ingestion/tests",
    "services/learning_engine/tests",
    "services/telegram_bot/tests",
    "libs/jarvis_common/tests",
]
