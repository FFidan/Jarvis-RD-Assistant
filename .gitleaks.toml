title = "JARVIS RD Assistant - Gitleaks configuration"

[extend]
# Extend the default ruleset built into the binary.
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist: known non-secret strings in tracked documentation
#
# Context: The historical Langfuse burn event left the burned key
# prefixes documented in docs/audit/**/*.md files. These are redacted
# references that document what WAS leaked (the files are not the keys
# themselves). The actual secret files (secrets/langfuse_init_*.txt) are
# gitignored and never committed.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Historical burned Langfuse key prefixes referenced in audit docs"
# Scope: only .md files under docs/audit/, docs/archive/, and the SECURITY.md
# runbook (which also documents the burn for operators). Precise paths, not a
# blanket allow.
paths = [
  '''docs/audit/.*\.md$''',
  '''docs/archive/.*\.md$''',
  '''docs/SECURITY\.md$''',
]
regexes = [
  '''pk-lf-35d525''',
  '''sk-lf-031360''',
]

# ---------------------------------------------------------------------------
# Allowlist: synthetic API-key / token fixtures in test files
#
# Context: the test suites hard-code obviously-fake credentials as fixtures
# (e.g. 'valid-api-key-32chars-long-xxxxx', 'correct-key-1234567890abcdefghij',
# a deterministic Fernet key). gitleaks' generic-api-key rule flags these as
# high-entropy strings, but they are not real secrets — they exercise auth,
# settings, and provider code paths. Real credentials never live in tests.
#
# Design: regexes-only — NO blanket path disable. A finding must match a regex
# to be suppressed, so an unrecognised real secret in a test dir is still flagged.
# Private-key/AWS/PAT rules remain active in test directories.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "Synthetic credential fixtures in test files (not real secrets)"
# Covered fixtures — confirmed via `gitleaks dir` + `gitleaks detect` on the tree:
#
# Current-HEAD fixtures (working tree):
#   valid-api-key-32chars-long-xxxxx   frontend/src/__tests__/auth-store.test.ts
#   test-api-key-32chars-xxxxxxxxxx    frontend/src/__tests__/auth-store.persist.test.ts
#   Citation-12345                     frontend/src/__tests__/ResearchFeedPage.test.tsx
#   AIza-sec003-secret-key             services/paper_ingestion/tests/test_providers.py
#   secret-zotero-key-abc123           services/paper_ingestion/tests/test_zotero_service.py
#
# Historical-commit fixtures (removed from HEAD, present in git history):
#   xK9mP2qR7nL4wJ8vB5hC1dG6tF3sY0uA  libs/jarvis_common/tests/test_dev_mode_retirement.py
#   pgyJ7t8w9KYMFgZ-9_M89P0VbyzqWj4Xz9LgSjlvKxs=  (deterministic Fernet key fixture,
#       replaced by Fernet.generate_key() in later commits)
#   correct-key-1234567890abcdefghij   libs/jarvis_common/tests/test_verify_api_key_session.py
regexes = [
  # Current-HEAD fixtures
  '''valid-api-key-32chars-long-xxxxx''',
  '''test-api-key-32chars-xxxxxxxxxx''',
  '''AIza-sec003-secret-key''',
  '''secret-zotero-key-abc123''',
  '''Citation-12345''',
  # Historical-commit fixtures (burned/replaced; not real secrets)
  '''xK9mP2qR7nL4wJ8vB5hC1dG6tF3sY0uA''',
  '''pgyJ7t8w9KYMFgZ-9_M89P0VbyzqWj4Xz9LgSjlvKxs=''',
  '''correct-key-1234567890abcdefghij''',
]
