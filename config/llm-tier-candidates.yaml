# Known issues surfaced during the 2026-05-22 eval (must be addressed before
# Phase 2 / Settings UI consumes this yaml meaningfully):
#
# 1. P0 think-block strip (_strip_think_blocks in services/paper_ingestion/
#    paper_ingestion/routers/rag.py) is NOT firing on the streaming RAG path
#    despite passing unit tests. Multiple bench candidates show <think>...</think>
#    in final answers. The strip applies in ask_paper + ask_cross_paper (non-
#    streaming) but the streaming wrapper (stream_rag_events) relies on
#    strip_think_streaming chunk-wise. Empirical bench evidence shows that
#    chunk-wise stripping leaks blocks when chunk boundaries split a <think>
#    open/close tag.
#
# 2. /api/ask rate limit hit during sim-tier bench despite the bench setting
#    ASK_RATE_LIMIT=1000/minute. The variable IS in the container env (verified
#    via `docker exec env`), so the limit hit is from a different slowapi
#    decorator (per-IP global? per-route burst?). Needs investigation before
#    24-48 sim-tier rerun.
#
# 3. Qdrant volume not wiped on the REDACTED-HOST bench, causing corpus pollution
#    (older "cat:cs.CL AND abs:transformer" papers accumulated from past
#    bench runs). The bench's stage_boot DID wipe qdrant locally but may have
#    been skipped on the remote — investigate the qdrant_container detection
#    on different compose project names.
