# See docs/perf/2026-05-22-llm-tier-bench.md for benchmark methodology.
#
# Re-generate by running scripts/perf/aggregate_judge.py over a bench bundle,
# then hand-translating its tier-rankings.json into this schema.
#
# Schema:
#   tiers.<tier>.fallback_for_tier: { backend, model }  # always Ollama, always-resident
#   tiers.<tier>.candidates: list of { backend, model, rank, score, reasoning, evidence }
#   evidence: "bench" | "sim-bench" | "static-benchmark" | "pending-bench"

