# Known issues + future candidates:
#
# 1. Streaming <think> leak — FIXED (commit e1aedb4d).
#    strip_think_blocks now matches <think>.*?(?:</think>|$) so unclosed
#    blocks at max_tokens truncation are stripped. Streaming path
#    (strip_think_streaming) was already correct; the bug was in the
#    non-streaming companion.
#
# 2. Empty-answer-on-truncation — when a Qwen3 thinking model hits
#    max_tokens INSIDE a <think> block, in_think=True suppression keeps
#    the carry hidden (no leak), but full_answer stays empty. Fix:
#    (a) raise max_tokens for thinking models, or (b) detect
#    in_think=True at stream end and retry with extra_body.think=false.
#    Affects ge-48 thinking candidates only; doesn't invalidate rankings
#    since the same issue applied equally to all thinking candidates.
#
# 3. casperhansen/deepseek-r1-distill-qwen-14b-awq — vLLM boot timed out
#    during benchmarking. Worth retrying with VLLM_BOOT_TIMEOUT_S=3600
#    on a clean docker volume.
#
# 4. ELVISIO/Qwen3-30B-A3B-AWQ — Engine core init crash on first attempt
#    (likely MoE-AWQ compatibility issue with vllm v0.11.0). Defer to
#    a future vllm release with better MoE-AWQ support.
#
# 5. Qwen3-8B-AWQ at sim-tier (16-24 / 24-48) — does NOT fit at
#    util=0.42 or util=0.53. NOT a candidate below ge-48.
#
# 6. Paper-number scrambling — models show misattribution between seed
#    papers and internal "Paper N" labels. RAG retrieval ordering is
#    inconsistent. Tracked as a separate RAG-grounding follow-up.
