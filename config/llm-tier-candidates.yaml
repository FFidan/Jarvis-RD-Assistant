# Carry-forward Phase 3 known issues + future-cycle candidates:
#
# 1. P0 streaming <think> leak — FIXED in Phase 3 (commit e1aedb4d).
#    strip_think_blocks now matches <think>.*?(?:</think>|$) so unclosed
#    blocks at max_tokens truncation are stripped. Streaming path
#    (strip_think_streaming) was already correct; the bug was in the
#    non-streaming companion.
#
# 2. Empty-answer-on-truncation (NEW Phase 3 finding) — when a Qwen3
#    thinking model hits max_tokens=700 INSIDE a <think> block, the
#    streaming generator's in_think=True suppression keeps the carry
#    hidden (correct, no leak), but full_answer stays empty. This
#    affected 3 of 12 prompts on each ge-48 cell. Fix candidates:
#    (a) raise max_tokens for thinking models, or (b) detect
#    in_think=True at stream end and retry with extra_body.think=false.
#    Deferred to a Phase 3 follow-up; doesn't invalidate the Phase 3
#    winners since the same issue applied to all thinking candidates.
#
# 3. casperhansen/deepseek-r1-distill-qwen-14b-awq — FIRST attempt
#    loaded successfully past 825s (deepseek-r1 vllm support works) but
#    timed out at 900s by ~25 seconds. Cache is warm now (9.3 GB) but
#    retry attempts ran into HF cache state issues and didn't reach
#    `/v1/models` within 1800s. Worth a third attempt with VLLM_BOOT_TIMEOUT_S=3600
#    on a clean docker volume reset.
#
# 4. ELVISIO/Qwen3-30B-A3B-AWQ — Engine core init crash on first attempt
#    (likely MoE-AWQ compatibility issue with vllm v0.11.0). Defer to
#    a future vllm release that ships better MoE-AWQ support.
#
# 5. Qwen3-8B-AWQ at sim-tier (16-24 / 24-48) — does NOT fit at util=0.42
#    or util=0.53. Boot timed out on both. Confirms Qwen3-8B-AWQ needs
#    util>=~0.6 (close to native ge-48 0.75). NOT a candidate below ge-48.
#
# 6. Paper-number scrambling — every cell shows misattribution between
#    seed papers and the model's internal "Paper N" labels. RAG retrieval
#    ordering is inconsistent. Out-of-scope for Phase 3 streaming-strip
#    work; tracked as a separate RAG-grounding follow-up.

