[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
           ../../libs/jarvis_common
addopts = --import-mode=importlib -m "not live_pg and not live_qdrant and not integration and not slow"
markers =
    live_pg: requires Docker-backed PostgreSQL and JARVIS_RUN_LIVE_PG=1
    live_qdrant: requires an isolated Qdrant container and managed PostgreSQL
    integration: integration tests that may need explicit opt-in dependencies
    slow: slower tests excluded from ordinary host runs
    real_auth: opt out of the autouse user-id stub; exercise the real session resolver
    contract: DB-backed contract test (session container + per-test txn rollback); requires JARVIS_RUN_LIVE_PG=1
    nightly_smoke: nightly real-model smoke with offline cassette
