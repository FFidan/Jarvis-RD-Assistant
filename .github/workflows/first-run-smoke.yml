name: First-run smoke

# Clean-machine first-run confidence check: proves a fresh checkout can reach a
# healthy stack by following the README's documented first-run command
# (`./setup.sh --non-interactive --profile=dev`). It catches "works on my
# machine" / undocumented-manual-step regressions before public launch.
#
# Intentionally NOT a required gate and NOT on pull_request: the first run pulls
# 7-11 GB of model data and can take 20-60 minutes, far too heavy to block PRs.
# It runs on pushes to main and on demand. Promote it to a required gate only
# after it has proven stable over several green main runs.

on:
  public:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-run-smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Clean-machine first-run smoke
        run: bash scripts/first-run-smoke.sh
