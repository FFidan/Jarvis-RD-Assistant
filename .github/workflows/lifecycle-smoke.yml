name: Lifecycle smoke

# Release smoke for the lifecycle paths the cold-install smoke never reaches:
# the TLS profile, an interrupted update, and the uninstall dry run.
#
# Manual dispatch only, and informational for now: the legs perform full cold
# installs and are not yet part of any required gate. Promote a leg to a
# required check once it has run green across a few releases.
on:
  workflow_dispatch:
    inputs:
      leg:
        description: Which leg to run
        type: choice
        default: all
        options: [all, tls, update, uninstall]
        required: false

permissions:
  contents: read

concurrency:
  group: lifecycle-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-smoke:
    name: Lifecycle smoke (${{ inputs.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the update leg resolves release tags from origin

      - name: Install mkcert
        # libnss3-tools is not optional: the CA root is always absent on a fresh
        # runner, so init-mkcert.sh always calls `mkcert -install`, which needs
        # certutil from that package and aborts the tls leg without it.
        run: |
          sudo apt-get update
          sudo apt-get install -y mkcert libnss3-tools

      - name: Free disk space for the cold installs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Run the lifecycle smoke
        env:
          LEG: ${{ inputs.leg }}
        run: |
          args=()
          if [ "$LEG" != "all" ]; then
            args+=(--leg "$LEG")
          fi
          # The exit code is captured directly, never through a pipe: an implicit
          # step shell is `bash -e` WITHOUT pipefail, so `script | tee` would
          # report tee's status and mask a failing leg.
          rc=0
          bash scripts/lifecycle-smoke.sh "${args[@]}" > lifecycle-smoke.log 2>&1 || rc=$?
          cat lifecycle-smoke.log
          exit "$rc"

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-smoke-log
          path: lifecycle-smoke.log
          if-no-files-found: ignore
