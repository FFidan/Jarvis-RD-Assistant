name: Nightly LLM smoke

# Live-then-gate control for grammar-constrained decoding: each night, drive
# every structured pipeline against the real deployed model and FAIL (a red run
# = the visible signal) if a structured call ever yields no parsed result — the
# CI-layer analogue of Pulse's in-app `llm_calls == 0` degraded warning.
#
# The offline cassette leg (respx-mocked /v1/chat/completions) runs always so
# the smoke is meaningful even without a live model; the live leg runs only when
# LITELLM_BASE_URL is explicitly configured for a reachable model endpoint.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-llm-smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Nightly structured-pipeline smoke
        # The live leg runs only when LITELLM_SMOKE_BASE_URL is set as a repo
        # variable. Leave it unset on GitHub-hosted runners unless they can reach
        # an explicitly managed test endpoint; otherwise the run is cassette-only.
        # No hardcoded localhost default: a public ubuntu-latest runner has no
        # stack and must stay cassette-only.
        env:
          LITELLM_BASE_URL: ${{ vars.LITELLM_SMOKE_BASE_URL }}
        run: bash scripts/nightly-llm-smoke.sh

  corpus-visibility-qdrant:
    if: github.event.repository.private == false
    name: Corpus visibility (PostgreSQL + Qdrant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
        env:
          POSTGRES_PASSWORD: jarvis-ci
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432
    env:
      JARVIS_RUN_LIVE_PG: "1"
      PYTHONPATH: >-
        services/paper_ingestion:services/learning_engine:services/telegram_bot:libs/jarvis_common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve managed-Postgres admin DSN
        run: >-
          echo "JARVIS_TEST_PG_ADMIN_DSN=postgresql://postgres:jarvis-ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Live corpus-visibility gate
        run: bash scripts/tests/test_corpus_visibility_qdrant.sh

  model-catalog-freshness:
    # Scheduled runs only: what turns this red is the passage of time, not a
    # change in the tree, so it must never gate a manually dispatched run that
    # is verifying a branch. A red run is the reminder to re-review the
    # bundled model catalog and refresh its last_reviewed dates.
    if: github.event.repository.private == false && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Model-catalog freshness
        run: python3 scripts/check-model-catalog-freshness.py

  pinned-image-matrix:
    # Unlike catalog freshness, current image pins should also be inspectable
    # on demand when a maintainer manually dispatches this workflow.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the digest-pinned image matrix
        id: matrix
        run: |
          python3 - <<'PY'
          import json
          import os

          entries = []
          with open("versions.env", encoding="utf-8") as versions:
              for raw_line in versions:
                  name, separator, image = raw_line.strip().partition("=")
                  if not separator or not name.endswith("_IMAGE") or "@sha256:" not in image:
                      continue
                  reference = image.rsplit("@sha256:", 1)[0]
                  final_component = reference.rsplit("/", 1)[-1]
                  kind = "build base" if ":" in final_component else "runtime image"
                  entries.append({"image": image, "kind": kind})

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps({'include': entries}, separators=(',', ':'))}\n")
          PY

  pinned-image-scan:
    if: github.event.repository.private == false
    needs: pinned-image-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pinned-image-matrix.outputs.matrix) }}
    steps:
      - name: Scan the pinned image
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy.txt

      # The scan fails this job on a finding, so the report has to be published
      # unconditionally — otherwise a red run arrives with nothing to read.
      - name: Summarize the pinned image scan
        if: ${{ always() }}
        env:
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
          RESULT: ${{ steps.scan.outcome }}
        run: |
          {
            echo "| Image | Kind | Result |"
            echo "| --- | --- | --- |"
            printf '| `%s` | %s | %s |\n' "$IMAGE" "$KIND" "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f trivy.txt ] || exit 0
          {
            echo "### Trivy report — ${IMAGE}"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the scan found a blocking advisory
        if: ${{ steps.scan.outcome == 'failure' }}
        run: exit 1
