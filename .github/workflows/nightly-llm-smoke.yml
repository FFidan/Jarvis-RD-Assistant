name: Nightly LLM smoke

# Live-then-gate control for grammar-constrained decoding: each night, drive
# every structured pipeline against the real deployed model and FAIL (a red run
# = the visible signal) if a structured call ever yields no parsed result — the
# CI-layer analogue of Pulse's in-app `llm_calls == 0` degraded warning.
#
# The offline cassette leg (respx-mocked /v1/chat/completions) runs always so
# the smoke is meaningful even without a live model; the live leg runs only when
# LITELLM_BASE_URL is explicitly configured for a reachable model endpoint.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-llm-smoke:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Nightly structured-pipeline smoke
        # The live leg runs only when LITELLM_SMOKE_BASE_URL is set as a repo
        # variable. Leave it unset on GitHub-hosted runners unless they can reach
        # an explicitly managed test endpoint; otherwise the run is cassette-only.
        # No hardcoded localhost default: a public ubuntu-latest runner has no
        # stack and must stay cassette-only.
        env:
          LITELLM_BASE_URL: ${{ vars.LITELLM_SMOKE_BASE_URL }}
        run: bash scripts/nightly-llm-smoke.sh

  corpus-visibility-qdrant:
    if: github.event.repository.private == false
    name: Corpus visibility (PostgreSQL + Qdrant)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
        env:
          POSTGRES_PASSWORD: jarvis-ci
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432
    env:
      JARVIS_RUN_LIVE_PG: "1"
      PYTHONPATH: >-
        services/paper_ingestion:services/learning_engine:services/telegram_bot:libs/jarvis_common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve managed-Postgres admin DSN
        run: >-
          echo "JARVIS_TEST_PG_ADMIN_DSN=postgresql://postgres:jarvis-ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Live corpus-visibility gate
        run: bash scripts/tests/test_corpus_visibility_qdrant.sh
