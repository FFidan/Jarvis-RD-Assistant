name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sbom:
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: ${{ vars.JARVIS_RUNNER == '' }}

      - name: Sync dependencies
        run: uv sync

      - name: Install cyclonedx-py
        run: uv tool install cyclonedx-bom

      - name: Generate Python SBOM
        run: uv tool run cyclonedx-py environment --output-format JSON --output-file sbom-python.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-python
          path: sbom-python.json

  node-sbom:
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate Node SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@4.2.1 --output-format JSON --output-file sbom-node.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-node
          path: frontend/sbom-node.json
