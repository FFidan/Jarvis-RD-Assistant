name: SBOM

on:
  public:
  release:
    types: [published]
  pull_request:
    branches: [main]
  push:
    # Release candidates fire only the GHCR publish workflow (negative pattern:
    # `tags` and `tags-ignore` cannot be combined on one event).
    tags: ["v*", "!v*-rc*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-sbom:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install cyclonedx-py
        run: uv tool install cyclonedx-bom

      - name: Generate Python SBOM
        run: uv tool run cyclonedx-py environment --output-format JSON --output-file sbom-python.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-python
          path: sbom-python.json

  node-sbom:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # --ignore-npm-errors: the React 19 / TypeScript 6 / ESLint 10 / Vite 8
      # (Rolldown) stack leaves benign peer-range "invalid" and optional-native
      # "extraneous" markers that make the underlying `npm ls` exit non-zero. The
      # generated SBOM is complete regardless, so do not fail the job on that noise.
      - name: Generate Node SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@4.2.1 --ignore-npm-errors --output-format JSON --output-file sbom-node.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-node
          path: frontend/sbom-node.json

  # Inventory dependency licenses and surface copyleft (GPL/AGPL/LGPL/MPL/EUPL)
  # for release-time legal review. Warn-only: this runs on release, not as a PR
  # gate, so a transitive copyleft dep is a review item, not an automatic build
  # break. Tool/setup failures still fail the job.
  license-scan:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Scan Python licenses (copyleft = warn)
        run: |
          uv tool run pip-licenses --format=json > licenses-python.json
          python3 - <<'PY'
          import json, os, re
          data = json.load(open("licenses-python.json"))
          pat = re.compile(r"GPL|AGPL|LGPL|MPL|EUPL|copyleft", re.I)
          hits = [(d.get("Name", "?"), d.get("Version", "?"), d.get("License", "?"))
                  for d in data if pat.search(d.get("License", ""))]
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary, "a") as fh:
              fh.write(f"## Python license scan\n\n")
              fh.write(f"- packages scanned: **{len(data)}**\n")
              fh.write(f"- copyleft hits (GPL/AGPL/LGPL/MPL/EUPL): **{len(hits)}**\n\n")
              if hits:
                  fh.write("| Package | Version | License |\n|---|---|---|\n")
                  for name, ver, lic in sorted(hits):
                      fh.write(f"| {name} | {ver} | {lic} |\n")
                  fh.write("\n_Review these for release at the legal-review step._\n\n")
          if hits:
              print(f"::warning title=Python copyleft licenses::{len(hits)} "
                    f"copyleft dependency licenses found — review for release: "
                    + ", ".join(f"{n} ({l})" for n, _, l in sorted(hits)))
          PY

      - name: Scan Node licenses (copyleft = warn)
        run: |
          npx --yes license-checker-rseidelsohn --production --json > frontend/licenses-node.json
          python3 - <<'PY'
          import json, os, re
          data = json.load(open("frontend/licenses-node.json"))
          pat = re.compile(r"GPL|AGPL|LGPL|MPL|EUPL|copyleft", re.I)
          hits = [(pkg, info.get("licenses", "?"))
                  for pkg, info in data.items()
                  if pat.search(str(info.get("licenses", "")))]
          summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout")
          with open(summary, "a") as fh:
              fh.write(f"## Node license scan\n\n")
              fh.write(f"- packages scanned: **{len(data)}**\n")
              fh.write(f"- copyleft hits (GPL/AGPL/LGPL/MPL/EUPL): **{len(hits)}**\n\n")
              if hits:
                  fh.write("| Package | License |\n|---|---|\n")
                  for pkg, lic in sorted(hits):
                      fh.write(f"| {pkg} | {lic} |\n")
                  fh.write("\n_Review these for release at the legal-review step._\n\n")
          if hits:
              print(f"::warning title=Node copyleft licenses::{len(hits)} "
                    f"copyleft dependency licenses found — review for release: "
                    + ", ".join(f"{p} ({l})" for p, l in sorted(hits)))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: license-inventory
          path: |
            licenses-python.json
            frontend/licenses-node.json

  # Pre-release license GATE. Unlike license-scan above (warn-only inventory),
  # this FAILS the release when any dependency is STRONG copyleft (GPL or AGPL),
  # which is incompatible with redistributing this Apache-2.0 project. Weak and
  # file-level copyleft (LGPL/MPL/EUPL) is permitted for unmodified, dynamically
  # linked dependencies and does NOT fail. The gate also drift-checks the
  # committed NOTICE so third-party attribution stays accurate. Classification
  # lives in scripts/gen_notice.py so the gate and the NOTICE check agree.
  #
  # Gated to the public repo (same pattern as the CodeQL job in security.yml):
  # while the repository is private this job is skipped, so it does not block the
  # private release tag; it auto-activates at the public flip with no edit.
  license-gate:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # --python targets the synced project environment; without it pip-licenses
      # scans an isolated tool env and reports nothing.
      - name: Generate Python license inventory
        run: uv tool run pip-licenses --python .venv/bin/python --format=json > licenses-python.json

      - name: Generate Node license inventory
        working-directory: frontend
        run: npx --yes license-checker-rseidelsohn --production --json > licenses-node.json

      - name: Enforce license policy (fail on GPL/AGPL)
        run: python3 scripts/gen_notice.py gate --python-json licenses-python.json --node-json frontend/licenses-node.json

      - name: Check NOTICE is up to date
        run: python3 scripts/gen_notice.py check-notice --python-json licenses-python.json --node-json frontend/licenses-node.json --notice NOTICE

      - name: Build third-party license inventory artifact
        if: always()
        run: python3 scripts/gen_notice.py inventory --python-json licenses-python.json > license-inventory.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: license-gate-inventory
          path: license-inventory.txt
