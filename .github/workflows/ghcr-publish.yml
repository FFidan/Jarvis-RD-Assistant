name: GHCR publish

# Builds application images, publishes commit-addressed verification images for
# an exact main commit, and promotes only the artifacts from the successful
# verification run named by an annotated stable tag on that commit.
#
# Image mapping:
#   compose `jarvis/platform_api`    -> ghcr.io/limitcycle-oss/jarvis-platform-api
#   compose `jarvis/paper_ingestion` -> ghcr.io/limitcycle-oss/jarvis-paper-ingestion
#   compose `jarvis/learning_engine` -> ghcr.io/limitcycle-oss/jarvis-learning-engine
#   compose `jarvis/telegram_bot`    -> ghcr.io/limitcycle-oss/jarvis-telegram-bot
#   compose `jarvis/dashboard`       -> ghcr.io/limitcycle-oss/jarvis-dashboard
#   services/restore_uploader        -> ghcr.io/limitcycle-oss/jarvis-restore-uploader
#
# Manual dispatch without source_commit is build-only. Manual dispatch from main
# with source_commit equal to github.sha publishes `<SHA>` and `<SHA>-cuda`
# verification tags. An exact stable `vX.Y.Z` tag never builds: it peels the tag
# to its commit and promotes only that commit's verified SHA manifests.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_commit:
        description: >-
          Lowercase 40-hex main commit to publish as verification images. Leave
          empty for a build-only run.
        type: string
        default: ""
        required: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  preflight:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      source_commit: ${{ steps.mode.outputs.source_commit }}
      release_version: ${{ steps.mode.outputs.release_version }}
      verification_run_id: ${{ steps.mode.outputs.verification_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the immutable publication mode
        id: mode
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=""
          source_commit=""
          release_version=""
          verification_run_id=""

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$SOURCE_COMMIT" ]; then
              mode=build-only
              source_commit="$GITHUB_SHA"
              echo "Input-free dispatch: build only, no registry writes."
            else
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::source_commit publication must be dispatched with --ref main"
                exit 1
              fi
              if ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::source_commit must be a lowercase 40-hex commit SHA"
                exit 1
              fi
              if [ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]; then
                echo "::error::source_commit must equal github.sha for this main dispatch"
                exit 1
              fi
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
                echo "::error::source_commit is not reachable from origin/main"
                exit 1
              fi
              mode=verify
              source_commit="$SOURCE_COMMIT"
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ] \
               || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::only an exact stable vX.Y.Z tag may promote images"
              exit 1
            fi
            if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null || true)" != "tag" ]; then
              echo "::error::stable releases require an annotated tag"
              exit 1
            fi
            source_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$source_commit" origin/main; then
              echo "::error::stable tag ${GITHUB_REF_NAME} is not reachable from origin/main"
              exit 1
            fi
            tag_message="$RUNNER_TEMP/release-tag-message.txt"
            run_json="$RUNNER_TEMP/verification-run.json"
            git for-each-ref --format='%(contents)' \
              "refs/tags/${GITHUB_REF_NAME}" > "$tag_message"
            verification_run_id="$(python3 scripts/release_provenance.py \
              tag-run-id "$tag_message")"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${verification_run_id}" \
              > "$run_json"
            python3 scripts/release_provenance.py validate-run "$run_json" \
              --expected-sha "$source_commit" \
              --workflow-path ".github/workflows/ghcr-publish.yml"
            mode=promote
            release_version="${GITHUB_REF_NAME#v}"
          else
            echo "::error::unsupported workflow event ${GITHUB_EVENT_NAME}"
            exit 1
          fi

          {
            echo "mode=$mode"
            echo "source_commit=$source_commit"
            echo "release_version=$release_version"
            echo "verification_run_id=$verification_run_id"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.mode != 'promote'
    environment: ${{ needs.preflight.outputs.mode == 'verify' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        # Build contexts differ by need: platform-api, paper-ingestion,
        # learning-engine and telegram-bot build from the repository root because their Dockerfiles
        # COPY libs/jarvis_common; restore-uploader and the dashboard are
        # self-contained and build from their own directories. Reproducing a
        # build by hand requires the same context as its matrix entry.
        include:
          - slug: platform-api
            image: jarvis-platform-api
            context: .
            file: services/platform_api/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke_import: platform_api.main
          - slug: platform-api
            image: jarvis-platform-api
            context: .
            file: services/platform_api/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_import: platform_api.main
          - slug: paper-ingestion-cpu
            image: jarvis-paper-ingestion
            context: .
            file: services/paper_ingestion/Dockerfile
            build_args: TORCH_VARIANT=cpu
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke_import: paper_ingestion.main
            capability: native-vision pdf malformed-pdf
          - slug: paper-ingestion-cpu
            image: jarvis-paper-ingestion
            context: .
            file: services/paper_ingestion/Dockerfile
            build_args: TORCH_VARIANT=cpu
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_import: paper_ingestion.main
            capability: native-vision pdf malformed-pdf
          - slug: paper-ingestion-cuda
            image: jarvis-paper-ingestion
            context: .
            file: services/paper_ingestion/Dockerfile
            build_args: |
              TORCH_VARIANT=cuda
              INSTALL_OPTIONAL=true
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke_import: paper_ingestion.main
            # Hosted runners have no GPU, so this flavour proves the same
            # host-side capabilities as the CPU images.
            capability: native-vision pdf malformed-pdf
          - slug: learning-engine
            image: jarvis-learning-engine
            context: .
            file: services/learning_engine/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke_import: learning_engine.main
          - slug: learning-engine
            image: jarvis-learning-engine
            context: .
            file: services/learning_engine/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_import: learning_engine.main
          - slug: telegram-bot
            image: jarvis-telegram-bot
            context: .
            file: services/telegram_bot/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke_import: telegram_bot.main
          - slug: telegram-bot
            image: jarvis-telegram-bot
            context: .
            file: services/telegram_bot/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_import: telegram_bot.main
          - slug: dashboard
            image: jarvis-dashboard
            context: ./frontend
            file: ./frontend/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - slug: dashboard
            image: jarvis-dashboard
            context: ./frontend
            file: ./frontend/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - slug: restore-uploader
            image: jarvis-restore-uploader
            context: ./services/restore_uploader
            file: ./services/restore_uploader/Dockerfile
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            smoke_import: uploader
          - slug: restore-uploader
            image: jarvis-restore-uploader
            context: ./services/restore_uploader
            file: ./services/restore_uploader/Dockerfile
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            smoke_import: uploader
    name: build (${{ matrix.slug }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          docker image prune --all --force

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}

      # Build from the digest-pinned bases in versions.env. The Dockerfile ARG
      # defaults name a bare tag so a developer build without this file still
      # works, but a tag is mutable, so a published image built from the default
      # is not reproducible. Only the bases a Dockerfile actually declares are
      # forwarded, so no image receives a build argument it never consumes.
      # The matrix values are folded in here, rather than concatenated into the
      # build step's input alongside this output, so that an entry carrying no
      # matrix arguments cannot leave a blank line in the list.
      - name: Resolve the build arguments
        id: build_args
        env:
          DOCKERFILE: ${{ matrix.file }}
          MATRIX_BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -a
          . ./versions.env
          set +a
          {
            echo "resolved<<BUILD_ARGS"
            for name in PYTHON_BASE_IMAGE NODE_BUILD_IMAGE NGINX_RUNTIME_IMAGE; do
              if grep -q "^ARG ${name}=" "$DOCKERFILE"; then
                printf '%s=%s\n' "$name" "${!name}"
              fi
            done
            printf '%s\n' "$MATRIX_BUILD_ARGS" | sed '/^$/d'
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        if: needs.preflight.outputs.mode == 'verify'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.build_args.outputs.resolved }}
          sbom: ${{ needs.preflight.outputs.mode == 'verify' }}
          outputs: ${{ needs.preflight.outputs.mode == 'verify' && format('type=image,name=ghcr.io/limitcycle-oss/{0},push-by-digest=true,name-canonical=true,push=true', matrix.image) || 'type=cacheonly' }}

      - name: Export the platform digest
        if: needs.preflight.outputs.mode == 'verify'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Ask the image to import its own entrypoint module, using its own
      # interpreter. A missing runtime dependency is invisible to a build and to
      # every static check, and shipped undetected through four releases; the
      # image starting is the only thing that proves the dependency set is
      # complete. This runs before the digest is uploaded, so a leg that cannot
      # import is never part of the manifest the release is assembled from.
      # The dashboard is nginx and carries no interpreter, so it has no target.
      # This proves the dependency set, not the runtime: the real ENTRYPOINT and
      # CMD, configuration, and health are exercised later, before any stable
      # release tag exists, by the cold-install and upgrade checks in the
      # release process.
      # The image blob itself is digest-pushed by the build step above before
      # this check runs; a failing leg therefore leaves an unreferenced,
      # untagged digest behind, which nothing resolves or promotes. That
      # ordering is deliberate: pushing after a local load would either build
      # twice or drop the SBOM attestations.
      - name: Import smoke - run the image's own interpreter
        if: needs.preflight.outputs.mode == 'verify' && matrix.smoke_import != ''
        run: |
          docker run --rm --entrypoint python \
            "ghcr.io/limitcycle-oss/${{ matrix.image }}@${{ steps.build.outputs.digest }}" \
            -c "import importlib; importlib.import_module('${{ matrix.smoke_import }}')"

      # The import smoke proves the dependency set resolves. It cannot reach a
      # lazily imported native stack: the document pipeline builds its converter
      # on first use, so a mismatched compiled dependency stays invisible until a
      # real PDF is converted. This runs the capability set declared by the matrix
      # entry inside the exact digest, before that digest joins the manifest.
      # The service package is copied to the image's WORKDIR rather than
      # installed, and a script invoked by path puts only its own directory on
      # sys.path, so PYTHONPATH is what lets the checker reach it.
      # Converting a real document takes longer than the import smoke, but the
      # layout and OCR models are baked into the image, so nothing is downloaded
      # here; both arm64 and amd64 run this on native runners.
      - name: Capability check - exercise runtime paths the import cannot reach
        if: needs.preflight.outputs.mode == 'verify' && matrix.capability != ''
        timeout-minutes: 25
        run: |
          docker run --rm --network none \
            -v "${{ github.workspace }}/scripts/image-capability-check.py:/tmp/capability.py:ro" \
            -v "${{ github.workspace }}/frontend/e2e/fixtures/sample.pdf:/tmp/sample.pdf:ro" \
            -e PYTHONPATH=/app \
            --entrypoint python \
            "ghcr.io/limitcycle-oss/${{ matrix.image }}@${{ steps.build.outputs.digest }}" \
            /tmp/capability.py --pdf /tmp/sample.pdf ${{ matrix.capability }}

      - name: Upload the platform digest
        if: needs.preflight.outputs.mode == 'verify'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.slug }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [preflight, build]
    if: needs.preflight.outputs.mode == 'verify'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: platform-api
            image: jarvis-platform-api
            suffix: ""
          - slug: paper-ingestion-cpu
            image: jarvis-paper-ingestion
            suffix: ""
          - slug: paper-ingestion-cuda
            image: jarvis-paper-ingestion
            suffix: "-cuda"
          - slug: learning-engine
            image: jarvis-learning-engine
            suffix: ""
          - slug: telegram-bot
            image: jarvis-telegram-bot
            suffix: ""
          - slug: dashboard
            image: jarvis-dashboard
            suffix: ""
          - slug: restore-uploader
            image: jarvis-restore-uploader
            suffix: ""
    name: verify (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          docker image prune --all --force

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.slug }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the commit-addressed manifest
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/limitcycle-oss/${{ matrix.image }}"
          tag="${{ needs.preflight.outputs.source_commit }}${{ matrix.suffix }}"
          shopt -s nullglob
          digests=(*)
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${image}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "::error::no platform digests were downloaded"
            exit 1
          fi
          docker buildx imagetools create -t "${image}:${tag}" "${sources[@]}"

      - name: Resolve and record the verification digest
        id: digest
        run: |
          image="ghcr.io/limitcycle-oss/${{ matrix.image }}"
          tag="${{ needs.preflight.outputs.source_commit }}${{ matrix.suffix }}"
          published_ref="${image}:${tag}"
          docker buildx imagetools inspect "$published_ref"
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "$published_ref" | tr -d '"')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve the verification manifest digest"
            exit 1
          fi
          printf '%s@%s\n' "$published_ref" "$digest" > "digest-${{ matrix.slug }}.txt"
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Verified ${published_ref} at ${digest}." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verification digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verification-digest-${{ matrix.slug }}
          path: digest-${{ matrix.slug }}.txt
          if-no-files-found: error

      - name: Generate the image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.digest.outputs.ref }}
          format: cyclonedx
          output: sbom-${{ matrix.slug }}.cdx.json

      - name: Upload the image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-image-${{ matrix.slug }}
          path: sbom-${{ matrix.slug }}.cdx.json

      # A gate: a critical finding that already has a fixed version fails this
      # job, so no digest carrying one can reach a stable tag. `ignore-unfixed`
      # keeps the gate to what rebuilding can actually clear — an advisory with
      # no released fix would otherwise block every run until one appeared.
      # The cost is accepted deliberately. This scans a live advisory database
      # against an image that is already built, and this job's digest receipts
      # are the only thing a stable tag can promote, so a fixable critical
      # published minutes earlier will discard a verification run with nothing
      # else wrong with it and force a full rebuild at a raised floor.
      # Lower severities stay with the branch-level scans, which run where a fix
      # can still be committed: pip-audit, npm-audit and osv-scanner in the
      # Security workflow. The Dependency Scans section of docs/RELEASE.md
      # states what the operator must do when this gate fails.
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.digest.outputs.ref }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          output: trivy-${{ matrix.slug }}.txt

      # The scan above fails the job on a finding, which would otherwise skip
      # this step and leave the operator with a red run and no report.
      - name: Publish the vulnerability report to the job summary
        if: ${{ !cancelled() }}
        run: |
          [ -f trivy-${{ matrix.slug }}.txt ] || exit 0
          {
            echo "### Trivy report — ${{ steps.digest.outputs.ref }}"
            echo '```'
            cat trivy-${{ matrix.slug }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: preflight
    if: needs.preflight.outputs.mode == 'promote'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: platform-api
            image: jarvis-platform-api
            suffix: ""
          - slug: paper-ingestion-cpu
            image: jarvis-paper-ingestion
            suffix: ""
          - slug: paper-ingestion-cuda
            image: jarvis-paper-ingestion
            suffix: "-cuda"
          - slug: learning-engine
            image: jarvis-learning-engine
            suffix: ""
          - slug: telegram-bot
            image: jarvis-telegram-bot
            suffix: ""
          - slug: dashboard
            image: jarvis-dashboard
            suffix: ""
          - slug: restore-uploader
            image: jarvis-restore-uploader
            suffix: ""
    name: promote (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the verified digest receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: verification-digest-${{ matrix.slug }}
          path: /tmp/verification-digest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.preflight.outputs.verification_run_id }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the verified digest
        run: |
          image="ghcr.io/limitcycle-oss/${{ matrix.image }}"
          source_ref="${image}:${{ needs.preflight.outputs.source_commit }}${{ matrix.suffix }}"
          target_ref="${image}:${{ needs.preflight.outputs.release_version }}${{ matrix.suffix }}"
          source_digest="$(python3 scripts/release_provenance.py artifact-digest \
            /tmp/verification-digest --expected-ref "$source_ref")"

          docker buildx imagetools inspect "${image}@${source_digest}"
          docker buildx imagetools create -t "$target_ref" "${image}@${source_digest}"
          target_digest="$(docker buildx imagetools inspect \
            --format '{{json .Manifest.Digest}}' "$target_ref" | tr -d '"')"
          if [ "$source_digest" != "$target_digest" ]; then
            echo "::error::promotion changed the manifest digest"
            exit 1
          fi
          echo "Promoted ${source_ref}@${source_digest} to ${target_ref}." \
            >> "$GITHUB_STEP_SUMMARY"

  promotion-gate:
    name: Promotion gate
    needs: [preflight, promote]
    # `promote` runs with fail-fast disabled so one broken image cannot abandon
    # the others half-promoted, which means the surviving legs stay green and
    # only this job can state whether the release published in full.
    # always() is required: without it a failed promotion skips the gate instead
    # of failing it. `needs.promote.result` is the aggregate of every matrix leg,
    # so it is 'success' only when all of them promoted; the mode guard keeps the
    # gate out of build-only and verification runs, where `promote` never starts.
    # A 'skipped' result in promote mode is a failure too — that is the shape a
    # release takes when nothing was promoted at all.
    if: ${{ always() && needs.preflight.outputs.mode == 'promote' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every image promoted
        env:
          PROMOTION: ${{ needs.promote.result }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
        run: |
          if [ "$PROMOTION" != "success" ]; then
            echo "::error::promotion did not complete for every image" \
                 "(result=$PROMOTION); this release is partially published"
            exit 1
          fi
          echo "Every image promoted to ${RELEASE_VERSION}." >> "$GITHUB_STEP_SUMMARY"
