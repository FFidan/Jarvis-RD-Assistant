name: Docs

# Build on every push to master (then deploy) and on PRs (build-only check).
# Keeps the same branch/PR trigger convention as ci.yml.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: MkDocs build (+ deploy on master)
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write   # needed for gh-pages branch push on master

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Full history lets mkdocs-material show last-updated dates correctly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build (strict — zero warnings allowed)
        run: mkdocs build --strict

      # Deploy only on pushes to master; PRs just build.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mkdocs gh-deploy --force
        # Deploys to the gh-pages branch (default).
        # GitHub Pages is configured to serve from that branch.
        # No custom domain — served at the default *.github.io URL.
