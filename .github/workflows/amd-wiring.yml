name: AMD wiring

# Validates the experimental ROCm/Vulkan overlays without AMD hardware:
#   L1 — the pinned ROCm ollama image exists upstream and both overlay pairs
#        produce a valid compose config;
#   L2 — the ROCm image boots and answers /api/version on a GPU-less host
#        (CPU fallback).
# Informational only — never a required check: CPU fallback is evidenced, not
# vendor-guaranteed, and the manifest check depends on an external registry.

on:
  pull_request:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.rocm.yml
      - docker-compose.vulkan.yml
      - .github/workflows/amd-wiring.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  OLLAMA_ROCM_TAG: ollama/ollama:0.31.2-rocm
  # Manifest-list digest of the tag when this wiring was last validated
  # (2026-07-11). L1 warns when the tag moves; L2 boots exactly this digest.
  OLLAMA_ROCM_DIGEST: sha256:b718f6b4f86fe27ac36791af72edce3cc2b5b5ada5089b78efd715bd2d8851f8

jobs:
  overlay-config:
    name: Overlay config + ROCm manifest (informational)
    if: github.event.repository.private == false
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: ROCm image manifest present upstream
        run: |
          docker manifest inspect "$OLLAMA_ROCM_TAG" > /dev/null
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$OLLAMA_ROCM_TAG" | tr -d '"')"
          if [ "$digest" != "$OLLAMA_ROCM_DIGEST" ]; then
            echo "::warning::${OLLAMA_ROCM_TAG} digest moved (now ${digest}) — re-validate the CPU fallback and update OLLAMA_ROCM_DIGEST"
          fi

      - name: Every pinned image publishes a linux/arm64 manifest
        run: |
          # The 2026-07 field failure was an arm64 VM. Guard that every image
          # pinned in versions.env still ships a linux/arm64 entry in its manifest
          # list, so an arm64 install has an image to pull for each service.
          missing=""
          while IFS='=' read -r key img; do
            case "$key" in *_IMAGE) ;; *) continue ;; esac
            if docker buildx imagetools inspect --format '{{json .Manifest}}' "$img" 2>/dev/null | grep -q 'arm64'; then
              echo "ok: ${key} (${img}) has linux/arm64"
            else
              echo "::warning::${key} (${img}) has no linux/arm64 in its manifest list"
              missing="${missing} ${key}"
            fi
          done < <(grep -E '^[A-Z_]+IMAGE=' versions.env)
          if [ -n "$missing" ]; then
            echo "::error::images without a linux/arm64 manifest:${missing}"
            exit 1
          fi

      - name: Validate the CUDA overlay pair
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

      - name: Validate the ROCm overlay pair
        run: docker compose -f docker-compose.yml -f docker-compose.rocm.yml config -q

      - name: Validate the Vulkan overlay pair
        run: docker compose -f docker-compose.yml -f docker-compose.vulkan.yml config -q

  cpu-fallback:
    name: ${{ matrix.display_label }} CPU fallback (informational)
    if: github.event.repository.private == false
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - overlay: rocm
            display_label: ROCm image
            boot_step_name: Boot the ROCm ollama image without a GPU
            image_override_env: 'OLLAMA_ROCM_IMAGE="ollama/ollama@${OLLAMA_ROCM_DIGEST}" \'
            log_header_label: ROCm-image
            log_grep_pattern: 'gpu|rocm|amdgpu|hip|cpu'
            failure_image_desc: the ROCm ollama image
            hw_report_note: AMD hardware
            boot_comment: |
              # Hosted runners have no /dev/kfd or /dev/dri; a `devices:` entry
              # naming a missing node fails container create, so a CI-only override
              # clears ONLY the device passthrough (the same `!reset` mechanism the
              # dev docker-compose.override.yml uses). group_add is deliberately left
              # intact so the numeric video/render GIDs resolve live on every PR —
              # bare group NAMES would fail container start here, which is the point.
              # What remains under test: the pinned ROCm image booting into CPU mode.
          - overlay: vulkan
            display_label: Vulkan overlay
            boot_step_name: Boot the Vulkan overlay without a GPU
            image_override_env: ''
            log_header_label: Vulkan-overlay
            log_grep_pattern: 'gpu|vulkan|cpu'
            failure_image_desc: the Vulkan overlay
            hw_report_note: Intel/AMD hardware
            boot_comment: |
              # Hosted runners have no /dev/dri; clear ONLY the device passthrough so
              # the container can create. group_add stays intact: it now carries
              # numeric GIDs (44/993), which apply without any /etc/group lookup — a
              # bare group name would fail container start, so leaving it in exercises
              # exactly the field fix. The standard ollama image with OLLAMA_VULKAN=1
              # finds no Vulkan device and falls back to CPU.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: ${{ matrix.boot_step_name }}
        run: |
          ${{ matrix.boot_comment }}
          cat > /tmp/ci-no-gpu.override.yml <<'EOF'
          services:
            ollama:
              devices: !reset []
          EOF
          ${{ matrix.image_override_env }}
            docker compose -f docker-compose.yml -f docker-compose.${{ matrix.overlay }}.yml \
              -f /tmp/ci-no-gpu.override.yml up -d ollama

      - name: Ollama answers /api/version on CPU
        run: |
          for _ in $(seq 1 36); do
            if version="$(curl -fs --max-time 5 http://127.0.0.1:11434/api/version)"; then
              echo "${{ matrix.display_label }} fell back to CPU and answered /api/version: ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::ollama (${{ matrix.display_label }}) did not answer /api/version within 3 minutes on a GPU-less host"
          docker ps -a
          exit 1

      - name: GPU-detection log excerpt
        if: always()
        run: |
          {
            echo '### ollama ${{ matrix.log_header_label }} boot log (GPU detection lines)'
            echo '```'
            docker logs "$(docker ps -aq --filter name=ollama | head -1)" 2>&1 \
              | grep -iE '${{ matrix.log_grep_pattern }}' | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Failure guidance
        if: failure()
        run: |
          echo "::warning::CPU fallback of ${{ matrix.failure_image_desc }} failed. If ${{ matrix.hw_report_note }} misbehaves for you, please file a hardware report: https://github.com/limitcycle-oss/jarvis-rd-assistant/issues/new?template=hardware-report.yml"

      - name: Teardown
        if: always()
        run: |
          ${{ matrix.image_override_env }}
            docker compose -f docker-compose.yml -f docker-compose.${{ matrix.overlay }}.yml \
              -f /tmp/ci-no-gpu.override.yml down -v --remove-orphans || true
