name: CI

# Public-launch CI. The `cross-user-isolation` job is the release gate.
#
# BRANCH PROTECTION: mark the terminal `gate` job (defined at the bottom of
# this file) as the ONLY required status check. It `needs:` all real jobs,
# so requiring `gate` transitively requires lint-test + cross-user-isolation
# + frontend. Requiring individual jobs directly is fragile (a renamed job
# silently drops the gate); `gate` makes the requirement self-enforcing.
on:
  public:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Run the test environment in UTC so date-relative tests agree with the app's
  # UTC date handling across Python and PostgreSQL.
  TZ: UTC

jobs:
  lint-test:
    if: github.event.repository.private == false
    name: Lint + fast test suite
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check services/ libs/ scripts/

      - name: Guard - complexity budget (no-growth ratchet)
        run: uv run python scripts/check-complexity-budget.py

      - name: Tach (module boundaries)
        run: uv run tach check

      - name: Set up Node (for pyright)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"

      - name: Pyright (type check)
        # Resolves imports against the uv-synced .venv created above; pyrightconfig.json
        # pins basic mode + the services/lib include set (tests/scripts/frontend excluded).
        run: uv run npx --yes pyright@1.1.408

      - name: Test-shape check
        run: uv run python3 scripts/check-test-shape.py

      - name: Fast test suite
        run: uv run pytest

      - name: Guard - no tracked secrets
        run: bash scripts/check-no-tracked-secrets.sh

      - name: Guard - no burned Langfuse init secrets
        run: bash scripts/check-burned-secrets.sh

      - name: Guard - no unsafe user-id resolver
        run: python3 scripts/check-no-unsafe-resolver.py

      - name: Guard - no JSONB double-encode
        run: python3 scripts/check-no-jsonb-double-encode.py

      - name: Guard - docs links in sync
        run: python3 scripts/check_contract_docs.py

      - name: Guard - migrations no explicit transaction
        run: bash scripts/check-migrations-no-tx.sh

      - name: Guard - dependency parity
        run: bash scripts/check-python-deps.sh

  cross-user-isolation:
    if: github.event.repository.private == false
    name: Cross-user isolation (release gate)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # A runner-managed PostgreSQL 16 (postgres:16.8) is provided via the
    # `services:` block below, on tmpfs.  The live-PG fixtures clone a fresh
    # EMPTY database from it per session (CREATE DATABASE … TEMPLATE template0)
    # instead of shelling `docker run`, so pytest issues ZERO docker commands and
    # parallel runners never contend on the Docker daemon.  The host port is RANDOM (`ports: - 5432`): this
    # avoids colliding with a pre-existing local Postgres on port 5432, and also
    # lets two concurrent jobs on one host coexist.
    # The first step resolves JARVIS_TEST_PG_ADMIN_DSN from the assigned port.
    #
    # PYTHONPATH must include services/learning_engine (and the other service +
    # lib roots) so that `pytest.importorskip("learning_engine.main")` at the
    # top of the test module succeeds.  Without it pytest sees 0 collected /
    # 1 skipped and exits with code 5 (vacuously green — the bug we're fixing).
    #
    # --override-ini="addopts=…" replaces the service-local pytest.ini addopts
    # which contains `-m "not live_pg and not integration"` — that marker
    # filter ANDs with the CLI -m flag and makes the test set empty.
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_PASSWORD: jarvis-ci
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432
    env:
      JARVIS_RUN_LIVE_PG: "1"
      PYTHONPATH: >-
        services/paper_ingestion:services/learning_engine:services/telegram_bot:libs/jarvis_common
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Resolve managed-Postgres admin DSN
        run: >-
          echo "JARVIS_TEST_PG_ADMIN_DSN=postgresql://postgres:jarvis-ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Cross-user isolation suite
        run: >-
          uv run pytest
          --override-ini="addopts=--import-mode=importlib"
          -m "integration and live_pg"
          services/paper_ingestion/tests/integration/test_cross_user_isolation.py
          -v

      - name: Guard - squashed baseline schema invariants
        # Reuses this job's JARVIS_RUN_LIVE_PG=1 + JARVIS_TEST_PG_ADMIN_DSN (the
        # live-PG fixture clones a fresh empty db from the managed `services:`
        # Postgres). The guard tests are marked `live_pg` only, so the marker
        # filter is `live_pg`, not
        # the `integration and live_pg` used by the cross-user file above.
        # The squashed baseline (db/init.sql) collapses all migrations into one
        # init script; test_baseline_invariants.py is the guard that keeps it honest.
        run: >-
          uv run pytest
          --override-ini="addopts=--import-mode=importlib"
          -m "live_pg"
          services/paper_ingestion/tests/test_baseline_invariants.py
          -v

      - name: Guard — exit 5 (no tests collected) is a failure
        if: always()
        run: |
          # Re-run collection-only and parse the N/M summary line.
          # grep -c "test_user_b_cannot_reach" is rename-fragile: a renamed test
          # drops the count to 0 and silently makes this gate vacuously green.
          # The N/M collected footer is stable across test-name changes.
          OUTPUT=$(uv run pytest \
            --override-ini="addopts=--import-mode=importlib" \
            -m "integration and live_pg" \
            services/paper_ingestion/tests/integration/test_cross_user_isolation.py \
            --collect-only -q 2>&1 || true)
          echo "$OUTPUT" | tail -5
          # Pytest prints "N/M tests collected" when a marker selects a subset, but
          # "N tests collected" (no slash) when ALL collected tests match the marker
          # (single-file invocation). Match both forms; extract the leading integer.
          N=$(echo "$OUTPUT" | grep -oE '([0-9]+/[0-9]+|[0-9]+) tests collected' | head -1 | grep -oE '^[0-9]+')
          echo "Cross-user isolation tests collected: ${N:-0}"
          if [ -z "$N" ] || [ "$N" -eq 0 ]; then
            echo "ERROR: zero cross-user isolation tests collected — gate would pass vacuously."
            exit 1
          fi

  contract-tests:
    if: github.event.repository.private == false
    name: Contract layer (DB-backed)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # A runner-managed PostgreSQL 16 (postgres:16.8) is provided via `services:`
    # below, on tmpfs.  The contract_pg_dsn fixture clones ONE fresh empty
    # database from it per session (CREATE DATABASE … TEMPLATE template0) and
    # applies db/init.sql + run_migrations() once; per-test isolation is via
    # asyncpg transaction rollback (zero per-test cost).  No `docker run` from
    # pytest.  Random host port (`ports: - 5432`) — use a random host port so a
    # pre-existing local Postgres doesn't collide, and concurrent jobs can coexist.
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_PASSWORD: jarvis-ci
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432
    env:
      JARVIS_RUN_LIVE_PG: "1"
      PYTHONPATH: >-
        services/paper_ingestion:services/learning_engine:services/telegram_bot:libs/jarvis_common
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Resolve managed-Postgres admin DSN
        run: >-
          echo "JARVIS_TEST_PG_ADMIN_DSN=postgresql://postgres:jarvis-ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Contract suite
        run: >-
          uv run pytest
          --override-ini="addopts=--import-mode=importlib"
          -m contract
          -v

      - name: Guard — non-zero contract tests collected
        if: always()
        run: |
          # Re-run --collect-only to confirm >0 contract tests were collected.
          # Exit code 5 (no tests) or zero count would otherwise let the job
          # silently pass with no assertions.
          OUTPUT=$(uv run pytest \
            --override-ini="addopts=--import-mode=importlib" \
            -m contract --collect-only -q 2>&1 || true)
          echo "$OUTPUT" | tail -5
          # Extract collected count from pytest's "N/M tests collected" footer
          N=$(echo "$OUTPUT" | grep -oE '[0-9]+/[0-9]+ tests collected' | head -1 | cut -d/ -f1)
          echo "Contract tests collected: ${N:-0}"
          if [ -z "$N" ] || [ "$N" -eq 0 ]; then
            echo "ERROR: zero contract tests collected — gate would pass vacuously"
            exit 1
          fi

  frontend:
    if: github.event.repository.private == false
    name: Frontend lint + test + build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Unit tests
        run: npm --prefix frontend run test -- --run

      - name: Build
        run: npm --prefix frontend run build

  e2e-mocked:
    if: github.event.repository.private == false
    name: E2E mocked smoke (non-blocking)
    # NOT listed in gate.needs — failures are informational only (continue-on-error: true).
    # The mocked suite is green as of 2026-06; it was previously red/cancelled due to a
    # Service-Worker-vs-page.route bypass, fixed via serviceWorkers:'block' in playwright.config.ts.
    # Promote to required after >=2 consecutive green e2e-mocked runs on main. Two edits required:
    #   1. Set `continue-on-error: false` on this job (line below).
    #   2. Add "e2e-mocked" to gate.needs (the list in the gate job below).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Run only after the frontend build succeeds so we know the bundle is healthy.
    needs: [frontend]
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install Playwright Chromium
        # No --with-deps: the CI runner has no passwordless sudo; its OS
        # libraries are pre-provisioned, so install only the browser binary.
        run: npx --prefix frontend playwright install chromium

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Serve frontend + run mocked e2e suite
        run: |
          # Serve the production build on :3001 (matches PLAYWRIGHT_BASE_URL default).
          # vite preview is available as a devDependency (vite is already installed).
          npm --prefix frontend run preview -- --port 3001 --host 127.0.0.1 &
          SERVER_PID=$!
          # Wait for the preview server to be ready (up to 30 s).
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/ > /dev/null 2>&1 && break
            sleep 1
          done
          # Run mocked specs (no live backend required). Workers=2 to speed up E2E tests
          # on 2-core runners (Vite preview serves a pre-built static bundle, so there is
          # no dynamic compilation race).
          # Uses the test:e2e:mocked npm script which targets the explicit mocked spec list.
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 npm --prefix frontend run test:e2e:mocked -- \
            --workers=2 \
            --reporter=line || rc=$?
          kill "$SERVER_PID" || true
          exit "${rc:-0}"
        env:
          CI: "true"

  # gate — Enforced as a required status check via branch protection (not via cross-workflow needs:).
  gate:
    if: ${{ always() && github.event.repository.private == false }}
    name: CI gate (required status check)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [lint-test, cross-user-isolation, contract-tests, frontend]
    steps:
      - name: Verify CI jobs
        env:
          LINT_TEST: ${{ needs.lint-test.result }}
          CROSS_USER_ISOLATION: ${{ needs.cross-user-isolation.result }}
          CONTRACT_TESTS: ${{ needs.contract-tests.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          fail=0
          for pair in "lint-test=$LINT_TEST" "cross-user-isolation=$CROSS_USER_ISOLATION" \
                      "contract-tests=$CONTRACT_TESTS" "frontend=$FRONTEND"; do
            name="${pair%%=*}"; result="${pair##*=}"
            if [ "$result" != "success" ]; then
              echo "::error::required CI job '$name' did not succeed (result=$result)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "CI gate: all required jobs are green."
          exit "$fail"
