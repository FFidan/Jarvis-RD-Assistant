name: CI

# Branch protection should require the terminal `gate` job defined below. Its
# dependencies make every validation job part of that single required check.
on:
  public:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Run the test environment in UTC so date-relative tests agree with the app's
  # UTC date handling across Python and PostgreSQL.
  TZ: UTC

jobs:
  lint-test:
    if: github.event.repository.private == false
    name: Lint + fast test suite
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check services/ libs/ scripts/

      - name: Guard - complexity budget (no-growth ratchet)
        run: uv run python scripts/check-complexity-budget.py

      - name: Tach (module boundaries)
        run: uv run tach check

      - name: Set up Node (for pyright)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Pyright (type check)
        # Resolves imports against the uv-synced .venv created above; pyrightconfig.json
        # pins basic mode + the services/lib include set (tests/scripts/frontend excluded).
        run: uv run npx --yes pyright@1.1.408

      - name: Test-shape check
        run: uv run python3 scripts/check-test-shape.py

      - name: Fast test suite
        run: uv run pytest

      - name: Deterministic shell contracts
        run: make test-shell-contracts

      - name: Guard - no tracked secrets
        run: bash scripts/check-no-tracked-secrets.sh

      - name: Guard - no burned Langfuse init secrets
        run: bash scripts/check-burned-secrets.sh

      - name: Guard - no unsafe user-id resolver
        run: python3 scripts/check-no-unsafe-resolver.py

      - name: Guard - no JSONB double-encode
        run: python3 scripts/check-no-jsonb-double-encode.py

      - name: Guard - docs links in sync
        run: python3 scripts/check_contract_docs.py

      - name: Guard - migrations no explicit transaction
        run: bash scripts/check-migrations-no-tx.sh

      - name: Guard - dependency parity
        run: bash scripts/check-python-deps.sh

  cross-user-isolation:
    if: github.event.repository.private == false
    name: Cross-user isolation (release gate)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # PostgreSQL runs as a GitHub-managed service on tmpfs. The fixtures clone a
    # fresh database per session and use the assigned random host port, avoiding
    # Docker commands inside pytest and port conflicts between jobs.
    # PYTHONPATH exposes every service imported by the isolation suite.
    # The addopts override replaces the service-local marker exclusion so the
    # explicit live integration selection cannot be filtered to an empty set.
    services:
      postgres:
        image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
        env:
          POSTGRES_PASSWORD: jarvis-ci
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432
    env:
      JARVIS_RUN_LIVE_PG: "1"
      PYTHONPATH: >-
        services/paper_ingestion:services/learning_engine:services/telegram_bot:libs/jarvis_common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve managed-Postgres admin DSN
        run: >-
          echo "JARVIS_TEST_PG_ADMIN_DSN=postgresql://postgres:jarvis-ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Cross-user isolation suite
        run: >-
          uv run pytest
          --override-ini="addopts=--import-mode=importlib"
          -m "integration and live_pg"
          services/paper_ingestion/tests/integration/test_cross_user_isolation.py
          --junitxml=cross-user-isolation.junit.xml
          -v

      - name: Squashed baseline schema invariants
        # This reuses the job's managed PostgreSQL fixture. These tests carry
        # only the `live_pg` marker, so select that marker explicitly.
        run: >-
          uv run pytest
          --override-ini="addopts=--import-mode=importlib"
          -m "live_pg"
          services/paper_ingestion/tests/test_baseline_invariants.py
          --junitxml=baseline-invariants.junit.xml
          -v

      - name: Require a non-skipped cross-user result
        if: always()
        run: >-
          uv run python scripts/check-pytest-junit.py
          cross-user-isolation.junit.xml
          --label "cross-user isolation"

      - name: Require a non-skipped baseline-schema result
        if: always()
        run: >-
          uv run python scripts/check-pytest-junit.py
          baseline-invariants.junit.xml
          --label "baseline schema invariants"

  contract-tests:
    if: github.event.repository.private == false
    name: Contract layer (DB-backed)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # GitHub provides PostgreSQL 16 on tmpfs. The fixture clones one database,
    # applies the baseline and migrations once, then isolates tests with
    # transaction rollbacks. A random host port avoids job collisions.
    services:
      postgres:
        image: postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
        env:
          POSTGRES_PASSWORD: jarvis-ci
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432
    env:
      JARVIS_RUN_LIVE_PG: "1"
      PYTHONPATH: >-
        services/paper_ingestion:services/learning_engine:services/telegram_bot:libs/jarvis_common
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve managed-Postgres admin DSN
        run: >-
          echo "JARVIS_TEST_PG_ADMIN_DSN=postgresql://postgres:jarvis-ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres"
          >> "$GITHUB_ENV"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen --group dev

      - name: Contract suite
        # Cross-user integration and real Qdrant each have an isolated job.
        # Keep this selection on the managed-PostgreSQL contract boundary so
        # the non-skip validator cannot be satisfied by an unavailable service.
        run: >-
          uv run pytest
          --override-ini="addopts=--import-mode=importlib"
          -m "contract and not integration and not live_qdrant"
          --junitxml=contract-tests.junit.xml
          -v

      - name: Require a non-skipped contract result
        if: always()
        run: >-
          uv run python scripts/check-pytest-junit.py
          contract-tests.junit.xml
          --label "contract tests"

  frontend:
    if: github.event.repository.private == false
    name: Frontend lint + test + build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Unit tests
        run: npm --prefix frontend run test -- --run --no-file-parallelism

      - name: Build
        run: npm --prefix frontend run build

  e2e-mocked:
    if: github.event.repository.private == false
    name: E2E mocked smoke
    # Required via gate.needs: a failed run fails the CI gate and blocks the
    # merge. The suite runs against the static production build only —
    # Playwright intercepts every /api call (serviceWorkers:'block' in
    # playwright.config.ts keeps the Service Worker from bypassing page.route).
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Run only after the frontend build succeeds so we know the bundle is healthy.
    needs: [frontend]
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install Playwright Chromium
        # No --with-deps: the CI runner has no passwordless sudo; its OS
        # libraries are pre-provisioned, so install only the browser binary.
        run: npx --prefix frontend playwright install chromium

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Serve frontend + run mocked e2e suite
        run: |
          # Serve the production build on :3001 (matches PLAYWRIGHT_BASE_URL default).
          # vite preview is available as a devDependency (vite is already installed).
          JARVIS_E2E_MOCK_HEALTH=true npm --prefix frontend run preview -- --port 3001 --host 127.0.0.1 &
          SERVER_PID=$!
          # Wait for the preview server to be ready (up to 30 s).
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/ > /dev/null 2>&1 && break
            sleep 1
          done
          # Run mocked specs against the static frontend only; any /api call not intercepted
          # by Playwright should fail the spec rather than reaching a live backend.
          # Workers=2 to speed up E2E tests
          # on 2-core runners (Vite preview serves a pre-built static bundle, so there is
          # no dynamic compilation race).
          # Uses the test:e2e:mocked npm script which targets the explicit mocked spec list.
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3001 npm --prefix frontend run test:e2e:mocked -- \
            --workers=2 \
            --reporter=line || rc=$?
          kill "$SERVER_PID" || true
          exit "${rc:-0}"
        env:
          CI: "true"

  # Branch protection requires this aggregate result.
  gate:
    if: ${{ always() && github.event.repository.private == false }}
    name: CI gate (required status check)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [lint-test, cross-user-isolation, contract-tests, frontend, e2e-mocked]
    steps:
      - name: Verify CI jobs
        env:
          LINT_TEST: ${{ needs.lint-test.result }}
          CROSS_USER_ISOLATION: ${{ needs.cross-user-isolation.result }}
          CONTRACT_TESTS: ${{ needs.contract-tests.result }}
          FRONTEND: ${{ needs.frontend.result }}
          E2E_MOCKED: ${{ needs.e2e-mocked.result }}
        run: |
          fail=0
          for pair in "lint-test=$LINT_TEST" "cross-user-isolation=$CROSS_USER_ISOLATION" \
                      "contract-tests=$CONTRACT_TESTS" "frontend=$FRONTEND" \
                      "e2e-mocked=$E2E_MOCKED"; do
            name="${pair%%=*}"; result="${pair##*=}"
            if [ "$result" != "success" ]; then
              echo "::error::required CI job '$name' did not succeed (result=$result)"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "CI gate: all required jobs are green."
          exit "$fail"
