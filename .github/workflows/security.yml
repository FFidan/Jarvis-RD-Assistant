name: Security

# Supply-chain security CI.
# Runs pip-audit + npm-audit (Python and JS dependency CVE scans), osv-scanner
# (multi-ecosystem OSV database scan), and a docker-build smoke test to confirm
# all service images build cleanly.  SBOM generation on release is handled by
# .github/workflows/sbom.yml.  The terminal `security-gate` job can be added
# to ci.yml gate.needs once the workflow has a green baseline.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit — Python dependency CVE scan (per-service requirements.txt)
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: ${{ vars.JARVIS_RUNNER == '' }}
          prune-cache: false  # self-hosted: skip post-job prune (races the shared uv cache lock across parallel runners)
          python-version: "3.12"

      # Audit the hash-pinned constraints.txt (exact == pins + --hash) with
      # --no-deps --disable-pip: this skips pip-audit's ephemeral-venv creation
      # + pip self-upgrade (which can fail when pip is externally managed) and
      # audits the exact dependency graph Docker installs. requirements.txt uses
      # range pins (>=,<) which --disable-pip rejects; constraints.txt is the
      # fully-pinned lock. osv-scanner already does the deep transitive scan.
      - name: Audit paper_ingestion
        run: uvx pip-audit --no-deps --disable-pip -r services/paper_ingestion/constraints.txt

      - name: Audit learning_engine
        run: uvx pip-audit --no-deps --disable-pip -r services/learning_engine/constraints.txt

      - name: Audit telegram_bot
        run: uvx pip-audit --no-deps --disable-pip -r services/telegram_bot/constraints.txt

  # ---------------------------------------------------------------------------
  # npm-audit — Frontend JavaScript dependency CVE scan
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm-audit (JS SCA)
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Audit (fail on high severity)
        run: npm audit --prefix frontend --audit-level=high

  # ---------------------------------------------------------------------------
  # osv-scanner — Multi-ecosystem CVE scan against OSV database
  # Version pin: v2.0.2 (latest stable at 2026-05-26; update via renovate/dependabot)
  # ---------------------------------------------------------------------------
  osv-scanner:
    name: osv-scanner (multi-ecosystem CVE)
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Install osv-scanner v2.0.2 (prebuilt binary; no Go toolchain)
        run: |
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: Run osv-scanner
        run: /tmp/osv-scanner scan --recursive .

  docker-build-smoke:
    name: Docker build smoke test
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    env:
      # BuildKit (buildx is installed on the runner) — enables the
      # `RUN --mount=type=cache` pip wheel cache in the 3 service Dockerfiles, so
      # a constraints.txt change re-uses downloaded wheels instead of re-fetching
      # the multi-GB torch/docling set (dep-bump rebuilds ~8min -> ~2min). Every
      # other consumer (docker compose build in update.sh) already defaults to
      # BuildKit, so the `# syntax`/`--mount` Dockerfiles build everywhere.
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build paper_ingestion image
        run: |
          docker build \
            -t smoke-paper-ingestion:test \
            -f services/paper_ingestion/Dockerfile \
            .

      - name: Build learning_engine image
        run: |
          docker build \
            -t smoke-learning-engine:test \
            -f services/learning_engine/Dockerfile \
            .

      - name: Build telegram_bot image
        run: |
          docker build \
            -t smoke-telegram-bot:test \
            -f services/telegram_bot/Dockerfile \
            .

      - name: Build dashboard (frontend) image
        run: |
          docker build \
            -t smoke-dashboard:test \
            frontend/

      - name: Build langfuse hardened wrapper image
        run: |
          # Source versions.env to get the upstream image build-arg.
          set -a; . ./versions.env; set +a
          docker build \
            --build-arg LANGFUSE_BASE_IMAGE="${LANGFUSE_IMAGE}" \
            -t smoke-langfuse-hardened:test \
            -f langfuse/Dockerfile.langfuse \
            langfuse/

  # ---------------------------------------------------------------------------
  # security-gate — Terminal job; can be added to ci.yml gate.needs once a
  # green baseline is established.
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ${{ vars.JARVIS_RUNNER || 'ubuntu-latest' }}
    needs: [pip-audit, npm-audit, osv-scanner, docker-build-smoke]
    steps:
      - name: All security jobs passed
        run: echo "pip-audit + npm-audit + osv-scanner + docker-build-smoke all green"
