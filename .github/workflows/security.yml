name: Security

# Supply-chain and secret-scanning CI.
# Closes: SEC-HIGH-05 (pip-audit + npm-audit + osv-scanner), W2-CF2 (docker-build-smoke).
#
# NOTE (out-of-scope): SEC-HIGH-05(c) "move SBOM to push" is owned by .github/workflows/sbom.yml
# (W9-T4 scope). The osv-scanner job here satisfies the CVE-scan requirement.
#
# NOTE (gate wiring): Add "security-gate" to ci.yml gate.needs once this workflow has
# a green baseline run — fold into W11 follow-up per task partition.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit — Python dependency CVE scan (per-service requirements.txt)
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install pip-audit
        run: uv tool install pip-audit

      - name: Audit paper_ingestion
        run: uv tool run pip-audit $(grep -v '^#' .github/pip-audit-ignore.txt | grep -v '^$' | sed 's/^/--ignore-vuln /' | tr '\n' ' ') -r services/paper_ingestion/requirements.txt

      - name: Audit learning_engine
        run: uv tool run pip-audit $(grep -v '^#' .github/pip-audit-ignore.txt | grep -v '^$' | sed 's/^/--ignore-vuln /' | tr '\n' ' ') -r services/learning_engine/requirements.txt

      - name: Audit telegram_bot
        run: uv tool run pip-audit $(grep -v '^#' .github/pip-audit-ignore.txt | grep -v '^$' | sed 's/^/--ignore-vuln /' | tr '\n' ' ') -r services/telegram_bot/requirements.txt

  # ---------------------------------------------------------------------------
  # npm-audit — Frontend JavaScript dependency CVE scan
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm-audit (JS SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Audit (fail on high severity)
        run: npm audit --prefix frontend --audit-level=high

  # ---------------------------------------------------------------------------
  # osv-scanner — Multi-ecosystem CVE scan against OSV database
  # Version pin: v2.0.2 (latest stable at 2026-05-26; update via renovate/dependabot)
  # ---------------------------------------------------------------------------
  osv-scanner:
    name: osv-scanner (multi-ecosystem CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install osv-scanner v2.0.2
        # ubuntu-latest ships Go; install the pinned release binary directly.
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.0.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/osv-scanner" --version

      - name: Scan lockfiles (recursive)
        # Exits 1 if vulnerabilities are found; exits 2 on internal error.
        # osv-scanner reads lockfiles (uv.lock, package-lock.json, etc.) —
        # it does not traverse node_modules or .venv directories.
        # v2 default: git not scanned (old --skip-git → no flag now;
        # opt-in via --include-git-root).
        run: osv-scanner scan --recursive .

  # ---------------------------------------------------------------------------
  # docker-build-smoke — Build all service images to catch Dockerfile regressions
  # Closes: W2-CF2
  # ---------------------------------------------------------------------------
  docker-build-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build paper_ingestion image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t smoke-paper-ingestion:test \
            -f services/paper_ingestion/Dockerfile \
            .

      - name: Build learning_engine image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t smoke-learning-engine:test \
            -f services/learning_engine/Dockerfile \
            .

      - name: Build telegram_bot image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t smoke-telegram-bot:test \
            -f services/telegram_bot/Dockerfile \
            .

      - name: Build dashboard (frontend) image
        run: |
          docker build \
            --no-cache \
            --progress=plain \
            -t smoke-dashboard:test \
            frontend/

      - name: Build langfuse hardened wrapper image
        run: |
          # Source versions.env to get the upstream image build-arg.
          set -a; . ./versions.env; set +a
          docker build \
            --no-cache \
            --progress=plain \
            --build-arg LANGFUSE_BASE_IMAGE="${LANGFUSE_IMAGE}" \
            -t smoke-langfuse-hardened:test \
            -f langfuse/Dockerfile.langfuse \
            langfuse/

  # ---------------------------------------------------------------------------
  # security-gate — Terminal job; add to ci.yml gate.needs in W11 follow-up
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [pip-audit, npm-audit, osv-scanner, docker-build-smoke]
    steps:
      - name: All security jobs passed
        run: echo "pip-audit + npm-audit + osv-scanner + docker-build-smoke all green"
