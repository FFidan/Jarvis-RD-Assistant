name: Security

# Supply-chain security CI.
# Runs pip-audit + npm-audit (Python and JS dependency CVE scans), osv-scanner
# (multi-ecosystem OSV database scan), and a docker-build smoke test to confirm
# all service images build cleanly.  SBOM generation on release is handled by
# .github/workflows/sbom.yml.  The terminal `security-gate` job can be added
# to ci.yml gate.needs once the workflow has a green baseline.
on:
  public:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # pip-audit — Python dependency CVE scan (per-service requirements.txt)
  # ---------------------------------------------------------------------------
  pip-audit:
    if: github.event.repository.private == false
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1  # v8.3.1
        with:
          enable-cache: true
          python-version: "3.12"

      # Audit the hash-pinned constraints.txt (exact == pins + --hash) with
      # --no-deps --disable-pip: this skips pip-audit's ephemeral-venv creation
      # + pip self-upgrade (which can fail when pip is externally managed) and
      # audits the exact dependency graph Docker installs. requirements.txt uses
      # range pins (>=,<) which --disable-pip rejects; constraints.txt is the
      # fully-pinned lock. osv-scanner already does the deep transitive scan.
      - name: Audit paper_ingestion
        run: |
          uvx pip-audit --no-deps --disable-pip \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln PYSEC-2026-3447 \
            -r services/paper_ingestion/constraints.txt
          # torch CVE-2025-3000: no compatible patched wheel yet (last_affected=2.12.0 per GHSA-rrmf-rvhw-rf47);
          # re-evaluate at next torch bump
          # setuptools PYSEC-2026-3447 (CVE-2026-59890, fixed in 83.0.0): torch 2.11.0 pins setuptools<82,
          # so the fix is not installable until torch bumps; setuptools is build-time only. Re-evaluate at next torch bump.

      - name: Audit learning_engine
        run: uvx pip-audit --no-deps --disable-pip -r services/learning_engine/constraints.txt

      - name: Audit telegram_bot
        run: uvx pip-audit --no-deps --disable-pip -r services/telegram_bot/constraints.txt

  # ---------------------------------------------------------------------------
  # npm-audit — Frontend JavaScript dependency CVE scan
  # ---------------------------------------------------------------------------
  npm-audit:
    if: github.event.repository.private == false
    name: npm-audit (JS SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Audit (fail on high severity)
        run: npm audit --prefix frontend --audit-level=high

  # ---------------------------------------------------------------------------
  # osv-scanner — Multi-ecosystem CVE scan against OSV database
  # Version pin: v2.0.2 (latest stable at 2026-05-26; update via renovate/dependabot)
  # ---------------------------------------------------------------------------
  osv-scanner:
    if: github.event.repository.private == false
    name: osv-scanner (multi-ecosystem CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install osv-scanner v2.0.2 (prebuilt binary; no Go toolchain)
        run: |
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.0.2/osv-scanner_linux_amd64
          # Integrity check: verify the downloaded binary matches the SHA-256 published
          # in osv-scanner_SHA256SUMS for v2.0.2 before executing it (supply-chain defence).
          echo "3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8  /tmp/osv-scanner" | sha256sum -c
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: Run osv-scanner
        run: /tmp/osv-scanner scan --recursive .

  docker-build-smoke:
    if: github.event.repository.private == false
    name: Docker build smoke test
    runs-on: ubuntu-latest
    env:
      # BuildKit (buildx is installed on the runner) — enables the
      # `RUN --mount=type=cache` pip wheel cache in the 3 service Dockerfiles, so
      # a constraints.txt change re-uses downloaded wheels instead of re-fetching
      # the multi-GB torch/docling set (dep-bump rebuilds ~8min -> ~2min). Every
      # other consumer (docker compose build in update.sh) already defaults to
      # BuildKit, so the `# syntax`/`--mount` Dockerfiles build everywhere.
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Build paper_ingestion image
        run: |
          docker build \
            -t smoke-paper-ingestion:test \
            -f services/paper_ingestion/Dockerfile \
            .

      - name: Build learning_engine image
        run: |
          docker build \
            -t smoke-learning-engine:test \
            -f services/learning_engine/Dockerfile \
            .

      - name: Build telegram_bot image
        run: |
          docker build \
            -t smoke-telegram-bot:test \
            -f services/telegram_bot/Dockerfile \
            .

      - name: Build dashboard (frontend) image
        run: |
          docker build \
            -t smoke-dashboard:test \
            frontend/

      - name: Build langfuse hardened wrapper image
        run: |
          # Source versions.env to get the upstream image build-arg.
          set -a; . ./versions.env; set +a
          # This wrapper builds FROM the upstream langfuse base on Docker Hub.
          # Langfuse is OPTIONAL observability (OBSERVABILITY_ENABLED defaults off);
          # the core product never needs a fresh pull. A transient Docker Hub rate
          # limit (HTTP 429) on this external base image is an infra condition, not a
          # code regression — so retry with backoff and SKIP (do not fail the security
          # workflow) if Docker Hub keeps rate-limiting. The 4 core product images
          # above still hard-gate; a genuine (non-429) wrapper build error still fails.
          for attempt in 1 2 3; do
            if docker build \
                --build-arg LANGFUSE_BASE_IMAGE="${LANGFUSE_IMAGE}" \
                -t smoke-langfuse-hardened:test \
                -f langfuse/Dockerfile.langfuse \
                langfuse/ 2> /tmp/langfuse_build.err; then
              echo "langfuse hardened wrapper built OK"
              exit 0
            fi
            if grep -qiE "429 Too Many Requests|toomanyrequests|rate.?limit" /tmp/langfuse_build.err; then
              echo "::warning::Docker Hub rate-limited the langfuse base-image pull (attempt ${attempt}/3)"
              tail -3 /tmp/langfuse_build.err || true
              sleep $((attempt * 30))
              continue
            fi
            echo "::error::langfuse hardened wrapper build failed (not a registry rate-limit)"
            cat /tmp/langfuse_build.err
            exit 1
          done
          echo "::warning::Skipping langfuse wrapper smoke — Docker Hub kept rate-limiting the optional observability base image (infra, not a code issue). Core product images built OK."
          exit 0

  # ---------------------------------------------------------------------------
  # gitleaks — Secret scan over the FULL git history (every commit).
  # Version pin: v8.30.1 (latest stable 8.x at 2026-06-24; update via dependabot).
  # Uses the prebuilt binary (mirrors the osv-scanner pattern; no Go toolchain
  # required). Allowlist for non-secrets lives in .gitleaks.toml.
  # ---------------------------------------------------------------------------
  gitleaks:
    if: github.event.repository.private == false
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # full history — `gitleaks detect` scans every commit

      - name: Install gitleaks v8.30.1 (prebuilt binary; no Go toolchain)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # Integrity check: verify the tarball matches the SHA-256 published in
          # gitleaks_8.30.1_checksums.txt for v8.30.1 before extracting/executing
          # (supply-chain defence; mirrors the osv-scanner integrity check above).
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Run gitleaks (full history)
        # --redact: never print a matched secret to the log.
        # --exit-code 1: fail the job if any (non-allowlisted) leak is found.
        run: /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

  # ---------------------------------------------------------------------------
  # codeql — Static analysis (code scanning) for Python and JS/TS.
  # Interpreted languages use the no-build path (build-mode: none).
  # Pin: github/codeql-action v4.36.3.
  # NOTE: this job's green run is deferred to the v0.9.0 PR (no CodeQL CLI to
  # validate locally); the YAML/SHAs/permissions are pinned and reviewed here.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning (SARIF upload) requires GitHub Advanced Security on a PRIVATE
    # repo and is free once the repo is public. Run CodeQL only when the repo is
    # public, so it auto-activates at the public flip with no further edit; while
    # private it is skipped and the security-gate below tolerates the skip.
    if: ${{ github.event.repository.private == false }}
    permissions:
      security-events: write  # required to upload SARIF results to code scanning
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none  # interpreted languages — no compilation step needed

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.36.3
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------------
  # security-gate — Enforced as a required status check via branch protection (not via cross-workflow needs:).
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [pip-audit, npm-audit, osv-scanner, docker-build-smoke, gitleaks, codeql]
    # always() so the gate reports a definitive pass/fail even when codeql is
    # SKIPPED on a private repo (see the codeql job). Job results are read via env
    # and checked explicitly — a skipped codeql is acceptable, any failure is not.
    if: ${{ always() && github.event.repository.private == false }}
    steps:
      - name: Verify security jobs
        env:
          PIP_AUDIT: ${{ needs.pip-audit.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          OSV_SCANNER: ${{ needs.osv-scanner.result }}
          DOCKER_SMOKE: ${{ needs.docker-build-smoke.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          fail=0
          for pair in "pip-audit=$PIP_AUDIT" "npm-audit=$NPM_AUDIT" \
                      "osv-scanner=$OSV_SCANNER" "docker-build-smoke=$DOCKER_SMOKE" \
                      "gitleaks=$GITLEAKS"; do
            name="${pair%%=*}"; result="${pair##*=}"
            if [ "$result" != "success" ]; then
              echo "::error::required security job '$name' did not succeed (result=$result)"
              fail=1
            fi
          done
          # CodeQL gates only when it actually ran (public repo). 'skipped' is
          # acceptable while the repo is private; anything else is a failure.
          case "$CODEQL" in
            success) echo "codeql: success" ;;
            skipped) echo "::notice::codeql skipped (private repo — code scanning activates at the public flip)" ;;
            *) echo "::error::codeql did not succeed (result=$CODEQL)"; fail=1 ;;
          esac
          [ "$fail" -eq 0 ] && echo "Security gate: all required security jobs are green."
          exit "$fail"
