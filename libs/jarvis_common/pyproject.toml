[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-common"
version = "0.1.0"
description = "Shared application infrastructure for JARVIS RD Assistant"
authors = [{ name = "Ferhat Fidan", email = "jarvis-rd@limitcycle.dev" }]
maintainers = [{ name = "Ferhat Fidan", email = "jarvis-rd@limitcycle.dev" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "asyncpg>=0.30.0",
    "asyncpg-listen>=0.0.9",
    "cryptography>=48.0.1",
    # Matches the services. The route-table walk this package ships needs the
    # 0.137 routing API, and below it the check that pins the impersonation
    # route set degrades to a silent skip.
    "fastapi>=0.137.0,<0.141.0",
    "gitpython>=3.1.57",  # >=3.1.57 clears GHSA-3f7w-8rr8-f37f and prior GitPython advisories
    "httpx>=0.27.0",
    "idna>=3.15",
    "instructor>=1.15.0",
    "lxml>=6.1.0",
    "langfuse>=2.50",
    "openai>=2.0.0",
    "procrastinate[aiopg]>=0.49",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0.0",
    "slowapi>=0.1.9",
    "urllib3>=2.7.0",
]

[tool.setuptools.package-data]
jarvis_common = ["data/*.json"]
