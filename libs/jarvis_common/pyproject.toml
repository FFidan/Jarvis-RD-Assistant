[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "asyncpg-listen>=0.0.9",
    "cryptography>=46.0.7",
    "fastapi>=0.136.1",
    "gitpython>=3.1.50",
    "httpx>=0.27.0",
    "idna>=3.15",
    "instructor>=1.15.0",
    "lxml>=6.1.0",
    "langfuse>=2.50",
    "openai>=2.0.0",
    "procrastinate[aiopg]>=0.49",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0.0",
    "slowapi>=0.1.9",
    "urllib3>=2.7.0",
]

[tool.setuptools.package-data]
jarvis_common = ["data/*.json"]
