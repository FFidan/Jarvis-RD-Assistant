[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-common"
version = "0.1.0"
description = "Internal shared infrastructure for JARVIS RD Assistant services; not a supported standalone library"
authors = [{ name = "Ferhat Fidan", email = "jarvis-rd@limitcycle.dev" }]
maintainers = [{ name = "Ferhat Fidan", email = "jarvis-rd@limitcycle.dev" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "asyncpg>=0.30.0",
    "asyncpg-listen>=0.0.9",
    "cryptography>=50.0.0",
    # Matches the services. The route-table walk this package ships needs the
    # 0.137 routing API, and below it the check that pins the impersonation
    # route set degrades to a silent skip.
    "fastapi>=0.137.0,<0.142.0",
    "gitpython>=3.1.58",  # >=3.1.58 clears the current GitPython advisory set
    "httpx>=0.27.0",
    "httpcore>=1.0,<1.1",  # direct API used by pinned outbound transport
    "idna>=3.15",
    "instructor>=1.15.0",
    "lxml>=6.1.0",
    "langfuse>=2.50",
    "openai>=2.0.0",
    "opentelemetry-sdk>=1.41.1",
    "procrastinate[aiopg]>=0.49",
    "pydantic>=2.0,<3.0.0",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0.0",
    "sentry-sdk>=2.29.0",
    "slowapi>=0.1.9",
    "starlette>=1.3.1",
    "structlog>=24.0",
    "urllib3>=2.7.0",
    "uvicorn>=0.30.0",
]

[tool.setuptools.package-data]
jarvis_common = ["data/*.json"]
