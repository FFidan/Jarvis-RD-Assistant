[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "cryptography>=42",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0",
    "slowapi>=0.1.9",
]
