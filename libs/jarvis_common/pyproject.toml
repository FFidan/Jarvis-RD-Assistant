[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "asyncpg-listen>=0.0.9",
    "cryptography>=42",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "instructor>=1.5",
    "lxml>=5.0.0",
    "langfuse>=2.50",
    "openai>=1.50",
    "procrastinate[aiopg]>=0.49",
    "pydantic-settings>=2.0",
    "rapidfuzz>=3.0.0",
    "slowapi>=0.1.9",
]

[tool.setuptools.package-data]
jarvis_common = ["data/*.json"]
