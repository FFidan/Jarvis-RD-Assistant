repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-python-deps
        name: check Python dependency exports
        entry: bash scripts/check-python-deps.sh
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|scripts/(export-service-requirements|check-python-deps)\.sh|services/.*/(requirements|constraints).*[.]txt)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: check-migrations-no-tx
        name: Check migrations don't use outer transactions / pre-seed RUNTIME_REPLAY_VERSIONS
        entry: bash scripts/check-migrations-no-tx.sh
        language: system
        pass_filenames: false
        files: ^(db/migrations/|db/init\.sql|scripts/check-migrations-no-tx\.sh)
  - repo: local
    hooks:
      - id: check-test-shape
        name: Enforce docs/contracts/07-testing.md (no handler-bypass / SQL-substring / missing markers in test files)
        entry: python3 scripts/check-test-shape.py
        language: system
        pass_filenames: true
        files: ^(services/[^/]+/tests/|libs/jarvis_common/tests/).*\.py$|^docs/contracts/07-testing\.md$
