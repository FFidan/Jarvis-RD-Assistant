# =============================================================================
# vLLM drop-in compose overlay
# =============================================================================
# Use ONLY for performance comparisons against Ollama under the LiteLLM alias.
# This overlay is intentionally NOT included in the default compose path and
# must never be merged into docker-compose.yml.
#
# Usage:
#   # 1. Start the full stack + vLLM alongside it:
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml \
#     --profile vllm up -d
#
#   # 2. Route the LiteLLM admin-DB "smart" alias to the vLLM endpoint with
#   #    scripts/perf/litellm_route_alias.py. Do NOT edit litellm/config.yaml:
#   #    smart/fast/fallback aliases are runtime DB deployments, while YAML is
#   #    reserved for dimension-locked embed entries and router settings.
#
#   # 3. Run the benchmark harness against the normal product API.
#
#   # 4. Restore the saved smart-alias snapshot + stop vLLM when done:
#   docker compose -f docker-compose.yml -f docker-compose.vllm.yml \
#     --profile vllm stop vllm
#
# Isolation guarantees:
#   - Profile "vllm" — never starts unless explicitly requested.
#   - Loopback-bound port 8080 (host). No cross-pollination with Ollama port
#     11434 or any other service.
#   - The LiteLLM admin-DB alias seam is the ONLY routing touch point.
#     Zero call-site changes required. db_helpers.validated_model() and
#     get_smart_model() always return the alias "smart"; LiteLLM routes it.
#
# VRAM budget reasoning (≈16 GB GPU):
#   - qwen3-embedding:4b (resident, keep_alive=-1): ~2.4 GB
#   - Qwen2.5-7B-Instruct-AWQ (vLLM, 4-bit AWQ): ~4.5–5.5 GB
#   - Total peak: ~7–8 GB  <  16 GB physical  → within budget with ~8 GB headroom.
#
#   AWQ was chosen over FP16 (14–15 GB) because it is the only quant that fits
#   the 16 GB box alongside the resident embedder.  On a 48 GB box use FP16
#   (Qwen2.5-7B-Instruct, ~15 GB) for a fair throughput ceiling measurement.
#
#   The Ollama smart model (qwen3:8b ≈ 5–6 GB) and the vLLM model must NOT
#   both be GPU-resident simultaneously on the 16 GB box — unload one before
#   benchmarking the other (run `ollama stop qwen3:8b` or simply not calling
#   it during the vLLM bench window).
#
# Model choice: Qwen/Qwen2.5-7B-Instruct-AWQ
#   - Same model family as the current smart model (qwen3:8b ≈ Qwen2.5-7B
#     with extended thinking; task-comparable for summarisation / card gen).
#   - AWQ 4-bit quantisation ships a HuggingFace-hosted GPTQ/AWQ repo that
#     vLLM loads natively without manual model conversion.
#   - OpenAI-compatible /v1/chat/completions endpoint exposed at 0.0.0.0:8080
#     (container) → 127.0.0.1:8080 (host), matching LiteLLM api_base convention.
# =============================================================================

services:
  paper_ingestion:
    environment:
      # Benchmark overlay only: keep the temporary admin-DB smart route stable
      # while scripts/perf/litellm_route_alias.py points it at vLLM. The
      # default compose path leaves the reconciler enabled.
      JARVIS_LITELLM_RECONCILER_ENABLED: ${JARVIS_LITELLM_RECONCILER_ENABLED:-false}

  vllm:
    # IMAGE PULL — not VRAM — is the bench's practical gate. `:latest` is the
    # largest (~7–12 GB) and non-reproducible. For a recorded bench, override
    # VLLM_IMAGE with a specific pinned release (smaller, reproducible). For a
    # cheap-but-valid relative test also set VLLM_MODEL=Qwen/Qwen2.5-3B-
    # Instruct-AWQ — vLLM's batching advantage is exercised by PERF_CONCURRENCY,
    # not model size. See docs/perf/2026-05-18-vllm-vs-ollama-decision.md
    # §"Lean 16 GB bench".
    # Default bumped v0.6.6 → v0.11.0: v0.6.6 lacks Qwen3 (Transformers
    # KeyError:'qwen3') and sm_120/Blackwell kernels. v0.11.0 supports
    # Qwen3+AWQ, sm_89 (Ada) and sm_120 (Blackwell). Pinned + overridable.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    profiles: [vllm]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    ipc: host
    # vLLM's official CUDA image defaults to root and expects its cache under
    # root's home. Earlier non-root UID overrides failed on current images
    # because PyTorch/vLLM expects a passwd entry for that uid. Keep this
    # profile loopback-bound and benchmark-only; use a dedicated non-root image
    # if this overlay ever graduates beyond performance comparison.
    # Loopback-bind only — same security posture as the ollama service
    # (127.0.0.1:${host_port}:${container_port}).
    ports:
      - "127.0.0.1:${VLLM_HOST_PORT:-8080}:8080"
    # vLLM OpenAI-compatible server args:
    #   --model          HuggingFace model ID (AWQ variant for 16 GB fit)
    #   --dtype          auto — vLLM selects best dtype for the quant format
    #   --host           bind inside the container; host exposure stays loopback-only
    #   --port           bind to 8080 inside the container
    #   --max-model-len  token context window; 8192 matches the default smart
    #                    alias context budget used by the benchmark harness
    #   --gpu-memory-utilization  cap at 0.75 to leave room for the embedder
    #                    (~2.4 GB) + OS overhead on the 16 GB box.
    #                    Adjust up to 0.90 on a 48 GB box where all models
    #                    fit simultaneously without VRAM pressure.
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}"
      - "--dtype"
      - "auto"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.75}"
    volumes:
      # Persist downloaded model weights across container restarts.
      # Reuses the same cache convention as the hf_cache volume in
      # paper_ingestion (Marker/Surya models).
      # The official image's default user writes under /root.
      - vllm_model_cache:/root/.cache/huggingface
    environment:
      # HuggingFace cache: persist model weights across benchmark containers.
      HF_HOME: /root/.cache/huggingface
      # Suppress HF token warning — model is public, no token needed.
      TRANSFORMERS_OFFLINE: "0"
    # docker-compose.gpu.yml is the canonical GPU overlay for the DEFAULT
    # services (ollama, paper_ingestion) — base docker-compose.yml is CPU-safe.
    # vllm keeps its own reservation here because it is GPU-only and
    # profile-guarded (profiles: [vllm]); it never starts on a CPU-only host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: ${VLLM_MEM_LIMIT:-32g}
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" 2>/dev/null || exit 1"
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

volumes:
  vllm_model_cache:
