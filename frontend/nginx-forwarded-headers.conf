# Client-facing forwarding facts, rebuilt from the listener boundary instead of
# copied from browser input. Every proxying location includes this file, so a
# route added later cannot silently relay the browser's own X-Forwarded-For or
# CF-Connecting-IP to a backend.
#
# `Host` is deliberately absent. Most locations forward $http_host, while the
# authorization subrequest pins Host to the Platform service name; nginx emits
# every proxy_set_header directive it is given rather than letting a later one
# replace an earlier one, so a Host line here would be sent alongside the
# per-location value instead of superseding it.
proxy_set_header X-Real-IP $jarvis_client_ip;
proxy_set_header X-Forwarded-For $jarvis_client_ip;
proxy_set_header X-Forwarded-Proto $jarvis_forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Forwarded "";
proxy_set_header CF-Connecting-IP $jarvis_cf_connecting_ip;
proxy_set_header X-Jarvis-CF-Ingress $jarvis_cf_ingress;
