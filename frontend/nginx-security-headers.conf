# Security headers included by all location blocks
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS is intentionally absent here: this nginx listener is plain-HTTP (inner
# Docker hop). Emitting HSTS from an HTTP listener is incorrect — browsers
# would record the policy but the connection is unencrypted. HSTS is set at
# the TLS terminator (Caddy) instead.
# 'unsafe-inline' for style-src is required by Tailwind CSS + Shadcn/ui which
# inject styles at runtime. See docs/known-residual-risks.md (CSP style-src rationale) for details.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:; font-src 'self' data:; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
