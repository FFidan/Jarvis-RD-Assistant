# Capture the main request binding before nginx starts the authorization
# subrequest. The Platform assertion and destination middleware both require
# this exact method, normalized path, audience, and request ID.
set $jarvis_original_method $request_method;
set $jarvis_original_path $uri;

auth_request /internal/platform-authorize;
auth_request_set $jarvis_identity $upstream_http_x_jarvis_identity;
auth_request_set $jarvis_auth_cookie_1 $upstream_http_x_jarvis_set_cookie_1;
auth_request_set $jarvis_auth_cookie_2 $upstream_http_x_jarvis_set_cookie_2;
auth_request_set $jarvis_auth_cookie_3 $upstream_http_x_jarvis_set_cookie_3;
auth_request_set $jarvis_auth_cookie_4 $upstream_http_x_jarvis_set_cookie_4;

include /etc/nginx/nginx-identity-strip.conf;
proxy_set_header X-Jarvis-Identity $jarvis_identity;
proxy_set_header X-Request-Id $request_id;

# Domain services receive identity through the signed assertion, never by
# reopening the Platform session cookie. They also cannot mint or renew a
# browser cookie on their response path.
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;

# nginx exposes only one value for a repeated auth-subrequest response header.
# Platform therefore bounds and numbers renewal cookies; empty variables do not
# create response headers.
add_header Set-Cookie $jarvis_auth_cookie_1 always;
add_header Set-Cookie $jarvis_auth_cookie_2 always;
add_header Set-Cookie $jarvis_auth_cookie_3 always;
add_header Set-Cookie $jarvis_auth_cookie_4 always;
