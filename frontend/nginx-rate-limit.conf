# Rate limit zone for /api/* requests, 120/min per source IP. Lives in the
# http{} context — must be COPY'd to /etc/nginx/conf.d/ at build time.
# Burst tuning happens per-location in the main nginx.conf.
#
# Rate derivation (RB-A):
#   Largest single-surface fan-out: AnalyticsPage fires 7 parallel useQuery
#   calls on mount (activity, retention, reviews, llm-cost, summary, source,
#   status).  Add HeaderPill poll + two health polls = ~10 req per navigation.
#   120r/m (2 r/s) sustains that cadence without queuing; burst=40 absorbs the
#   simultaneous mount spike (7 requests land in <50 ms) for up to 2-3 concurrent
#   users before the token bucket refills.  The old 30r/m / burst=10 exhausted on
#   the first Analytics page load; burst=20 exhausted under 2+ concurrent users.
#   Apply burst=40 in each limit_req directive in nginx.conf (burst tuning is
#   per-location; this zone file only defines the rate and shared memory).
# F-01 (multi-user 503 risk): burst raised 20→40 to absorb 2-3 concurrent users
# each hitting a heavy page simultaneously (~10 req/navigation × 3 users = 30 req
# in <50 ms).  Per-client bucketing relies on $binary_remote_addr resolving to the
# real client IP; this requires NGINX_TRUSTED_PROXY_CIDR in the container env to
# match the actual Docker bridge subnet (default 172.16.0.0/12 covers Docker's
# default range but may be too broad if the bridge uses a narrower /24).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

# RB-4 regression sentinel: log both the resolved client IP ($remote_addr, used
# for rate-limit bucketing) and the raw connecting IP ($realip_remote_addr,
# i.e. Caddy's bridge address) on every request.  If real_ip_header X-Real-IP
# is working, $remote_addr will vary per browser/device; if IP collapse
# regresses, all lines will show the same $remote_addr (the bridge IP) and
# $realip_remote_addr == $remote_addr.  Reference this format in the server{}
# block with: access_log /var/log/nginx/access.log real_ip;
log_format real_ip '$remote_addr [via $realip_remote_addr] - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';
