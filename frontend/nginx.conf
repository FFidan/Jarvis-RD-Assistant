# Preserve the scheme set by the outermost TLS terminator. Caddy (both the
# local-https and letsencrypt profiles) terminates TLS and sets
# X-Forwarded-Proto, then forwards plaintext to this nginx hop. Using bare
# $scheme here would clobber that with "http" (the Caddy→nginx hop), making
# the backend believe it serves plain HTTP even in production. Trust the
# incoming X-Forwarded-Proto; fall back to this hop's own $scheme only when
# nginx is reached directly (no outer proxy) so we never report a false https.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Reject requests with unknown/missing Host header — hardens against
# HTTP host-header injection and misconfigured upstream probes.
server {
    listen 3000 default_server;
    server_name _;
    return 444;
}

server {
    listen 3000;
    # localhost/127.0.0.1 cover the Caddy-fronted profiles (Caddy rewrites
    # Host->localhost) and direct loopback. DASHBOARD_SERVER_NAME (envsubst'd at
    # container start) adds extra accepted Host headers for direct remote access
    # (e.g. a Tailscale MagicDNS name or LAN hostname); empty by default so the
    # allowlist stays localhost-only. Without a matching name nginx returns 444.
    server_name localhost 127.0.0.1 ${DASHBOARD_SERVER_NAME};
    server_tokens off;

    # --- Real IP: trust only the pinned Caddy static IPs ---
    # Caddy terminates TLS and stamps X-Real-IP = connecting client address.
    # Trust is limited to the two static IPs assigned to the Caddy containers
    # on the jarvis bridge (10.137.241.0/24, subnet pinned in docker-compose.yml):
    #   10.137.241.2 — caddy (letsencrypt profile)
    #   10.137.241.3 — caddy_local (caddy-local profile, never co-runs with .2)
    # 127.0.0.1 covers the no-Caddy bootstrap path (host:3001→dashboard:3000
    # directly) where $remote_addr is already authoritative — no regression.
    # The prior broad-CIDR (172.16.0.0/12) covering all Docker bridge nets is
    # removed; a sibling container can no longer forge X-Real-IP.
    # Override JARVIS_NET_SUBNET in .env if the 10.137.241.0/24 subnet conflicts.
    set_real_ip_from 10.137.241.2/32;
    set_real_ip_from 10.137.241.3/32;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    # Use the real_ip log format (defined in nginx-rate-limit.conf) so every
    # access log line exposes both the resolved client IP and the Caddy bridge
    # IP side-by-side.  A regression where all requests show the same
    # $remote_addr (== Caddy bridge) is immediately visible in the logs.
    access_log /var/log/nginx/access.log real_ip;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers (also included explicitly in each location block to prevent
    # nginx's inheritance-override behaviour from silently dropping them)
    include /etc/nginx/nginx-security-headers.conf;

    # -------------------------------------------------------------------------
    # SECURITY: nginx does NOT inject X-API-Key. The browser must send it.
    # This prevents unauthenticated access via the proxy.
    # -------------------------------------------------------------------------

    # Learning Engine (port 8001) — matched by regex first
    location ~ ^/api/(decks|cards|review|stats|generate|export|executive) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/(projects|tasks|milestones) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/analytics/(activity|retention|reviews|llm-cost|summary) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check routes for each backend service (no auth needed)
    location = /health/paper_ingestion {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_connect_timeout 10s;
    }

    location = /health/paper_ingestion/live {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine/live {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_connect_timeout 10s;
    }

    # Authenticated internal health details (includes per-dependency breakdown)
    location = /health/paper_ingestion/internal {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000/health/internal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine/internal {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001/health/internal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_connect_timeout 10s;
    }

    # Dedicated SSE location for job streams — extended timeout + no buffering
    # IMPORTANT: Both paper_ingestion and learning_engine share the same jobs table
    # and have identical /api/jobs/{id}/stream endpoints. Jobs created by either
    # service can be streamed through either backend. This single location block
    # handles all job kinds (pulse.*, paper.*, card.generate, etc.).
    location ~ ^/api/jobs/[^/]+/stream$ {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }

    # Tighter rate limit for PDF upload endpoint (burst=2 prevents bulk upload abuse)
    location = /api/papers/upload {
        limit_req zone=api_zone burst=2 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        client_max_body_size 50m;
    }

    # Paper Ingestion (port 8000) — catch-all for /api/
    location /api/ {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Strip any browser-supplied owner-override header: only the container
        # bridge bot (which does NOT traverse nginx) may set X-Owner-User-Id.
        proxy_set_header X-Owner-User-Id "";

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_set_header Connection '';
    }

    # Suppress access logging for the onboarding setup route so the one-time
    # setup token (?token=…) never appears in nginx access logs.
    location ~* ^/setup {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # preboot.js must never be cached — it reads localStorage before React hydrates
    location = /preboot.js {
        # include must precede per-route add_header directives; nginx's add_header
        # inheritance rule drops all parent headers when ANY add_header appears in a
        # child location block — without this include, CSP/X-Frame-Options/etc. are
        # stripped from /preboot.js responses. Verify: curl -I http://localhost:8080/preboot.js | grep -i content-security
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }

    # Serve the PWA manifest with the correct MIME type. The base image's
    # mime.types has no .webmanifest mapping (→ octet-stream, which strict
    # browsers reject for manifest registration). Short cache, not the 1-year
    # immutable asset cache below — manifest changes must be picked up.
    location = /manifest.webmanifest {
        include /etc/nginx/nginx-security-headers.conf;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The app is an auth-walled SPA with no public sitemap (the gh-pages docs
    # site owns SEO). Return 404 instead of the SPA index.html fallback.
    location = /sitemap.xml {
        include /etc/nginx/nginx-security-headers.conf;
        return 404;
    }

    # Vite emits ESM worker chunks with a .mjs extension. Serve them with an
    # explicit JavaScript MIME type; the generic static location below may fall
    # back to octet-stream on minimal nginx images. Set Cache-Control directly:
    # nginx's expires directive would overwrite the intended immutable policy.
    location ~* \.mjs$ {
        include /etc/nginx/nginx-security-headers.conf;
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nginx-security-headers.conf;
    }
}
