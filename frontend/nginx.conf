# Reject requests with unknown/missing Host header — hardens against
# HTTP host-header injection and misconfigured upstream probes.
server {
    listen 3000 default_server;
    server_name _;
    return 444;
}

server {
    listen 3000;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # --- Real IP: trust Docker bridge subnet so rate-limiting uses client IP ---
    # Scoped to the actual Docker bridge CIDR (172.19.0.0/16) rather than the
    # entire RFC-1918 10.0.0.0/8 range. To find your network:
    #   docker network inspect jarvis_rd_assistant_jarvis --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
    set_real_ip_from 172.19.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers (also included explicitly in each location block to prevent
    # nginx's inheritance-override behaviour from silently dropping them)
    include /etc/nginx/nginx-security-headers.conf;

    # -------------------------------------------------------------------------
    # SECURITY: nginx does NOT inject X-API-Key. The browser must send it.
    # This prevents unauthenticated access via the proxy.
    # -------------------------------------------------------------------------

    # Learning Engine (port 8001) — matched by regex first
    location ~ ^/api/(decks|cards|review|stats|generate|export|executive) {
        limit_req zone=api_zone burst=10 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/(projects|tasks|milestones) {
        limit_req zone=api_zone burst=10 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/analytics/(activity|retention|reviews|llm-cost) {
        limit_req zone=api_zone burst=10 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check routes for each backend service (no auth needed)
    location = /health/paper_ingestion {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # Dedicated SSE location for job streams — extended timeout + no buffering
    # IMPORTANT: Both paper_ingestion and learning_engine share the same jobs table
    # and have identical /api/jobs/{id}/stream endpoints. Jobs created by either
    # service can be streamed through either backend. This single location block
    # handles all job kinds (pulse.*, paper.*, card.generate, etc.).
    location ~ ^/api/jobs/[^/]+/stream$ {
        limit_req zone=api_zone burst=10 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }

    # Tighter rate limit for PDF upload endpoint (burst=2 prevents bulk upload abuse)
    location = /api/papers/upload {
        limit_req zone=api_zone burst=2 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        client_max_body_size 50m;
    }

    # Paper Ingestion (port 8000) — catch-all for /api/
    location /api/ {
        limit_req zone=api_zone burst=10 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_set_header Connection '';
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # preboot.js must never be cached — it reads localStorage before React hydrates
    location = /preboot.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nginx-security-headers.conf;
    }
}
