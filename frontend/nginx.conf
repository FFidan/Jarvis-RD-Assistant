server {
    listen 3000 ssl;
    server_name _;
    server_tokens off;

    # --- TLS (self-signed certs generated on first boot) ---
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # --- Real IP: trust Docker/LAN ranges so rate-limiting uses client IP ---
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers (also included explicitly in each location block to prevent
    # nginx's inheritance-override behaviour from silently dropping them)
    include /etc/nginx/nginx-security-headers.conf;

    # -------------------------------------------------------------------------
    # SECURITY: nginx does NOT inject X-API-Key. The browser must send it.
    # This prevents unauthenticated access via the proxy.
    # -------------------------------------------------------------------------

    # Learning Engine (port 8001) — matched by regex first
    location ~ ^/api/(decks|cards|review|stats|generate|export|executive) {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/(projects|tasks|milestones) {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/analytics/(activity|retention|reviews|llm-cost) {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check routes for each backend service (no auth needed)
    location = /health/paper_ingestion {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://learning_engine:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }

    # Dedicated SSE location for job streams — extended timeout + no buffering
    # IMPORTANT: Both paper_ingestion and learning_engine share the same jobs table
    # and have identical /api/jobs/{id}/stream endpoints. Jobs created by either
    # service can be streamed through either backend. This single location block
    # handles all job kinds (pulse.*, paper.*, card.generate, etc.).
    location ~ ^/api/jobs/[^/]+/stream$ {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }

    # Paper Ingestion (port 8000) — catch-all for /api/
    location /api/ {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://paper_ingestion:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_set_header Connection '';
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nginx-security-headers.conf;
    }
}
