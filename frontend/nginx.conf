# Port 3000 is the raw diagnostics/local listener. Port 3002 is reachable only
# through pinned TLS edges or the host-loopback Tailscale mapping. The scheme
# and forwarded client are derived from that listener boundary, never from a
# browser-supplied forwarding header.
map $server_port $jarvis_forwarded_proto {
    3002 https;
    default http;
}

map $server_port $jarvis_client_ip {
    3002 $remote_addr;
    default $realip_remote_addr;
}

map "$server_port:$realip_remote_addr" $jarvis_trusted_ingress_allowed {
    ~^3000: 1;
    "3002:${JARVIS_NET_GATEWAY_IP}" 1;
    "3002:${JARVIS_CADDY_IP}" 1;
    "3002:${JARVIS_CADDY_LOCAL_IP}" 1;
    "3002:${JARVIS_CLOUDFLARED_IP}" 1;
    default 0;
}

# Preserve Cloudflare's client header only when the original TCP peer is the
# pinned cloudflared container on the trusted listener. Every other ingress
# receives an empty CF header and an explicit untrusted marker.
map "$server_port:$realip_remote_addr" $jarvis_cf_ingress {
    "3002:${JARVIS_CLOUDFLARED_IP}" 1;
    default 0;
}

map $jarvis_cf_ingress $jarvis_cf_connecting_ip {
    1 $http_cf_connecting_ip;
    default "";
}

# Raw-IP HTTP is a health-check surface, not an application origin. Docker's
# gateway represents the host side of a published port, but Desktop/VM
# forwarding can also collapse a remote LAN peer to that same address. Allow
# the gateway to reach the app only when the host publication itself is bound
# to loopback. DASHBOARD_BIND_HOST is the same Compose value that publishes the
# port, so this check cannot drift behind a second operator-managed switch.
map "$server_port:$realip_remote_addr:${DASHBOARD_BIND_HOST}" $jarvis_full_app_allowed {
    ~^3002: 1;
    ~^3000:127\. 1;
    "3000:${JARVIS_NET_GATEWAY_IP}:127.0.0.1" 1;
    default 0;
}

map "$server_port:$uri" $jarvis_diagnostic_allowed {
    "3000:/health/jarvis" 1;
    default 0;
}

map "$jarvis_full_app_allowed:$jarvis_diagnostic_allowed" $jarvis_request_allowed {
    ~^1: 1;
    "0:1" 1;
    default 0;
}

# Protected routes perform one Platform authorization subrequest. Reuse those
# short HTTP connections so request-bound identity does not add a TCP handshake
# to every backend call.
upstream jarvis_platform_authorize {
    server platform_api:8003;
    keepalive 32;
}

upstream jarvis_research {
    server paper_ingestion:8000;
    keepalive 32;
}

upstream jarvis_learning {
    server learning_engine:8001;
    keepalive 32;
}

# Reject requests with unknown/missing Host header — hardens against
# HTTP host-header injection and misconfigured upstream probes.
server {
    listen 3000 default_server;
    listen 3002 default_server;
    server_name _;
    return 444;
}

server {
    listen 3000;
    listen 3002;
    # localhost/127.0.0.1 cover direct loopback and both Caddy profiles. Public
    # Caddy rewrites Host to localhost; local Caddy preserves Host and port.
    # DASHBOARD_SERVER_NAME (envsubst'd at
    # container start) adds extra accepted Host headers for direct remote access
    # (e.g. a Tailscale MagicDNS name or LAN hostname); empty by default so the
    # allowlist stays localhost-only. Without a matching name nginx returns 444.
    server_name localhost 127.0.0.1 ${DASHBOARD_SERVER_NAME};
    server_tokens off;

    # Only the host gateway and pinned TLS edges may supply the client chain on
    # port 3002. Port 3000 still uses $realip_remote_addr below, so forged
    # forwarding headers on the raw LAN route never reach a backend.
    set_real_ip_from ${JARVIS_NET_GATEWAY_IP}/32;
    set_real_ip_from ${JARVIS_CADDY_IP}/32;
    set_real_ip_from ${JARVIS_CADDY_LOCAL_IP}/32;
    set_real_ip_from ${JARVIS_CLOUDFLARED_IP}/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($jarvis_trusted_ingress_allowed = 0) { return 444; }
    if ($jarvis_request_allowed = 0) { return 403; }

    # Use the real_ip log format (defined in nginx-rate-limit.conf) so every
    # access log line exposes both the resolved client IP and the Caddy bridge
    # IP side-by-side.  A regression where all requests show the same
    # $remote_addr (== Caddy bridge) is immediately visible in the logs.
    access_log /var/log/nginx/access.log real_ip;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers (also included explicitly in each location block to prevent
    # nginx's inheritance-override behaviour from silently dropping them)
    include /etc/nginx/nginx-security-headers.conf;

    # Stable identity marker for setup/readiness probes. A generic 2xx or SPA
    # page is not enough to prove a hostname reaches this JARVIS instance.
    location = /health/jarvis {
        default_type text/plain;
        return 200 "jarvis-rd-assistant\n";
    }

    # -------------------------------------------------------------------------
    # SECURITY: nginx does NOT inject X-API-Key. The browser must send it.
    # This prevents unauthenticated access via the proxy.
    # -------------------------------------------------------------------------

    # Platform authorization subrequest. External requests cannot reach this
    # location; the raw transport peer seen by Platform is the nginx container.
    location = /internal/platform-authorize {
        internal;
        proxy_pass http://jarvis_platform_authorize/internal/authorize;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_set_header Host platform_api;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_set_header X-Jarvis-Target-Audience $jarvis_target_audience;
        proxy_set_header X-Jarvis-Original-Method $jarvis_original_method;
        proxy_set_header X-Jarvis-Original-Path $jarvis_original_path;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Cookie $http_cookie;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # Platform-owned public API surfaces keep their existing URLs. These routes
    # validate or mint identity themselves, so they do not recurse through the
    # backend authorization subrequest.
        location ~ ^/api/(auth|setup|admin|telegram|account|config|logs|providers)(/|$) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://platform_api:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_set_header X-Request-Id $request_id;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Platform combines owner-local setup readiness without exposing the
    # Research aggregation endpoint as the browser contract.
    location = /api/system/setup-status {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://platform_api:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_set_header X-Request-Id $request_id;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Learning Engine (port 8001) — matched by regex first
    location ~ ^/api/(decks|cards|review|stats|generate|export|executive) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        set $jarvis_target_audience learning;
        include /etc/nginx/nginx-backend-auth.conf;
        proxy_pass http://jarvis_learning;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/(projects|tasks|milestones) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        set $jarvis_target_audience learning;
        include /etc/nginx/nginx-backend-auth.conf;
        proxy_pass http://jarvis_learning;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/api/analytics/(activity|retention|reviews|llm-cost|summary) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        set $jarvis_target_audience learning;
        include /etc/nginx/nginx-backend-auth.conf;
        proxy_pass http://jarvis_learning;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check routes for each backend service (no auth needed)
    location = /health/paper_ingestion {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://jarvis_research/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://jarvis_learning/health;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 10s;
    }

    location = /health/paper_ingestion/live {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://jarvis_research/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine/live {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://jarvis_learning/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 10s;
    }

    # Authenticated internal health details (includes per-dependency breakdown)
    location = /health/paper_ingestion/internal {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://jarvis_research/health/internal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 10s;
    }

    location = /health/learning_engine/internal {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://jarvis_learning/health/internal;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        proxy_connect_timeout 10s;
    }

    # Platform owns the unified public jobs facade. Its SSE endpoint keeps the
    # historical no-buffering and long-timeout transport contract.
    location ~ ^/api/jobs/[^/]+/stream$ {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://platform_api:8003;
        proxy_read_timeout 800s;
        proxy_send_timeout 800s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_set_header X-Request-Id $request_id;
        include /etc/nginx/nginx-identity-strip.conf;
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }

    location ~ ^/api/jobs(?:/|$) {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://platform_api:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_set_header X-Request-Id $request_id;
        include /etc/nginx/nginx-identity-strip.conf;
    }

    # Tighter rate limit for PDF upload endpoint (burst=2 prevents bulk upload abuse)
    location = /api/papers/upload {
        limit_req zone=api_zone burst=2 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        set $jarvis_target_audience research;
        include /etc/nginx/nginx-backend-auth.conf;
        proxy_pass http://jarvis_research;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        client_max_body_size 50m;
    }

    # Paper Ingestion (port 8000) — catch-all for /api/
    location /api/ {
        limit_req zone=api_zone burst=80 nodelay;
        include /etc/nginx/nginx-security-headers.conf;
        set $jarvis_target_audience research;
        include /etc/nginx/nginx-backend-auth.conf;
        proxy_pass http://jarvis_research;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;

        # SSE streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_set_header Connection '';
    }

    # Off-host disaster-recovery upload goes STRAIGHT to the dedicated uploader:
    # the encrypted archive bytes + operator key never transit the app. `^~` wins
    # over the static-asset regex locations so an archive suffix added there can
    # never hijack an upload. No auth here by design — the uploader enforces the
    # one-time grant itself.
    location ^~ /restore-upload/ {
        include /etc/nginx/nginx-security-headers.conf;
        proxy_pass http://restore-uploader:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        include /etc/nginx/nginx-forwarded-headers.conf;
        include /etc/nginx/nginx-identity-strip.conf;
        # Multi-GB archive streams: no nginx-side cap or buffering — the uploader
        # enforces UPLOAD_MAX_GB itself (mirrors the Caddy profiles' raised cap).
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # Setup tokens live in the URL fragment, which browsers do not send to
    # nginx. Keep access logging disabled here as defense in depth.
    location ~* ^/setup {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    # React SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # preboot.js must never be cached — it reads localStorage before React hydrates
    location = /preboot.js {
        # include must precede per-route add_header directives; nginx's add_header
        # inheritance rule drops all parent headers when ANY add_header appears in a
        # child location block — without this include, CSP/X-Frame-Options/etc. are
        # stripped from /preboot.js responses. Verify: curl -I http://localhost:8080/preboot.js | grep -i content-security
        include /etc/nginx/nginx-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }

    # Serve the PWA manifest with the correct MIME type. The base image's
    # mime.types has no .webmanifest mapping (→ octet-stream, which strict
    # browsers reject for manifest registration). Short cache, not the 1-year
    # immutable asset cache below — manifest changes must be picked up.
    location = /manifest.webmanifest {
        include /etc/nginx/nginx-security-headers.conf;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # The app is an auth-walled SPA with no public sitemap (the gh-pages docs
    # site owns SEO). Return 404 instead of the SPA index.html fallback.
    location = /sitemap.xml {
        include /etc/nginx/nginx-security-headers.conf;
        return 404;
    }

    # Vite emits ESM worker chunks with a .mjs extension. Serve them with an
    # explicit JavaScript MIME type; the generic static location below may fall
    # back to octet-stream on minimal nginx images. Set Cache-Control directly:
    # nginx's expires directive would overwrite the intended immutable policy.
    location ~* \.mjs$ {
        include /etc/nginx/nginx-security-headers.conf;
        default_type application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nginx-security-headers.conf;
    }
}
