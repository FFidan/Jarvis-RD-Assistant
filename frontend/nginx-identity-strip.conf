# Remove every browser-controlled identity header before proxying. Platform
# creates the only accepted assertion; backend middleware rejects the legacy
# fields as defense in depth.
proxy_set_header X-Jarvis-Identity "";
proxy_set_header X-Jarvis-Principal "";
proxy_set_header X-Jarvis-Scopes "";
proxy_set_header X-Jarvis-Session-Id "";
proxy_set_header X-Jarvis-User-Id "";
proxy_set_header X-Jarvis-User-Role "";
proxy_set_header X-Owner-User-Id "";
