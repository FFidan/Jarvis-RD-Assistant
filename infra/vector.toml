data_dir = "/var/lib/vector"

[api]
enabled = false

# --- Sources ---

[sources.docker_logs]
type = "docker_logs"
# Whitelist: only tail containers from this compose project. Without this,
# Vector tails EVERY container on the docker daemon, including sibling
# projects (e.g. deploy-*, claude-ollama, codeboarding-*) — 50%+ of recent
# system_events volume came from those before this filter was added.
include_containers = [
  "jarvis_rd_assistant-",  # prefix match: every service from this compose project
  "jarvis_caddy_local",    # reverse proxy (separate container name)
]
exclude_containers = [
  "jarvis_vector",         # don't tail ourselves
]

# --- Transforms ---

# Generic level inference for unstructured stdout
[transforms.infer_level]
type = "remap"
inputs = ["docker_logs"]
source = '''
upper_msg = upcase!(.message)
if contains(upper_msg, "ERROR") || contains(upper_msg, "FATAL") || contains(upper_msg, "PANIC") {
  .level = "error"
} else if contains(upper_msg, "WARN") {
  .level = "warning"
} else {
  .level = "info"
}
.category = "infra"
.source = .container_name
'''

# Drop-filter rules for known noisy lines
[transforms.drop_noise]
type = "filter"
inputs = ["infer_level"]
condition = '''
msg = to_string(.message) ?? ""
cn = to_string(.container_name) ?? ""
# Skip nginx access logs with status < 400
if cn == "jarvis_dashboard" && match(msg, r'" (1\d\d|2\d\d|3\d\d) ') {
  return false
}
# Skip Postgres routine info (LOG: but not WARNING/ERROR)
if cn == "jarvis_postgres" && starts_with(msg, "LOG:  ") && !contains(msg, "ERROR") {
  return false
}
# Skip Qdrant info-level chatter
if cn == "jarvis_qdrant" && contains(msg, "INFO ") && !contains(msg, "ERROR") {
  return false
}
# Skip Ollama per-request
if cn == "jarvis_ollama" && contains(msg, " GET ") {
  return false
}
true
'''

# Truncate message and reshape fields before shipping
# Vector 0.40.0-alpine has no native `postgres` sink — only `postgresql_metrics`
# (a metrics source) and `http`. We use the `http` sink to POST batches to
# paper_ingestion's /infra-events endpoint, which bulk-inserts into system_events.
[transforms.truncate_message]
type = "remap"
inputs = ["drop_noise"]
source = '''
.message = slice!(.message, 0, 4096)
.category = "infra"
.source = .container_name
.context = {
  "container_id": .container_id,
  "image": .image,
  "stream": .stream,
}
# Strip Vector-internal fields the endpoint doesn't need
del(.timestamp)
del(.container_created_at)
del(.container_id)
del(.image)
del(.stream)
del(.label)
del(.host)
'''

# --- Sink: HTTP → paper_ingestion /infra-events ---

[sinks.http]
type = "http"
inputs = ["truncate_message"]
uri = "http://paper_ingestion:8000/infra-events"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
request.headers.X-Infra-Key = "${INFRA_KEY}"
batch.max_events = 100
batch.timeout_secs = 5

# Buffer & retries — Vector 0.40 disk buffer requires max_size ≥ 268435488 (~256MB)
[sinks.http.buffer]
type = "disk"
max_size = 268435488
when_full = "drop_newest"
