# =============================================================================
# JARVIS RD Assistant - Docker Compose
# =============================================================================
# Self-hosted research-assistant stack.
# Usage:
#   cp .env.example .env   # edit with your values
#   docker compose up -d
# =============================================================================

x-shared-env: &shared-env
  # Release version surfaced by /health/internal + FastAPI metadata + the UI.
  # The service images don't install the root distribution, so app_version()
  # reads this env; defaults to the release tag (same var drives the image tags).
  JARVIS_VERSION: ${JARVIS_VERSION:-1.1.2}
  # DATABASE_URL is NOT set here — each service's entrypoint.sh reads
  # /run/secrets/postgres_password and constructs it at container start.
  LITELLM_BASE_URL: http://litellm:4000
  # Setup-chosen model defaults; the boot reconciler falls back to these when
  # no Settings choice is stored (empty when absent from .env).
  JARVIS_SMART_MODEL: ${JARVIS_SMART_MODEL:-}
  JARVIS_FAST_MODEL: ${JARVIS_FAST_MODEL:-}
  JARVIS_HOST_VRAM_MB: ${JARVIS_HOST_VRAM_MB:-}
  # GPU vendor detected by setup.sh (nvidia | amd | intel | none). The
  # in-container probe is nvidia-only, so services trust this for status.
  JARVIS_GPU_VENDOR: ${JARVIS_GPU_VENDOR:-}
  # master_key for LiteLLM admin endpoints is mounted as a Docker Secret
  # (_FILE convention) at /run/secrets/litellm_master_key.  Each service that
  # calls LiteLLM declares ``- litellm_master_key`` under its ``secrets:`` list.
  LITELLM_MASTER_KEY_FILE: /run/secrets/litellm_master_key
  QDRANT_URL: http://qdrant:6333
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embed}
  # Context window the app budgets prompt input against — keep in sync with
  # the ``smart`` num_ctx in litellm/config.yaml when changing either value.
  LLM_SMART_NUM_CTX: ${LLM_SMART_NUM_CTX:-8192}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-2560}
  # JARVIS_API_KEY is injected via Docker Secret (_FILE convention) only — no
  # plaintext env var fallback so ``docker inspect`` cannot leak the key.
  JARVIS_API_KEY_FILE: /run/secrets/jarvis_api_key
  # JARVIS_MODEL_HMAC_KEY signs Pulse classifier pickle blobs; injected via
  # Docker Secret (_FILE convention) only, mandatory in production.
  JARVIS_MODEL_HMAC_KEY_FILE: /run/secrets/jarvis_model_hmac_key
  DEV_MODE: ${DEV_MODE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
  # Canonical public app URL and access mode, both written by setup.sh. APP_BASE_URL
  # is the one server-known origin magic-link emails and passkey ceremonies use;
  # empty for local/LAN installs where the origin is implicit.
  APP_BASE_URL: ${APP_BASE_URL:-}
  JARVIS_ACCESS_MODE: ${JARVIS_ACCESS_MODE:-localhost}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DB_POOL_MIN: ${DB_POOL_MIN:-2}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  PULSE_STAGE2_MODEL: ${PULSE_STAGE2_MODEL:-smart}
  PULSE_STAGE2_MAX_RETRIES: ${PULSE_STAGE2_MAX_RETRIES:-1}
  JARVIS_TRUST_CF_CONNECTING_IP: ${JARVIS_TRUST_CF_CONNECTING_IP:-false}
  # Source CIDRs allowed to use the X-Owner-User-Id override (the Telegram bot's
  # per-user service calls). MUST include the jarvis bridge subnet so the bot is
  # trusted; defaults track JARVIS_NET_SUBNET. If you override JARVIS_NET_SUBNET,
  # this follows it. Loopback covers same-host calls.
  OWNER_OVERRIDE_ALLOWED_CIDRS: ${OWNER_OVERRIDE_ALLOWED_CIDRS:-127.0.0.0/8,${JARVIS_NET_SUBNET:-10.137.241.0/24}}
  # Source CIDRs trusted as reverse-proxy hops when extracting the real client IP
  # from X-Forwarded-For (rate-limit keying). Trusts loopback + the jarvis bridge
  # subnet so the nginx hop is honoured; tracks JARVIS_NET_SUBNET. Empty in code
  # falls back to loopback-only so a bridge container cannot spoof X-Forwarded-For.
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,${JARVIS_NET_SUBNET:-10.137.241.0/24}}
  # Numeric CIDRs uvicorn's ProxyHeadersMiddleware trusts as the immediate proxy
  # hop before rewriting scope["client"] from X-Forwarded-For. Distinct from
  # TRUSTED_PROXY_CIDRS above (rate-limit keying) — this one drives the client
  # rewrite the X-Owner-User-Id guard depends on to reject nginx-relayed browser
  # requests. MUST include the bridge subnet so the nginx hop is trusted; tracks
  # JARVIS_NET_SUBNET.
  TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-127.0.0.0/8,${JARVIS_NET_SUBNET:-10.137.241.0/24}}
  TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-http://telegram_bot:8002}
  OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/langfuse_init_pk
  LANGFUSE_SECRET_KEY_FILE: /run/secrets/langfuse_init_sk

services:
  # ==========================================================================
  # INFRASTRUCTURE
  # ==========================================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.31.2}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 20g
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    # Base compose is CPU-safe — no GPU device reservation here so CPU-only hosts
    # can `docker compose up`. setup.sh layers docker-compose.gpu.yml when the
    # Docker nvidia runtime is present to re-enable the GPU reservation.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/11434 && printf 'GET /api/version HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  ollama-bootstrap:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.31.2}
    security_opt: ["no-new-privileges:true"]
    # Pull-only task — no capabilities required.
    cap_drop: [ALL]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Default fits a single 16 GB GPU with the embedder kept resident:
      # qwen3:8b (smart + smart-fallback), qwen3:4b (fast), qwen3-embedding:4b.
      # Larger-VRAM deployments can override OLLAMA_MODELS and switch the smart
      # role via the in-app model picker (Settings → llm.smart_model).
      OLLAMA_MODELS: ${OLLAMA_MODELS:-qwen3:8b,qwen3:4b,qwen3-embedding:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for model in $$(echo "$$OLLAMA_MODELS" | tr "," " "); do
          echo "Pulling $$model..."
          ollama pull "$$model" || { echo "FAILED: $$model"; exit 1; }
        done
        echo "All models ready."
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis
    pull_policy: missing

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    environment:
      # Qdrant reads the API key from this file path via its _FILE convention
      QDRANT__SERVICE__API_KEY_FILE: /run/secrets/qdrant_api_key
    secrets:
      - qdrant_api_key
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
      # Read-only view of the sidecar's decrypted-snapshot staging dir so the
      # one-click restore can recover a collection via file:// (it sits under
      # Qdrant's default /qdrant/snapshots dir).
      - restore_staging:/qdrant/snapshots/restore:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  # ==========================================================================
  # JARVIS ADDITIONS
  # ==========================================================================

  # Sole creator of the ``litellm`` database (fresh AND existing volumes) —
  # init.sql cannot CREATE DATABASE (test harness applies it via asyncpg in one
  # implicit transaction), prisma migrate does not create databases, and the
  # litellm image ships no psql/createdb (hence the postgres image).
  litellm-db-init:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    security_opt: ["no-new-privileges:true"]
    # No cap_drop: reading the 0600 host-owned secret file requires
    # CAP_DAC_OVERRIDE (same posture as the litellm service's secret shim).
    secrets:
      - postgres_password
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        export PGPASSWORD="$(cat /run/secrets/postgres_password)"
        psql -h postgres -U "${POSTGRES_USER:-jarvis}" -d "${POSTGRES_DB:-jarvis}" -v ON_ERROR_STOP=1 \
          -tc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1 \
          || createdb -h postgres -U "${POSTGRES_USER:-jarvis}" litellm
        echo "litellm database ready."
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:29252f25ed1b538d44f6b76ec97412c5537a180b39ede744b9f3e86ffdd278f5}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - backup_trigger:/backup-trigger:ro  # ro: the shim watches .secrets_rotated so an off-host restore's rotated litellm/postgres secrets are picked up by a self-restart
    # OPENAI_API_KEY and ANTHROPIC_API_KEY are intentionally omitted here.
    # Cloud-key injection happens via Fernet user_config + the LiteLLM admin DB
    # (/model/new payloads, encrypted at rest under LITELLM_SALT_KEY).
    # The startup env vars are dead and their presence would expose keys via
    # ``docker inspect``.
    environment:
      # DATABASE_URL deliberately absent — the shim builds it from
      # /run/secrets/postgres_password so the password never appears in
      # ``docker inspect``.
      STORE_MODEL_IN_DB: "true"
    secrets:
      - litellm_master_key
      - litellm_salt_key
      - postgres_password
    # litellm/config.yaml uses ``master_key: os.environ/LITELLM_MASTER_KEY`` and
    # the upstream image does not honour the ``_FILE`` convention.  This shim
    # reads the secret file into LITELLM_MASTER_KEY at container start and
    # refuses to start when the file is empty.  Both
    # ``entrypoint`` and ``command`` are overridden — the upstream image sets
    # entrypoint=["litellm"], so without overriding it our ``sh`` would be
    # passed as a positional arg to litellm.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -s /run/secrets/litellm_master_key ]; then
          echo 'FATAL: /run/secrets/litellm_master_key is empty or missing.' >&2
          exit 1
        fi
        export LITELLM_MASTER_KEY="$(cat /run/secrets/litellm_master_key)"
        # H-5: Reject known placeholder/weak values in production so a deploy
        # with an unchanged secrets/litellm_master_key.txt fails fast here
        # rather than silently running with a public default.
        if [ "$${ENVIRONMENT:-development}" = "production" ]; then
          case "$LITELLM_MASTER_KEY" in
            "sk-jarvis-dev-test"|changeme|secret|password|""|"sk-1234")
              echo 'FATAL: LITELLM_MASTER_KEY is a known placeholder value.' \
                   'Replace secrets/litellm_master_key.txt before deploying to production.' >&2
              exit 1 ;;
          esac
          if [ "$${#LITELLM_MASTER_KEY}" -lt 16 ]; then
            echo 'FATAL: LITELLM_MASTER_KEY is too short (< 16 chars) for production.' >&2
            exit 1
          fi
        fi
        if [ ! -s /run/secrets/litellm_salt_key ]; then
          echo 'FATAL: /run/secrets/litellm_salt_key is empty or missing.' >&2
          exit 1
        fi
        # Pinned salt key: litellm's fallback salt is the master key, so a
        # master-key rotation would brick DB-stored encrypted model credentials.
        # A dedicated, never-rotated salt decouples the two.
        export LITELLM_SALT_KEY="$(cat /run/secrets/litellm_salt_key)"
        # DATABASE_URL is built here because litellm has no _FILE convention
        # and a compose env entry would leak the password via ``docker inspect``.
        # RFC-3986 reserved chars (@ : / # ? & %) in the user or password would
        # silently corrupt a bare URL; percent-encode both parts via python3.
        PG_USER_ENC="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "${POSTGRES_USER:-jarvis}")"
        PG_PASS_ENC="$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$(cat /run/secrets/postgres_password)")"
        export DATABASE_URL="postgresql://$${PG_USER_ENC}:$${PG_PASS_ENC}@postgres:5432/litellm"
        # Defensive self-restart on off-host secrets rotation: an inbox restore
        # rebinds the postgres role and rotates the litellm master/salt secrets,
        # which this process reads once at start. A background watcher polls the
        # shared marker and, when it is newer than this boot, kills PID 1 (the
        # exec'd litellm below) so restart:unless-stopped revives it against the
        # rotated /run/secrets/* inodes. It never interferes with normal boot: it
        # backgrounds immediately and no-ops until a newer integer marker appears.
        LSTART=$(date +%s)
        ( while sleep 5; do
            m=$(cat /backup-trigger/.secrets_rotated 2>/dev/null || echo 0)
            case "$$m" in ''|*[!0-9]*) continue ;; esac
            [ "$$m" -gt "$$LSTART" ] && { echo '[litellm] secrets rotated; exiting to reload' >&2; kill 1; }
          done ) &
        exec litellm --config /app/config.yaml
    # Loopback binding (127.0.0.1:4000) is kept as defence-in-depth.
    mem_limit: 4g
    healthcheck:
      # /health/liveliness, NOT /health/readiness: with a configured DB,
      # readiness returns 503 whenever postgres blips, which would cascade
      # ``service_healthy`` failures through the whole app stack.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
      litellm-db-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  paper_ingestion:
    image: ghcr.io/limitcycle-oss/jarvis-paper-ingestion:${JARVIS_VERSION:-1.1.2}${TORCH_VARIANT_SUFFIX:-}
    pull_policy: missing
    build:
      context: .
      dockerfile: services/paper_ingestion/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.9-slim}
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    hostname: paper-ingestion-1
    ports:
      - "127.0.0.1:${PAPER_INGESTION_HOST_PORT:-8010}:8000"
    environment:
      <<: *shared-env
      PDF_STORAGE_PATH: /data/pdfs
      SNAPSHOT_STORAGE_PATH: /data/snapshots
      AUTO_FETCH_INTERVAL_HOURS: ${AUTO_FETCH_INTERVAL_HOURS:-0}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # QDRANT_API_KEY is injected via Docker Secret (_FILE convention)
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      # Ask relevance tuning: relative gate vs the best hit per query facet,
      # and a hard reranker-score floor (empty = backend-aware default).
      RAG_RELATIVE_SCORE_CUTOFF: ${RAG_RELATIVE_SCORE_CUTOFF:-0.85}
      RAG_MIN_RERANK_SCORE: ${RAG_MIN_RERANK_SCORE:-}
      # Opt-in for bench/multi-user deployments: bypasses the single-tenant
      # session-mint guardrail so API-key sessions can be created without a DB user.
      API_KEY_LOGIN_ENABLED: ${API_KEY_LOGIN_ENABLED:-false}
      # JARVIS_CONFIG_KEY (Fernet) is injected via Docker Secret (_FILE convention)
      JARVIS_CONFIG_KEY_FILE: /run/secrets/jarvis_config_key
      # Vector sidecar uses this to authenticate to POST /infra-events
      INFRA_INGEST_KEY_FILE: /run/secrets/infra_ingest_key
      # Gates the first-run setup wizard's WRITE endpoints while no admin exists.
      JARVIS_SETUP_TOKEN_FILE: /run/secrets/jarvis_setup_token
    secrets:
      - jarvis_api_key
      - jarvis_setup_token
      - jarvis_model_hmac_key
      - postgres_password
      - telegram_bot_token
      - qdrant_api_key
      - litellm_master_key
      - jarvis_config_key
      - infra_ingest_key
      - langfuse_init_pk
      - langfuse_init_sk
    volumes:
      - ./shared/pdf_storage:/data/pdfs
      - ./shared/snapshots:/data/snapshots
      - ${LOCAL_PDF_PATH:-./shared/local_pdfs}:/data/local_pdfs:ro
      - ./db/migrations:/app/db/migrations:ro
      - ./config:/app/config:ro  # llm-tier-candidates.yaml for /api/settings/ai
      - hf_cache:/tmp/hf_cache  # Persist HuggingFace cache (Docling layout/table models) across recreation
      - postgres_backups:/backups:ro  # list/download DR archives in the admin Backup panel
      - backup_trigger:/backup-trigger  # RW sentinel dir the WebUI writes to request an on-demand backup
    mem_limit: 6g
    # Base compose is CPU-safe — no GPU device reservation here so CPU-only hosts
    # can `docker compose up`. setup.sh layers docker-compose.gpu.yml when the
    # Docker nvidia runtime is present to re-enable the GPU reservation.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=10).raise_for_status()\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ollama-bootstrap:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  learning_engine:
    image: ghcr.io/limitcycle-oss/jarvis-learning-engine:${JARVIS_VERSION:-1.1.2}
    pull_policy: missing
    build:
      context: .
      dockerfile: services/learning_engine/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.9-slim}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    hostname: learning-engine-1
    ports:
      - "127.0.0.1:${LEARNING_ENGINE_HOST_PORT:-8011}:8001"
    environment:
      <<: *shared-env
      JARVIS_CONFIG_KEY_FILE: /run/secrets/jarvis_config_key
    secrets:
      - jarvis_api_key
      - jarvis_model_hmac_key
      - postgres_password
      - litellm_master_key
      - jarvis_config_key
      - langfuse_init_pk
      - langfuse_init_sk
    volumes:
      # Read-only migrations so the maintenance watcher can forward-migrate a
      # restored (possibly older) schema on resume — lock-42-serialized with
      # paper_ingestion; this service gains no destructive privilege.
      - ./db/migrations:/app/db/migrations:ro
      # Read-only: this service only os.stat()s the maintenance sentinel (so the
      # P6 maintenance middleware can 503 it too during a restore). Read-only
      # prevents it from writing a restore-request/backup sentinel — only
      # paper_ingestion (the admin API) may do that.
      - backup_trigger:/backup-trigger:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      # ``smart``/``fast`` aliases are registered by paper_ingestion's model
      # bootstrap; starting this service before that completes may 404 queued
      # LLM jobs.
      paper_ingestion:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  telegram_bot:
    image: ghcr.io/limitcycle-oss/jarvis-telegram-bot:${JARVIS_VERSION:-1.1.2}
    pull_policy: missing
    build:
      context: .
      dockerfile: services/telegram_bot/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.9-slim}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    hostname: telegram-bot-1
    profiles:
      - telegram
    environment:
      <<: *shared-env
      # TELEGRAM_BOT_TOKEN is injected via Docker Secret (_FILE convention) only
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    secrets:
      - jarvis_api_key
      - jarvis_model_hmac_key
      - langfuse_init_pk
      - langfuse_init_sk
      - litellm_master_key
      - postgres_password
      - telegram_bot_token
    volumes:
      # Read-only: the bot only os.stat()s the maintenance sentinel so its
      # command/callback maintenance gate can pause handling during a restore.
      # Read-only prevents it from writing a restore-request/backup sentinel.
      - backup_trigger:/backup-trigger:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\", timeout=5).read()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      learning_engine:
        condition: service_healthy
      paper_ingestion:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  dashboard:
    image: ghcr.io/limitcycle-oss/jarvis-dashboard:${JARVIS_VERSION:-1.1.2}
    pull_policy: missing
    build:
      context: ./frontend
      args:
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-node:22.14-alpine3.21}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine3.21}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      # Dashboard publishes plain HTTP on host 3001 by default (NOT 3000 — that
      # is reserved for the container-side port). For HTTPS, enable the
      # caddy-local profile: `docker compose --profile caddy-local up -d`.
      # Override DASHBOARD_HOST_PORT in .env if you need a different port.
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_HOST_PORT:-3001}:3000"
    environment:
      JARVIS_CERT_SAN: ${JARVIS_CERT_SAN:-DNS:jarvis.localhost,DNS:localhost,IP:127.0.0.1}
      JARVIS_SKIP_SELFSIGNED_GEN: ${JARVIS_SKIP_SELFSIGNED_GEN:-true}
      # Extra Host header(s) the dashboard nginx accepts, for DIRECT remote access
      # without Caddy (e.g. a Tailscale MagicDNS name). Empty = localhost-only.
      # Must be set (even empty) so envsubst resolves it in nginx.conf.
      DASHBOARD_SERVER_NAME: ${DASHBOARD_SERVER_NAME:-}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      paper_ingestion:
        condition: service_healthy
      learning_engine:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    # Disaster-recovery backups run by default (archives are encrypted at rest with
    # the auto-generated backup_encrypt_key). To opt out — e.g. you back up
    # externally — stop just this service: docker compose stop postgres-backup
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      # backup.sh hard-refuses to run with insecure defaults when ENVIRONMENT=production;
      # the sidecar must receive it explicitly (it does not use the shared env anchor).
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-jarvis}
      # PGPASSWORD is NOT set here; backup.sh reads /run/secrets/postgres_password
      PGDATABASE: ${POSTGRES_DB:-jarvis}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      # Path to encryption key file (Docker Secret); backup.sh uses this to encrypt archives.
      BACKUP_ENCRYPT_KEYFILE: /run/secrets/backup_encrypt_key
      # backup.sh also dumps the litellm DB and snapshots Qdrant (best-effort).
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEYFILE: /run/secrets/qdrant_api_key
      # The on-disk secrets/ source is archived so an encrypted DB backup stays
      # decryptable; mounted read-only at SECRETS_DIR below.
      SECRETS_DIR: /secrets
      # Stamped into each backup manifest's app_version (so a restore point shows
      # the JARVIS version it was taken on, not a constant "unknown").
      JARVIS_VERSION: ${JARVIS_VERSION:-1.1.2}
    secrets:
      - postgres_password
      - backup_encrypt_key
      - qdrant_api_key
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./scripts/restore.sh:/usr/local/bin/restore.sh:ro  # one-click DR restore (runs in this already-privileged sidecar; the app gains zero new privilege)
      - ./scripts/prune.sh:/usr/local/bin/prune.sh:ro  # backup DELETE executor (same boundary: the app only writes .delete_request.json; every rm happens here)
      - ./secrets:/secrets:ro
      - ./secrets:/host-secrets:rw  # rw: an off-host (inbox) restore materializes the restored ./secrets/*.txt here so the app containers self-restart onto the rotated secrets (the sidecar is the trusted DR component; the app's zero-privilege invariant is untouched)
      - postgres_backups:/backups
      - backup_trigger:/backup-trigger  # shared sentinel dir; backup.sh runs immediately when .backup_now appears, restore.sh when .restore_request.json appears
      - restore_staging:/qdrant/snapshots/restore  # rw: the sidecar writes decrypted Qdrant snapshots here for file:// recover
      - restore_inbox:/restore-inbox  # rw: off-host DR — the operator drops the archive set + one-time backup key here for a cross-host (inbox) restore. The ONLY writable cross-host secrets-staging surface; it is NEVER under the RO /secrets mount above.
      - ./db/migrations:/app/db/migrations:ro  # ro: restore.sh reads the code's max migration to refuse a newer-than-deployment restore (stable even when the live DB is gone mid-recovery)
      - postgres_data:/postgres-data:ro  # ro: restore.sh's disk preflight sizes the free space on the live DB volume to refuse a restore that would exhaust it (rename-swap keeps both live DBs while it reloads a transient tmp DB)
    # Loop dispatch by sentinel: a restore request runs restore.sh (rename-swap both
    # DBs + recover Qdrant behind the maintenance gate); a delete request runs
    # prune.sh (delete named restore points); otherwise take the scheduled backup.
    # On startup, a leftover .restore_swap_state.json means a prior restore crashed
    # mid-swap: run restore.sh --recover ONCE first to reconcile the stranded db to
    # untouched-or-completed (it never consumes a request or runs the full flow).
    # `sh -uc` deliberately drops -e so ONE failed run cannot kill the loop (a
    # non-zero exit would restart:unless-stopped into a fresh-archive-set-per-restart
    # loop); each branch logs its failure via `|| echo ... rc=$?` and continues. The
    # inner poll breaks early on ANY of the three sentinels so an on-demand backup,
    # restore, or delete fires within ~5s rather than after the full interval.
    entrypoint: >
      sh -uc "[ -f /backup-trigger/.restore_swap_state.json ] && /usr/local/bin/restore.sh --recover || true;
      while true;
      do /usr/local/bin/restore.sh --inbox-manifest || true;
      if [ -f /backup-trigger/.restore_request.json ]; then /usr/local/bin/restore.sh || echo \"[sidecar] restore failed rc=$$?\" >&2;
      elif [ -f /backup-trigger/.delete_request.json ]; then /usr/local/bin/prune.sh || echo \"[sidecar] prune failed rc=$$?\" >&2;
      else /usr/local/bin/backup.sh || echo \"[sidecar] backup failed rc=$$?\" >&2; fi;
      i=0; while [ \"$$i\" -lt \"$${BACKUP_INTERVAL_SECONDS:-86400}\" ]; do
      if [ -f /backup-trigger/.backup_now ] || [ -f /backup-trigger/.restore_request.json ] || [ -f /backup-trigger/.delete_request.json ]; then break; fi;
      sleep 5; i=$$((i+5)); done; done"
    depends_on:
      postgres:
        condition: service_healthy
      # backup.sh does a fatal pg_dump of the litellm DB, which litellm-db-init
      # creates; wait for that one-shot so the first run on a fresh stack does not
      # crash-loop dumping a not-yet-created database (mirrors the litellm service).
      litellm-db-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  # Off-host disaster-recovery upload ingress. Caddy routes /restore-upload/* here
  # so the encrypted archive set + one-time backup key never transit the app; this
  # container holds NO DB, NO secret mount, and NO docker.sock — it only streams an
  # allowlisted, grant-authorized file into the restore_inbox for restore.sh to read
  # (a drop-in for the previous manual scp step). See services/restore_uploader.
  restore-uploader:
    build: ./services/restore_uploader
    image: ghcr.io/limitcycle-oss/jarvis-restore-uploader:${JARVIS_VERSION:-1.1.2}
    pull_policy: missing
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    mem_limit: 128m
    environment:
      # Per-request upload ceiling; Caddy's /restore-upload body cap must be ≥ this.
      UPLOAD_MAX_GB: ${UPLOAD_MAX_GB:-20}
    volumes:
      - restore_inbox:/restore-inbox:rw  # the ONLY writable surface: streams the uploaded archive set + operator key here for restore.sh
      - backup_trigger:/backup-trigger:ro  # reads only .upload_grant.json (sha256 + expiry, never a secret) to authorize an upload
    healthcheck:
      # The uploader is PUT-only and deliberately answers 405 to every GET, so an
      # exact 405 IS the liveness signal (anything else means the server isn't
      # serving). stdlib http.client because the slim image has no curl/wget.
      # The body is read and the connection closed explicitly: the server speaks
      # HTTP/1.1 keep-alive, so exiting on an unread socket RSTs it and dumps a
      # ConnectionResetError traceback into the uploader's own log every few probes.
      test: ["CMD-SHELL", "python -c \"import http.client; c = http.client.HTTPConnection('127.0.0.1', 8090, timeout=5); c.request('GET', '/'); r = c.getresponse(); r.read(); c.close(); raise SystemExit(0 if r.status == 405 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jarvis

  langfuse-postgres:
    image: ${LANGFUSE_POSTGRES_IMAGE:-postgres:16.8-alpine}
    profiles: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      # Password is read from the Docker Secret at startup; no plaintext env var
      # so ``docker inspect`` cannot leak it.
      POSTGRES_PASSWORD_FILE: /run/secrets/langfuse_pg_password
    secrets:
      - langfuse_pg_password
    # Entrypoint shim: fail-fast if secret file is empty, then hand off to the
    # upstream postgres entrypoint which reads POSTGRES_PASSWORD_FILE natively.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -s /run/secrets/langfuse_pg_password ]; then
          echo 'FATAL: /run/secrets/langfuse_pg_password is empty or missing.' >&2; exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis

  langfuse:
    # Security hardening: a thin wrapper image runs as root, reads
    # DATABASE_URL / NEXTAUTH_SECRET / SALT from /run/secrets/* (langfuse v2
    # has no _FILE convention), exports them, then drops to the upstream
    # `nextjs` user via `su-exec` and execs the upstream entrypoint
    # (`dumb-init -- ./web/entrypoint.sh`). The three high-value secrets are
    # therefore no longer exposed via `docker inspect`. Compose builds the
    # wrapper on first `make observability-up` (~30s) and caches it
    # thereafter; the upstream image digest stays the single source of truth
    # via the LANGFUSE_IMAGE build-arg from versions.env. See
    # ./langfuse/Dockerfile.langfuse + ./langfuse/entrypoint.sh.
    image: jarvis/langfuse-hardened:${JARVIS_VERSION:-1.1.2}
    pull_policy: build
    build:
      context: ./langfuse
      dockerfile: Dockerfile.langfuse
      args:
        LANGFUSE_BASE_IMAGE: ${LANGFUSE_IMAGE:-langfuse/langfuse@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015}
    profiles: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${LANGFUSE_BIND_HOST:-127.0.0.1}:${LANGFUSE_HOST_PORT:-3002}:3000"
    secrets:
      - langfuse_pg_password
      - langfuse_nextauth_secret
      - langfuse_salt
    environment:
      NEXTAUTH_URL: http://localhost:${LANGFUSE_HOST_PORT:-3002}
      TELEMETRY_ENABLED: "false"
      # Next.js standalone binds the resolved $HOSTNAME (the container IP), not
      # loopback, so the `wget http://localhost:3000` healthcheck below would
      # false-report `unhealthy`. Pin to 0.0.0.0 so it binds all interfaces and
      # the loopback healthcheck (and depends_on: service_healthy) is correct.
      HOSTNAME: "0.0.0.0"
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: jarvis
      LANGFUSE_INIT_ORG_NAME: JARVIS
      LANGFUSE_INIT_PROJECT_ID: jarvis
      LANGFUSE_INIT_PROJECT_NAME: JARVIS
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-operator@jarvis.local}
      LANGFUSE_INIT_USER_NAME: JARVIS Operator
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      # LANGFUSE_INIT_PROJECT_{PUBLIC,SECRET}_KEY are the headless-init
      # keypair, not application secrets — they are written by
      # scripts/gen-langfuse-keys.sh, mirrored into .env, and JARVIS services
      # consume them via the _FILE → SecretsSettings path (appuser uid=1000 can
      # read the 0600/uid-1000 mounts). The image's init logic still reads
      # them from env, so they remain interpolated here. Their exposure via
      # `docker inspect` is bounded to this single self-hosted operator's
      # Langfuse project and is rotated by the gen-langfuse-keys script.
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # but the Next.js server listens IPv4-only on 0.0.0.0:3000.
      # ?failIfDatabaseUnavailable=true makes /api/public/health
      # return 503 when the DB connection is down, not just when the HTTP layer is.
      # Verified upstream contract: https://langfuse.com/self-hosting/configuration
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    networks:
      - jarvis

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.1.0}
    container_name: jarvis-cloudflared
    # cloudflared natively supports --token-file; no entrypoint shim needed.
    command: tunnel --token-file /run/secrets/cloudflare_tunnel_token run
    secrets:
      - cloudflare_tunnel_token
    profiles: [tunnel]
    networks: [jarvis]
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local-dev Caddy with mkcert certs — matches prod TLS-at-edge pattern.
  # Activate with: `docker compose --profile caddy-local up -d` (or `make up-https`).
  # Then access https://localhost:3443 (browsers trust the mkcert root CA); the
  # dashboard keeps its own host port 3001 so the two never collide.
  caddy_local:
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    profiles: [caddy-local]
    container_name: jarvis_caddy_local
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3443:3443"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:3443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      jarvis:
        ipv4_address: 10.137.241.3

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    profiles: [letsencrypt]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${LETSENCRYPT_HTTP_PORT:-80}:80"
      - "${LETSENCRYPT_HTTPS_PORT:-443}:443"
    environment:
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      jarvis:
        ipv4_address: 10.137.241.2

  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.40.0-alpine}
    container_name: jarvis_vector
    profiles: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    # docker.sock is mounted RO for log scraping only — no capabilities needed.
    cap_drop: [ALL]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/vector.toml:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    environment:
      VECTOR_LOG: warn
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -euo pipefail
        INFRA_KEY=$$(cat /run/secrets/infra_ingest_key)
        exec env INFRA_KEY="$$INFRA_KEY" vector --config /etc/vector/vector.toml
    secrets:
      - infra_ingest_key
    depends_on:
      paper_ingestion:
        condition: service_started
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  postgres_backups:
  backup_trigger:
  restore_staging:  # decrypted Qdrant snapshots staged by restore.sh for file:// recover
  restore_inbox:  # rw cross-host DR drop zone: operator places the off-host archive set + one-time backup key here for an `inbox` restore (never under the RO /secrets)
  hf_cache:
  caddy_data:
  caddy_config:
  langfuse_postgres_data:
  vector_data:

networks:
  jarvis:
    driver: bridge
    ipam:
      config:
        - subnet: ${JARVIS_NET_SUBNET:-10.137.241.0/24}
          # gateway: auto-assigned by Docker (first host in subnet); omit to avoid
          # hard-fail when JARVIS_NET_SUBNET is overridden to a different range.

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jarvis_api_key:
    file: ./secrets/jarvis_api_key.txt
  jarvis_setup_token:
    file: ./secrets/jarvis_setup_token.txt
  jarvis_model_hmac_key:
    file: ./secrets/jarvis_model_hmac_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  qdrant_api_key:
    file: ./secrets/qdrant_api_key.txt
  litellm_master_key:
    file: ./secrets/litellm_master_key.txt
  litellm_salt_key:
    file: ./secrets/litellm_salt_key.txt
  jarvis_config_key:
    file: ./secrets/jarvis_config_key.txt
  langfuse_pg_password:
    file: ./secrets/langfuse_pg_password.txt
  langfuse_nextauth_secret:
    file: ./secrets/langfuse_nextauth_secret.txt
  langfuse_salt:
    file: ./secrets/langfuse_salt.txt
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt
  backup_encrypt_key:
    file: ./secrets/backup_encrypt_key.txt
  infra_ingest_key:
    file: ./secrets/infra_ingest_key.txt
  langfuse_init_pk:
    file: ./secrets/langfuse_init_pk.txt
  langfuse_init_sk:
    file: ./secrets/langfuse_init_sk.txt
