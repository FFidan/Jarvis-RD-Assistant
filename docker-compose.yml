# =============================================================================
# JARVIS RD Assistant - Docker Compose
# =============================================================================
# Based on n8n Self-Hosted AI Starter Kit, extended with JARVIS services.
# Usage:
#   cp .env.example .env   # edit with your values
#   docker compose up -d
# =============================================================================

x-shared-env: &shared-env
  # DATABASE_URL is NOT set here — each service's entrypoint.sh reads
  # /run/secrets/postgres_password and constructs it at container start.
  LITELLM_BASE_URL: http://litellm:4000
  # master_key for LiteLLM admin endpoints is mounted as a Docker Secret
  # (_FILE convention) at /run/secrets/litellm_master_key.  Each service that
  # calls LiteLLM declares ``- litellm_master_key`` under its ``secrets:`` list.
  LITELLM_MASTER_KEY_FILE: /run/secrets/litellm_master_key
  QDRANT_URL: http://qdrant:6333
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embed}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-qwen3-embedding:4b}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-2560}
  # JARVIS_API_KEY is injected via Docker Secret (_FILE convention) only — no
  # plaintext env var fallback so ``docker inspect`` cannot leak the key.
  JARVIS_API_KEY_FILE: /run/secrets/jarvis_api_key
  # JARVIS_MODEL_HMAC_KEY signs Pulse classifier pickle blobs; injected via
  # Docker Secret (_FILE convention) only, mandatory in production.
  JARVIS_MODEL_HMAC_KEY_FILE: /run/secrets/jarvis_model_hmac_key
  DEV_MODE: ${DEV_MODE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DB_POOL_MIN: ${DB_POOL_MIN:-2}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  PULSE_STAGE2_MODEL: ${PULSE_STAGE2_MODEL:-fast}
  PULSE_STAGE2_MAX_RETRIES: ${PULSE_STAGE2_MAX_RETRIES:-1}
  JARVIS_TRUST_CF_CONNECTING_IP: ${JARVIS_TRUST_CF_CONNECTING_IP:-false}
  TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-http://telegram_bot:8002}
  OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY_FILE: /run/secrets/langfuse_init_pk
  LANGFUSE_SECRET_KEY_FILE: /run/secrets/langfuse_init_sk

services:
  # ==========================================================================
  # INFRASTRUCTURE (from n8n AI Starter Kit)
  # ==========================================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:1.77.0}
    profiles: ["n8n"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    ports:
      - "127.0.0.1:5678:5678"
    # n8n binds 127.0.0.1 only; access is gated by loopback + the n8n compose profile.
    # If a future operator routes n8n via Caddy or cloudflared, ALSO set N8N_BASIC_AUTH_ACTIVE=true
    # and mount N8N_BASIC_AUTH_USER_FILE / N8N_BASIC_AUTH_PASSWORD_FILE secrets.
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # n8n 1.x natively supports _FILE convention for these two secrets —
      # no entrypoint shim needed; the image reads the file itself.
      - N8N_ENCRYPTION_KEY_FILE=/run/secrets/n8n_encryption_key
      - N8N_USER_MANAGEMENT_JWT_SECRET_FILE=/run/secrets/n8n_jwt_secret
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-jarvis}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-jarvis}
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
      - n8n_encryption_key
      - n8n_jwt_secret
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared/pdf_storage:/data/pdfs
      - ./shared/snapshots:/data/snapshots
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.23.1}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 20g
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/11434 && printf 'GET /api/version HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  ollama-bootstrap:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.23.1}
    security_opt: ["no-new-privileges:true"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Default fits a single 16 GB GPU with the embedder kept resident:
      # qwen3:8b (smart + smart-fallback), qwen3:4b (fast), qwen3-embedding:4b.
      # Larger-VRAM deployments can override OLLAMA_MODELS and switch the smart
      # role via the in-app model picker (Settings → llm.smart_model).
      OLLAMA_MODELS: ${OLLAMA_MODELS:-qwen3:8b,qwen3:4b,qwen3-embedding:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for model in $$(echo "$$OLLAMA_MODELS" | tr "," " "); do
          echo "Pulling $$model..."
          ollama pull "$$model" || { echo "FAILED: $$model"; exit 1; }
        done
        echo "All models ready."
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis
    pull_policy: missing

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    environment:
      # Qdrant reads the API key from this file path via its _FILE convention
      QDRANT__SERVICE__API_KEY_FILE: /run/secrets/qdrant_api_key
    secrets:
      - qdrant_api_key
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  # ==========================================================================
  # JARVIS ADDITIONS
  # ==========================================================================

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:29252f25ed1b538d44f6b76ec97412c5537a180b39ede744b9f3e86ffdd278f5}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    # OPENAI_API_KEY and ANTHROPIC_API_KEY are intentionally omitted here.
    # Cloud-key injection happens via Fernet user_config + runtime POST /config/update.
    # The startup env vars are dead and their presence would expose keys via
    # ``docker inspect``.
    secrets:
      - litellm_master_key
    # litellm/config.yaml uses ``master_key: os.environ/LITELLM_MASTER_KEY`` and
    # the upstream image does not honour the ``_FILE`` convention.  This shim
    # reads the secret file into LITELLM_MASTER_KEY at container start and
    # refuses to start when the file is empty (W1-2 + W1-5).  Both
    # ``entrypoint`` and ``command`` are overridden — the upstream image sets
    # entrypoint=["litellm"], so without overriding it our ``sh`` would be
    # passed as a positional arg to litellm.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -s /run/secrets/litellm_master_key ]; then
          echo 'FATAL: /run/secrets/litellm_master_key is empty or missing.' >&2
          exit 1
        fi
        export LITELLM_MASTER_KEY="$(cat /run/secrets/litellm_master_key)"
        # H-5: Reject known placeholder/weak values in production so a deploy
        # with an unchanged secrets/litellm_master_key.txt fails fast here
        # rather than silently running with a public default.
        if [ "$${ENVIRONMENT:-development}" = "production" ]; then
          case "$LITELLM_MASTER_KEY" in
            "sk-jarvis-dev-test"|changeme|secret|password|""|"sk-1234")
              echo 'FATAL: LITELLM_MASTER_KEY is a known placeholder value.' \
                   'Replace secrets/litellm_master_key.txt before deploying to production.' >&2
              exit 1 ;;
          esac
          if [ "$${#LITELLM_MASTER_KEY}" -lt 16 ]; then
            echo 'FATAL: LITELLM_MASTER_KEY is too short (< 16 chars) for production.' >&2
            exit 1
          fi
        fi
        exec litellm --config /app/config.yaml
    # Loopback binding (127.0.0.1:4000) is kept as defence-in-depth.
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  paper_ingestion:
    image: jarvis/paper_ingestion:${JARVIS_VERSION:-0.2.1}
    build:
      context: .
      dockerfile: services/paper_ingestion/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.9-slim}
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    hostname: paper-ingestion-1
    ports:
      - "127.0.0.1:${PAPER_INGESTION_HOST_PORT:-8010}:8000"
    environment:
      <<: *shared-env
      PDF_STORAGE_PATH: /data/pdfs
      SNAPSHOT_STORAGE_PATH: /data/snapshots
      AUTO_FETCH_INTERVAL_HOURS: ${AUTO_FETCH_INTERVAL_HOURS:-0}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # QDRANT_API_KEY is injected via Docker Secret (_FILE convention)
      QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      # Opt-in for bench/multi-user deployments: bypasses the single-tenant
      # session-mint guardrail so API-key sessions can be created without a DB user.
      API_KEY_LOGIN_ENABLED: ${API_KEY_LOGIN_ENABLED:-false}
      # JARVIS_CONFIG_KEY (Fernet) is injected via Docker Secret (_FILE convention)
      JARVIS_CONFIG_KEY_FILE: /run/secrets/jarvis_config_key
      # Vector sidecar uses this to authenticate to POST /infra-events
      INFRA_INGEST_KEY_FILE: /run/secrets/infra_ingest_key
    secrets:
      - jarvis_api_key
      - jarvis_model_hmac_key
      - postgres_password
      - telegram_bot_token
      - qdrant_api_key
      - litellm_master_key
      - jarvis_config_key
      - infra_ingest_key
      - langfuse_init_pk
      - langfuse_init_sk
    volumes:
      - ./shared/pdf_storage:/data/pdfs
      - ./shared/snapshots:/data/snapshots
      - ${LOCAL_PDF_PATH:-./shared/local_pdfs}:/data/local_pdfs:ro
      - ./db/migrations:/app/db/migrations:ro
      - ./config:/app/config:ro  # llm-tier-candidates.yaml for /api/settings/ai
      - marker_models:/tmp/appuser  # Persist Marker/Surya model cache across restarts
      - hf_cache:/tmp/hf_cache  # Persist HuggingFace cache across container recreation
      - ./litellm:/app/litellm_config:ro  # shared config for model updates (SEC-002: ro)
    mem_limit: 6g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=10).raise_for_status()\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ollama-bootstrap:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  learning_engine:
    image: jarvis/learning_engine:${JARVIS_VERSION:-0.2.1}
    build:
      context: .
      dockerfile: services/learning_engine/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.9-slim}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    hostname: learning-engine-1
    ports:
      - "127.0.0.1:${LEARNING_ENGINE_HOST_PORT:-8011}:8001"
    environment:
      <<: *shared-env
      JARVIS_CONFIG_KEY_FILE: /run/secrets/jarvis_config_key
    secrets:
      - jarvis_api_key
      - jarvis_model_hmac_key
      - postgres_password
      - litellm_master_key
      - jarvis_config_key
      - langfuse_init_pk
      - langfuse_init_sk
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      paper_ingestion:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  telegram_bot:
    image: jarvis/telegram_bot:${JARVIS_VERSION:-0.2.1}
    build:
      context: .
      dockerfile: services/telegram_bot/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12.9-slim}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    hostname: telegram-bot-1
    profiles:
      - telegram
    environment:
      <<: *shared-env
      # TELEGRAM_BOT_TOKEN is injected via Docker Secret (_FILE convention) only
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    secrets:
      - jarvis_api_key
      - postgres_password
      - telegram_bot_token
      - litellm_master_key
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8002/health\", timeout=5).read()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      learning_engine:
        condition: service_healthy
      paper_ingestion:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  dashboard:
    image: jarvis/dashboard:${JARVIS_VERSION:-0.2.1}
    build:
      context: ./frontend
      args:
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-node:22.14-alpine3.21}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-nginx:1.27-alpine3.21}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      # Dashboard publishes plain HTTP on host 3001 by default (NOT 3000 — that
      # is reserved for the internal container port). For HTTPS, enable the
      # caddy-local profile: `docker compose --profile caddy-local up -d`.
      # Override DASHBOARD_HOST_PORT in .env if you need a different port.
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_HOST_PORT:-3001}:3000"
    environment:
      JARVIS_CERT_SAN: ${JARVIS_CERT_SAN:-DNS:jarvis.localhost,DNS:localhost,IP:127.0.0.1}
      JARVIS_SKIP_SELFSIGNED_GEN: ${JARVIS_SKIP_SELFSIGNED_GEN:-true}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      paper_ingestion:
        condition: service_healthy
      learning_engine:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    profiles: [backup]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-jarvis}
      # PGPASSWORD is NOT set here; backup.sh reads /run/secrets/postgres_password
      PGDATABASE: ${POSTGRES_DB:-jarvis}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      # Path to encryption key file (Docker Secret); backup.sh uses this to encrypt archives.
      BACKUP_ENCRYPT_KEYFILE: /run/secrets/backup_encrypt_key
    secrets:
      - postgres_password
      - backup_encrypt_key
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - postgres_backups:/backups
    entrypoint: >
      sh -euc "while true; do /usr/local/bin/backup.sh; sleep $${BACKUP_INTERVAL_SECONDS:-86400}; done"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  langfuse-postgres:
    image: postgres:16.8-alpine
    profiles: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      # Password is read from the Docker Secret at startup; no plaintext env var
      # so ``docker inspect`` cannot leak it.
      POSTGRES_PASSWORD_FILE: /run/secrets/langfuse_pg_password
    secrets:
      - langfuse_pg_password
    # Entrypoint shim: fail-fast if secret file is empty, then hand off to the
    # upstream postgres entrypoint which reads POSTGRES_PASSWORD_FILE natively.
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ ! -s /run/secrets/langfuse_pg_password ]; then
          echo 'FATAL: /run/secrets/langfuse_pg_password is empty or missing.' >&2; exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jarvis

  langfuse:
    image: ${LANGFUSE_IMAGE:-langfuse/langfuse@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015}
    profiles: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${LANGFUSE_BIND_HOST:-127.0.0.1}:${LANGFUSE_HOST_PORT:-3002}:3000"
    # S5-05: DATABASE_URL/NEXTAUTH_SECRET/SALT are interpolated from .env (plaintext).
    # Langfuse v2 has no _FILE convention for these vars; accepted risk for
    # single-tenant self-hosted deployments where the host is the trust boundary.
    environment:
      NEXTAUTH_URL: http://localhost:${LANGFUSE_HOST_PORT:-3002}
      TELEMETRY_ENABLED: "false"
      # Next.js standalone binds the resolved $HOSTNAME (the container IP), not
      # loopback, so the `wget http://localhost:3000` healthcheck below would
      # false-report `unhealthy`. Pin to 0.0.0.0 so it binds all interfaces and
      # the loopback healthcheck (and depends_on: service_healthy) is correct.
      HOSTNAME: "0.0.0.0"
      # Langfuse v2 reads these from env only (no _FILE convention — which is
      # why the old entrypoint shim existed). Interpolated from .env, whose
      # values are kept byte-identical to ./secrets/langfuse_*.txt; the
      # langfuse-postgres service initialised its DB from that same password
      # file, so there is no credential divergence. Local-dev, loopback-bound.
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_PG_PASSWORD}@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: jarvis
      LANGFUSE_INIT_ORG_NAME: JARVIS
      LANGFUSE_INIT_PROJECT_ID: jarvis
      LANGFUSE_INIT_PROJECT_NAME: JARVIS
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-operator@jarvis.local}
      LANGFUSE_INIT_USER_NAME: JARVIS Operator
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      # The langfuse image runs as non-root `nextjs` (uid 1001) and Docker
      # Compose `file:` secrets preserve the host file's 0600/uid-1000 perms,
      # so an in-container `cat /run/secrets/*` shim is unreadable here (the
      # exact failure the earlier crash-fix removed). Langfuse's headless-init
      # contract is env-only, so `make observability-up` injects the keypair
      # from the same secrets/langfuse_init_*.txt files (single source of
      # truth) as these env vars, and the image's native entrypoint runs
      # unmodified. JARVIS services still read the files via the _FILE →
      # SecretsSettings path (their appuser=uid 1000 can read them).
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # but the Next.js server listens IPv4-only on 0.0.0.0:3000.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    networks:
      - jarvis

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.1.0}
    container_name: jarvis-cloudflared
    # cloudflared natively supports --token-file; no entrypoint shim needed.
    command: tunnel --token-file /run/secrets/cloudflare_tunnel_token run
    secrets:
      - cloudflare_tunnel_token
    profiles: [tunnel]
    networks: [jarvis]
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local-dev Caddy with mkcert certs — matches prod TLS-at-edge pattern.
  # Activate with: `docker compose --profile caddy-local up -d`
  # Then access https://localhost:3001 (browsers trust the mkcert root CA).
  caddy_local:
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    profiles: [caddy-local]
    container_name: jarvis_caddy_local
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      jarvis:
        ipv4_address: 10.137.241.3

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    profiles: [letsencrypt]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${LETSENCRYPT_HTTP_PORT:-80}:80"
      - "${LETSENCRYPT_HTTPS_PORT:-443}:443"
    environment:
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      jarvis:
        ipv4_address: 10.137.241.2

  vector:
    image: ${VECTOR_IMAGE:-timberio/vector:0.40.0-alpine}
    container_name: jarvis_vector
    profiles: [observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/vector.toml:/etc/vector/vector.toml:ro
      - vector_data:/var/lib/vector
    environment:
      VECTOR_LOG: warn
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -euo pipefail
        INFRA_KEY=$$(cat /run/secrets/infra_ingest_key)
        exec env INFRA_KEY="$$INFRA_KEY" vector --config /etc/vector/vector.toml
    secrets:
      - infra_ingest_key
    depends_on:
      paper_ingestion:
        condition: service_started
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
  qdrant_data:
  postgres_backups:
  marker_models:
  hf_cache:
  caddy_data:
  caddy_config:
  langfuse_postgres_data:
  vector_data:

networks:
  jarvis:
    driver: bridge
    ipam:
      config:
        - subnet: ${JARVIS_NET_SUBNET:-10.137.241.0/24}
          # gateway: auto-assigned by Docker (first host in subnet); omit to avoid
          # hard-fail when JARVIS_NET_SUBNET is overridden to a different range.

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jarvis_api_key:
    file: ./secrets/jarvis_api_key.txt
  jarvis_model_hmac_key:
    file: ./secrets/jarvis_model_hmac_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  qdrant_api_key:
    file: ./secrets/qdrant_api_key.txt
  litellm_master_key:
    file: ./secrets/litellm_master_key.txt
  jarvis_config_key:
    file: ./secrets/jarvis_config_key.txt
  langfuse_pg_password:
    file: ./secrets/langfuse_pg_password.txt
  langfuse_nextauth_secret:
    file: ./secrets/langfuse_nextauth_secret.txt
  langfuse_salt:
    file: ./secrets/langfuse_salt.txt
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key.txt
  n8n_jwt_secret:
    file: ./secrets/n8n_jwt_secret.txt
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt
  backup_encrypt_key:
    file: ./secrets/backup_encrypt_key.txt
  infra_ingest_key:
    file: ./secrets/infra_ingest_key.txt
  langfuse_init_pk:
    file: ./secrets/langfuse_init_pk.txt
  langfuse_init_sk:
    file: ./secrets/langfuse_init_sk.txt
