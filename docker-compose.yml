# =============================================================================
# JARVIS RD Assistant - Docker Compose
# =============================================================================
# Based on n8n Self-Hosted AI Starter Kit, extended with JARVIS services.
# Usage:
#   cp .env.example .env   # edit with your values
#   docker compose up -d
# =============================================================================

x-shared-env: &shared-env
  # DATABASE_URL is NOT set here — each service's entrypoint.sh reads
  # /run/secrets/postgres_password and constructs it at container start.
  LITELLM_BASE_URL: http://litellm:4000
  # LITELLM_API_KEY is injected via Docker Secret in litellm/entrypoint.sh; not passed to app services.
  QDRANT_URL: http://qdrant:6333
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embed}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  # JARVIS_API_KEY is injected via Docker Secret (_FILE convention); plain env var kept as fallback
  JARVIS_API_KEY: ${JARVIS_API_KEY:-}
  JARVIS_API_KEY_FILE: /run/secrets/jarvis_api_key
  # QDRANT_API_KEY is injected via Docker Secret (_FILE convention)
  QDRANT_API_KEY_FILE: /run/secrets/qdrant_api_key
  DEV_MODE: ${DEV_MODE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost:3001}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DB_POOL_MIN: ${DB_POOL_MIN:-2}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  JARVIS_TRUST_CF_CONNECTING_IP: ${JARVIS_TRUST_CF_CONNECTING_IP:-false}
  TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-http://telegram_bot:8002}

services:
  # ==========================================================================
  # INFRASTRUCTURE (from n8n AI Starter Kit)
  # ==========================================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:1.77.0}
    profiles: ["n8n"]
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-jarvis}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-jarvis}
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared/pdf_storage:/data/pdfs
      - ./shared/snapshots:/data/snapshots
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.17.7}
    restart: unless-stopped
    mem_limit: 20g
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/11434 && printf 'GET /api/version HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  ollama-bootstrap:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.17.7}
    container_name: jarvis_ollama_bootstrap
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS: ${OLLAMA_MODELS:-mistral-nemo,qwen3:4b,nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for model in $$(echo "$$OLLAMA_MODELS" | tr "," " "); do
          echo "Pulling $$model..."
          ollama pull "$$model" || { echo "FAILED: $$model"; exit 1; }
        done
        echo "All models ready."
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis
    pull_policy: missing

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      # Qdrant reads the API key from this file path via its _FILE convention
      QDRANT__SERVICE__API_KEY_FILE: /run/secrets/qdrant_api_key
    secrets:
      - qdrant_api_key
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  # ==========================================================================
  # JARVIS ADDITIONS
  # ==========================================================================

  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-stable}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    secrets:
      - litellm_master_key
    command: ["--config", "/app/config.yaml"]
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  paper_ingestion:
    build:
      context: .
      dockerfile: services/paper_ingestion/Dockerfile
      args:
        INSTALL_OPTIONAL: ${INSTALL_OPTIONAL:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPER_INGESTION_HOST_PORT:-8010}:8000"
    environment:
      <<: *shared-env
      PDF_STORAGE_PATH: /data/pdfs
      SNAPSHOT_STORAGE_PATH: /data/snapshots
      AUTO_FETCH_INTERVAL_HOURS: ${AUTO_FETCH_INTERVAL_HOURS:-0}
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      JARVIS_CONFIG_KEY: ${JARVIS_CONFIG_KEY:-}
    secrets:
      - jarvis_api_key
      - postgres_password
      - telegram_bot_token
      - qdrant_api_key
    volumes:
      - ./shared/pdf_storage:/data/pdfs
      - ./shared/snapshots:/data/snapshots
      - ${LOCAL_PDF_PATH:-./shared/local_pdfs}:/data/local_pdfs:ro
      - ./db/migrations:/app/db/migrations:ro
      - marker_models:/tmp/appuser  # Persist Marker/Surya model cache across restarts
      - ./litellm:/app/litellm_config:ro  # shared config for model updates (SEC-002: ro)
    mem_limit: 6g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=10).raise_for_status()\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ollama-bootstrap:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  learning_engine:
    build:
      context: .
      dockerfile: services/learning_engine/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEARNING_ENGINE_HOST_PORT:-8011}:8001"
    environment:
      <<: *shared-env
    secrets:
      - jarvis_api_key
      - postgres_password
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8001/health').raise_for_status()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      paper_ingestion:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  telegram_bot:
    build:
      context: .
      dockerfile: services/telegram_bot/Dockerfile
    restart: unless-stopped
    profiles:
      - telegram
    environment:
      <<: *shared-env
      # TELEGRAM_BOT_TOKEN is injected via Docker Secret (_FILE convention) only
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    secrets:
      - jarvis_api_key
      - postgres_password
      - telegram_bot_token
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'telegram_bot.*app.py' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      learning_engine:
        condition: service_healthy
      paper_ingestion:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  dashboard:
    build:
      context: ./frontend
      args:
        NODE_BUILD_IMAGE: ${NODE_BUILD_IMAGE:-node:22.14-alpine3.21}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-nginx:1.27-alpine3.21}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_HOST_PORT:-3001}:3000"
    environment:
      JARVIS_CERT_SAN: ${JARVIS_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
      JARVIS_SKIP_SELFSIGNED_GEN: ${JARVIS_SKIP_SELFSIGNED_GEN:-false}
    volumes:
      - dashboard_certs:/etc/nginx/certs
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -ksf https://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      paper_ingestion:
        condition: service_healthy
      learning_engine:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - jarvis

  postgres-backup:
    image: ${POSTGRES_IMAGE:-postgres:16.8}
    profiles: [backup]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-jarvis}
      # PGPASSWORD is NOT set here; backup.sh reads /run/secrets/postgres_password
      PGDATABASE: ${POSTGRES_DB:-jarvis}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    secrets:
      - postgres_password
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - postgres_backups:/backups
    entrypoint: >
      sh -c "while true; do /usr/local/bin/backup.sh; sleep $${BACKUP_INTERVAL_SECONDS:-86400}; done"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.1.0}
    container_name: jarvis-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: [tunnel]
    networks: [jarvis]
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9-alpine}
    profiles: [letsencrypt]
    restart: unless-stopped
    ports:
      - "${LETSENCRYPT_HTTP_PORT:-80}:80"
      - "${LETSENCRYPT_HTTPS_PORT:-443}:443"
    environment:
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jarvis

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
  qdrant_data:
  postgres_backups:
  marker_models:
  dashboard_certs:
  caddy_data:
  caddy_config:

networks:
  jarvis:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  litellm_master_key:
    file: ./secrets/litellm_master_key.txt
  jarvis_api_key:
    file: ./secrets/jarvis_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  qdrant_api_key:
    file: ./secrets/qdrant_api_key.txt
