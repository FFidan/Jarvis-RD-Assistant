# MkDocs configuration — JARVIS RD Assistant operator/developer docs site.
#
# HYBRID NO-FILE-MOVE APPROACH
# ─────────────────────────────
# Canonical Markdown files stay exactly where they are in the repo.
# This site is a generated read-only aggregated view.
#
# Most operator/developer docs already live under docs/ (the docs_dir), so they
# are referenced directly in the nav below.
#
# Exceptions — files that live outside docs/:
#   README.md        (repo root)
#   db/migrations/README.md
#
# For those two, thin shim files live in docs/ and use the
# mkdocs-include-markdown-plugin directive. The rewrite-relative-urls flag
# differs per shim, on purpose:
#
#   readme-shim.md     uses rewrite-relative-urls=true   (README's relative links
#                      are rewritten so on-site links resolve)
#   migrations-shim.md uses rewrite-relative-urls=false  (its links point at repo
#                      paths that are not site pages; leave them as GitHub links)
#
#   {% include-markdown "../<path>" rewrite-relative-urls=<true|false> %}
#
# The shims are committed; `site/` (build output) is gitignored.
# No file is moved. No canonical content is duplicated.
# `mkdocs build --strict` validates this config at CI time.
#
# SCOPE: operator/developer docs + the end-user manual (see the User Guide nav).

site_name: JARVIS RD Assistant
site_description: >-
  Documentation for the self-hosted JARVIS RD Assistant research workspace,
  including user workflows, deployment, security, and engineering contracts.
site_url: "https://limitcycle-oss.github.io/Jarvis-RD-Assistant/"

# Repo link shown in the Material theme header
repo_url: https://github.com/limitcycle-oss/Jarvis-RD-Assistant
repo_name: limitcycle-oss/Jarvis-RD-Assistant
edit_uri: edit/main/

docs_dir: docs

# Link-validation tuning.
#
# `readme-shim.md` includes the repo-root README.md verbatim onto the on-site
# Quickstart page. The README links to repo files that are not site pages
# (SECURITY.md, CONTRIBUTING.md, CHANGELOG.md, .env.example, secrets/README.md,
# .github/ISSUE_TEMPLATE/*) — valid on GitHub, but "not found among documentation
# files" on the rendered site. (Contract-doc source-code references were converted
# to absolute GitHub blob URLs and are no longer flagged.)
#
# CI runs `mkdocs build --strict`, which turns warnings into errors, so
# links.not_found MUST stay 'ignore' here — otherwise the unavoidable README-shim
# links fail the build. nav.not_found stays 'warn' (default) so broken NAV entries
# still fail.
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

# Exclude directories that live under docs/ but are NOT part of this site:
#  - archive/   historical plans, audit reports, old roadmaps (not operator docs)
#  - plans/     in-flight implementation plans (internal working docs)
#  - specs/     dated transition specs (not evergreen)
#  - exec/      local execution ledgers and scratch notes
#  - perf/      profiling snapshots
#
# Without this exclusion, `mkdocs build --strict` would fail because those
# files contain relative links to source-code paths (not doc files) and MkDocs
# resolves them against docs_dir — producing hundreds of broken-link warnings.
exclude_docs: |
  /README.md
  USER_GUIDE.md
  archive/
  plans/
  specs/
  exec/
  perf/
  audit/
  personal/
  manual/_meta.md
  PRD.md
  # System Contracts: demoted from the public site (internal full-fidelity
  # spec docs). These files MUST STAY ON DISK — docs/contracts/07-testing.md is
  # parsed by scripts/check-test-shape.py (TS-08) and required by
  # scripts/check_contract_docs.py (PUBLIC_DOC_PATHS); deleting it breaks CI.
  # Excluding from the rendered site is safe; do not delete the directory.
  contracts/

# Curated public site — three audience tabs:
#   1. User Guide        the end-user product manual (manual/)
#   2. Install & Operate readme-shim + deployment/requirements/security
#   3. Contribute & Internals architecture/standards/migrations/release
# PRD.md and contracts/ are tracked on disk but excluded from the site
# (see exclude_docs above). archive/, plans/, specs/, perf/, audit/, personal/
# also remain excluded.
nav:
  - Home: index.md
  - Methods and limitations: METHODS_AND_LIMITATIONS.md
  - User Guide:
      - Overview: manual/index.md
      - Getting Started: manual/getting-started.md
      - My Day & Home: manual/home-my-day.md
      - Navigation: manual/navigation.md
      - Research Feed & Library: manual/research-feed.md
      - Paper Detail: manual/paper-detail.md
      - Ask — Cross-paper RAG: manual/ask.md
      - Pulse: manual/pulse.md
      - Learning Cards: manual/learning-cards.md
      - Projects: manual/projects.md
      - Knowledge Graph: manual/knowledge-graph.md
      - Citation Graph: manual/citation-graph.md
      - Consensus: manual/consensus.md
      - Extraction Table: manual/extraction-table.md
      - Analytics: manual/analytics.md
      - Settings: manual/settings.md
      - What your hardware gets you: manual/hardware-and-models.md
      - Hardware support matrix: manual/hardware-support-matrix.md
      - Context window: manual/context-window.md
      - Telegram: manual/telegram.md
      - Admin & Multi-tenant: manual/admin.md
  - Install & Operate:
      - Quickstart: readme-shim.md
      - Deployment: DEPLOYMENT.md
      - Requirements: REQUIREMENTS.md
      - Security: SECURITY.md
      - Risk Register: known-residual-risks.md
  - Contribute & Internals:
      - Contributing: contributing.md
      - Architecture: ARCHITECTURE.md
      - Engineering Standards: ENGINEERING_STANDARDS.md
      - Migrations: migrations-shim.md
      - Release Process: RELEASE.md
      - License / Notices: license-notices.md

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  # include-markdown: allows shim files in docs/ to pull content from
  # canonical files outside docs_dir (repo root, db/migrations/) at build
  # time — no file moves, no duplication. This is the only non-default plugin.
  - include-markdown

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
