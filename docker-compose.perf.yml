# Optional profiling override.
#
# Use only for local performance captures:
#   make profile-stack-up
#   make profile
#
# This file intentionally is not part of the default compose path. It enables
# Postgres pg_stat_statements preloading and grants ptrace capability to the
# paper_ingestion container for profiler experiments.

services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements

  paper_ingestion:
    profiles: ["perf"]
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    # In-process LLM hot-path span probes (perf_probe.py). The probe writes
    # JSONL inside the container; bind-mount a host dir so scripts/profile.sh
    # can collect it into the timestamped artifact dir. Off in the default
    # compose path — only this profiling override turns it on.
    environment:
      PERF_PROBE_ENABLED: "1"
      PERF_PROBE_PATH: /data/perf/perf-probe.jsonl
    volumes:
      - ./shared/perf:/data/perf
