# =============================================================================
# LiteLLM Proxy Configuration
# =============================================================================
# Model aliases: workflows use "smart", "fast", "embed" - never provider-specific
# model names. LiteLLM routes to the fastest responding provider per alias.
#
# To add a new provider, add another entry under model_list with the same
# model_name alias. LiteLLM will failover automatically.
# =============================================================================

model_list:
  # --- "smart" alias: best available model for summarization, card generation ---
  # Uncomment cloud providers below when you set API keys in .env

  # - model_name: "smart"
  #   litellm_params:
  #     model: "openai/gpt-4o"
  #     api_key: "os.environ/OPENAI_API_KEY"

  # - model_name: "smart"
  #   litellm_params:
  #     model: "anthropic/claude-sonnet-4-20250514"
  #     api_key: "os.environ/ANTHROPIC_API_KEY"

  # --- vLLM spike (Track-B Phase-2 — opt-in only, B2-1) ---
  # To enable: uncomment this block AND comment out the Ollama "smart" block
  # below. Requires docker-compose.vllm.yml overlay + --profile vllm running.
  # See docs/perf/2026-05-18-vllm-vs-ollama-decision.md for bench procedure.
  # VRAM note: Qwen2.5-7B-Instruct-AWQ (~4.5-5.5 GB) + qwen3-embedding:4b
  # (~2.4 GB) = ~7-8 GB total, fits 16 GB box. On 48 GB use FP16 variant.

  # - model_name: "smart"
  #   litellm_params:
  #     model: "openai/Qwen/Qwen2.5-7B-Instruct-AWQ"
  #     api_base: "http://vllm:8080/v1"
  #     api_key: "vllm-no-key"          # vLLM accepts any non-empty key
  #     temperature: 0.2
  #     max_tokens: 4096                # vLLM uses max_tokens, not num_ctx

  - model_name: "smart"
    litellm_params:
      # Default sized for a single 16 GB GPU that must ALSO keep
      # qwen3-embedding:4b GPU-resident (paper processing) plus Marker's Surya
      # extraction models. qwen3:14b @ 8k (~10-11 GB) starved the embedder →
      # it was evicted to 100% CPU and 32-chunk batches stalled past the old
      # 60 s timeout, failing whole papers. qwen3:8b (~5-6 GB) leaves headroom
      # so the embedder stays on GPU. Admins with more VRAM can switch the
      # smart role back to a 14B model via the in-app model picker
      # (Settings → llm.smart_model) — no file edit required.
      # num_ctx pairs with the app setting LLM_SMART_NUM_CTX (default 8192) — the app
      # budgets prompt input against it. Raise BOTH together on bigger GPUs (e.g.
      # 16384 ≈ +1-1.5 GB KV cache for qwen3:8b) and recreate this container.
      # At 8192, summaries/cards read roughly the first ~10-13k chars of a paper.
      model: "ollama/qwen3:8b"
      api_base: "http://ollama:11434"
      temperature: 0.2
      num_ctx: 8192
      extra_body:
        think: false                  # Ollama-native; LiteLLM forwards verbatim

  # --- "fast" alias: cheaper/faster model for simple tasks (relevance scoring, etc.) ---

  # - model_name: "fast"
  #   litellm_params:
  #     model: "openai/gpt-4o-mini"
  #     api_key: "os.environ/OPENAI_API_KEY"

  # - model_name: "fast"
  #   litellm_params:
  #     model: "anthropic/claude-haiku-4-5-20251001"
  #     api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "fast"
    litellm_params:
      model: "ollama/qwen3:4b"
      api_base: "http://ollama:11434"
      temperature: 0.1
      num_ctx: 4096
      extra_body:
        think: false

  # --- "embed" alias: embedding model for paper chunk vectors ---
  # WARNING: Embedding models are NOT interchangeable — latency routing must
  # never mix providers. Use only ONE embed provider at a time.
  # Uncomment the OpenAI entry below (and comment Ollama) to switch providers.
  # Its example dimension is provider/model specific, not the default local value.

  # - model_name: "embed"
  #   litellm_params:
  #     model: "openai/text-embedding-3-small"
  #     api_key: "os.environ/OPENAI_API_KEY"
  #     dimensions: 768  # Must match EMBEDDING_DIMENSION env var

  - model_name: "embed"
    litellm_params:
      model: "ollama/qwen3-embedding:4b"
      api_base: "http://ollama:11434"
      dimensions: 2560  # qwen3-embedding:4b outputs 2560d, must match EMBEDDING_DIMENSION
      # Pin the embedder in (GPU) memory indefinitely so a chat-model load
      # cannot evict it mid-paper. Forwarded to Ollama's /api/embeddings;
      # overrides the per-server OLLAMA_KEEP_ALIVE for this model only.
      keep_alive: -1

  # eval-only alias: used by scripts/reembed.py for embedding evaluation
  - model_name: "embed-4b"
    litellm_params:
      model: "ollama/qwen3-embedding:4b"
      api_base: "http://ollama:11434"
      dimensions: 2560  # qwen3-embedding:4b outputs 2560d

router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 3
  timeout: 300
  allowed_fails: 2
  retry_after: 5
  fallbacks:
    - {"smart": ["ollama/qwen3:4b"]}
    - {"fast": ["ollama/qwen3:4b"]}

general_settings:
  # master_key gates all LiteLLM admin endpoints (/config/update, /model/*, etc.).
  # Value is read from LITELLM_MASTER_KEY env var at runtime via LiteLLM's
  # os.environ/ reference syntax.  Loopback binding (127.0.0.1:4000) is kept
  # as defence-in-depth; the master_key adds a second layer.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
