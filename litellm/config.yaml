# =============================================================================
# LiteLLM Proxy Configuration
# =============================================================================
# Model aliases: workflows use "smart", "fast", "embed" - never provider-specific
# model names. LiteLLM routes to the fastest responding provider per alias.
#
# To add a new provider, add another entry under model_list with the same
# model_name alias. LiteLLM will failover automatically.
# =============================================================================

model_list:
  # --- "smart" alias: best available model for summarization, card generation ---
  # Uncomment cloud providers below when you set API keys in .env

  # - model_name: "smart"
  #   litellm_params:
  #     model: "openai/gpt-4o"
  #     api_key: "os.environ/OPENAI_API_KEY"

  # - model_name: "smart"
  #   litellm_params:
  #     model: "anthropic/claude-sonnet-4-20250514"
  #     api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "smart"
    litellm_params:
      model: "ollama/qwen3:14b"
      api_base: "http://ollama:11434"
      temperature: 0.2
      num_ctx: 32768

  # --- "fast" alias: cheaper/faster model for simple tasks (relevance scoring, etc.) ---

  # - model_name: "fast"
  #   litellm_params:
  #     model: "openai/gpt-4o-mini"
  #     api_key: "os.environ/OPENAI_API_KEY"

  # - model_name: "fast"
  #   litellm_params:
  #     model: "anthropic/claude-haiku-4-5-20251001"
  #     api_key: "os.environ/ANTHROPIC_API_KEY"

  - model_name: "fast"
    litellm_params:
      model: "ollama/qwen3:4b"
      api_base: "http://ollama:11434"
      temperature: 0.1
      num_ctx: 4096

  # --- "embed" alias: embedding model for paper chunk vectors ---
  # WARNING: Embedding models are NOT interchangeable — latency routing must
  # never mix providers. Use only ONE embed provider at a time.
  # Uncomment the OpenAI entry below (and comment Ollama) to switch providers.
  # Its example dimension is provider/model specific, not the default local value.

  # - model_name: "embed"
  #   litellm_params:
  #     model: "openai/text-embedding-3-small"
  #     api_key: "os.environ/OPENAI_API_KEY"
  #     dimensions: 768  # Must match EMBEDDING_DIMENSION env var

  - model_name: "embed"
    litellm_params:
      model: "ollama/qwen3-embedding:4b"
      api_base: "http://ollama:11434"
      dimensions: 2560  # qwen3-embedding:4b outputs 2560d, must match EMBEDDING_DIMENSION

  # eval-only alias: used by scripts/reembed.py for Phase D evaluation
  - model_name: "embed-4b"
    litellm_params:
      model: "ollama/qwen3-embedding:4b"
      api_base: "http://ollama:11434"
      dimensions: 2560  # qwen3-embedding:4b outputs 2560d

router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 3
  timeout: 300
  allowed_fails: 2
  retry_after: 5
  fallbacks:
    - {"smart": ["ollama/qwen3:8b", "ollama/qwen3:4b"]}
    - {"fast": ["ollama/qwen3:4b"]}

general_settings:
  # master_key gates all LiteLLM admin endpoints (/config/update, /model/*, etc.).
  # Value is read from LITELLM_MASTER_KEY env var at runtime via LiteLLM's
  # os.environ/ reference syntax.  Loopback binding (127.0.0.1:4000) is kept
  # as defence-in-depth; the master_key adds a second layer.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
