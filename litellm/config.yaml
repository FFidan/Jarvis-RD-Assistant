# =============================================================================
# LiteLLM Proxy Configuration
# =============================================================================
# Model aliases: workflows use "smart", "fast", "embed" - never provider-specific
# model names.
#
# IMPORTANT — where each alias lives:
#
#   * "smart", "fast", and "smart-fallback" are DELIBERATELY ABSENT from this
#     file. They are created in LiteLLM's admin database (POST /model/new) by
#     the paper_ingestion service at boot and whenever the model picker in
#     Settings changes an assignment. YAML-seeded deployments can never be
#     removed at runtime (/model/delete only deletes DB rows), so a YAML
#     "smart" would STACK with the DB "smart" and latency-based routing could
#     keep preferring the stale model — a switch would not be a switch. Do NOT
#     re-add switchable aliases here; scripts/render-litellm-config.sh scrubs
#     them on install/upgrade as a guard.
#
#   * "embed" / "embed-4b" stay YAML-seeded on purpose: the embedding model is
#     dimension-locked to the Qdrant collection (EMBEDDING_DIMENSION), so it
#     must never be switchable at runtime. Switching embedders is a deliberate
#     re-embed operation done by editing this file + re-embedding.
# =============================================================================

model_list:
  # --- "embed" alias: embedding model for paper chunk vectors ---
  # WARNING: Embedding models are NOT interchangeable — latency routing must
  # never mix providers. Use only ONE embed provider at a time.
  # Uncomment the OpenAI entry below (and comment Ollama) to switch providers.
  # Its example dimension is provider/model specific, not the default local value.

  # - model_name: "embed"
  #   litellm_params:
  #     model: "openai/text-embedding-3-small"
  #     api_key: "os.environ/OPENAI_API_KEY"
  #     dimensions: 768  # Must match EMBEDDING_DIMENSION env var

  - model_name: "embed"
    litellm_params:
      model: "ollama/qwen3-embedding:4b"
      api_base: "http://ollama:11434"
      dimensions: 2560  # qwen3-embedding:4b outputs 2560d, must match EMBEDDING_DIMENSION
      # Pin the embedder in (GPU) memory indefinitely so a chat-model load
      # cannot evict it mid-paper. Forwarded to Ollama's /api/embeddings;
      # overrides the per-server OLLAMA_KEEP_ALIVE for this model only.
      keep_alive: -1

  # eval-only alias: used by scripts/reembed.py for embedding evaluation
  - model_name: "embed-4b"
    litellm_params:
      model: "ollama/qwen3-embedding:4b"
      api_base: "http://ollama:11434"
      dimensions: 2560  # qwen3-embedding:4b outputs 2560d

router_settings:
  routing_strategy: "latency-based-routing"
  num_retries: 3
  timeout: 300
  allowed_fails: 2
  retry_after: 5
  # "smart-fallback" is a real deployment group created in the admin DB by the
  # paper_ingestion boot reconciler (fast-tier model, timeout 120). Raw
  # provider-model strings (e.g. "ollama/qwen3:4b") are NOT used here — their
  # resolution as fallback targets is unproven on the pinned image.
  fallbacks:
    - {"smart": ["smart-fallback"]}

general_settings:
  # master_key gates all LiteLLM admin endpoints (/model/new, /model/delete,
  # /v1/model/info, etc.).  Value is read from LITELLM_MASTER_KEY env var at
  # runtime via LiteLLM's os.environ/ reference syntax.  Loopback binding
  # (127.0.0.1:4000) is kept as defence-in-depth; the master_key adds a second
  # layer.
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
