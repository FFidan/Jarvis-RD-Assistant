# Vulnerability suppressions for the osv-scanner CI job (.github/workflows/security.yml).
# Keep entries in sync with the pip-audit --ignore-vuln flags in that workflow.
#
# There are currently no suppressions. The two this file used to carry were both
# tied to torch 2.11.0 and were removed when torch moved to 2.13.0: that release
# is past the last affected version of GHSA-rrmf-rvhw-rf47, and it no longer caps
# setuptools below 83.0.0, which is where PYSEC-2026-3447 is fixed. Both scanners
# now run unsuppressed, so a regression on either one fails the build.
